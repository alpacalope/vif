 tu viennes", "quiero que vengas"]]}}, {"h": "Forming it", "p": ["Take the ils form of the present, remove -ent, and add -e, -es, -e, -ions, -iez, -ent. For most verbs, the je, tu, il and ils forms sound like the present."], "table": {"head": ["Subject", "partir", "dormir"], "rows": [["que je", "parte", "dorme"], ["que tu", "partes", "dormes"], ["qu'il, qu'elle", "parte", "dorme"], ["que nous", "partions", "dormions"], ["que vous", "partiez", "dormiez"], ["qu'ils, qu'elles", "partent", "dorment"]]}}, {"h": "Irregular forms", "p": ["A handful of very common verbs are irregular. Learn the je form; the others follow."], "table": {"head": ["Verb", "que je", "que nous"], "rows": [["être", "sois", "soyons"], ["avoir", "aie", "ayons"], ["faire", "fasse", "fassions"], ["aller", "aille", "allions"], ["savoir", "sache", "sachions"], ["pouvoir", "puisse", "puissions"], ["venir", "vienne", "venions"]]}, "ex": [["Il faut que je sois à la gare à huit heures.", "I have to be at the station at eight."], ["Il faut que tu saches la vérité.", "You need to know the truth."]]}, {"h": "Same subject: use the infinitive", "p": ["When both verbs have the same subject, don't use que at all. Use the infinitive, exactly as in Spanish. Il vaut mieux is also followed by an infinitive."], "ex": [["Je veux partir.", "I want to leave."], ["Il vaut mieux arriver à l'heure.", "It's better to arrive on time."]]}, {"h": "Pour que and avant que", "p": ["Pour que (so that) and avant que (before) are always followed by the subjunctive, like para que and antes de que."], "ex": [["Parle lentement pour que je comprenne.", "Speak slowly so that I understand."]]}], "wrap": "Give a friend five pieces of advice for their first week in France, each with il faut que or il est important que."}, "18": {"intro": ["Reacting to what people tell you is at the heart of real conversation. This lesson extends the subjunctive to feelings and doubts, and shows you when French switches back to the ordinary indicative.", "Once again, Spanish is a reliable guide, with one notable exception: aunque."], "goals": ["Express emotions about someone else's actions", "Express doubt and possibility", "Tell certainty from doubt", "Use bien que and même si correctly"], "parts": [{"h": "Emotions + que + subjunctive", "p": ["After an emotion about what someone else does, French uses the subjunctive: être content que, être triste que, avoir peur que, c'est dommage que."], "ex": [["Je suis content que tu sois là.", "I'm glad you're here."], ["C'est dommage qu'elle ne puisse pas venir.", "It's a pity she can't come."]], "bridge": {"p": "The same as Spanish.", "pairs": [["je suis content que tu sois là", "me alegra que estés aquí"]]}}, {"h": "Doubt or certainty", "p": ["Doubt and possibility take the subjunctive: je doute que, il est possible que. Certainty takes the indicative: je suis sûr que, je sais que."], "table": {"head": ["Doubt: subjunctive", "Certainty: indicative"], "rows": [["Je doute qu'il réussisse.", "Je suis sûr qu'il réussira."], ["Il est possible qu'il vienne.", "Je sais qu'il viendra."]]}}, {"h": "Penser and croire", "p": ["In the affirmative, penser and croire state what you believe, so they take the indicative. In the negative or a question, they express doubt and take the subjunctive."], "ex": [["Je pense qu'il va réussir l'examen.", "I think he'll pass the exam."], ["Je ne crois pas que ce soit vrai.", "I don't think it's true."]], "bridge": {"p": "Exactly the Spanish rule.", "pairs": [["je crois que c'est vrai", "creo que es verdad"], ["je ne crois pas que ce soit vrai", "no creo que sea verdad"]]}}, {"h": "Bien que or même si", "p": ["Spanish aunque can mean both although and even if. French splits it: bien que always takes the subjunctive, même si always takes the indicative."], "ex": [["Bien qu'il fasse froid, nous allons à la plage.", "Although it's cold, we're going to the beach."], ["Même si c'est difficile, je vais essayer.", "Even if it's hard, I'm going to try."]]}], "wrap": "React to three pieces of news from your own life, once with joy, once with worry and once with doubt."}, "19": {"intro": ["Good stories don't run in a straight line. You often need to step back and explain what had already happened. That's the job of the plus-que-parfait, the last past tense you need for everyday storytelling.", "With it, and a few linking structures, you can narrate in all major time frames, a key Intermediate High skill."], "goals": ["Form and use the plus-que-parfait", "Order events with déjà and pas encore", "Use après avoir and avant de", "Tell a story that moves back in time"], "parts": [{"h": "The plus-que-parfait", "p": ["Use avoir or être in the imparfait, plus the past participle. The same verbs that take être in the passé composé take it here, with the same agreement."], "table": {"head": ["Subject", "oublier", "partir"], "rows": [["je", "avais oublié", "étais parti(e)"], ["tu", "avais oublié", "étais parti(e)"], ["il, elle", "avait oublié", "était parti(e)"], ["nous", "avions oublié", "étions parti(e)s"], ["vous", "aviez oublié", "étiez parti(e)(s)"], ["ils, elles", "avaient oublié", "étaient parti(e)s"]]}, "bridge": {"p": "This is the pluscuamperfecto, built the same way.", "pairs": [["elle avait oublié", "había olvidado"]]}}, {"h": "One step further back", "p": ["Use it for an event that happened before another past event. Déjà (already) and pas encore (not yet) often signal it."], "ex": [["Quand je suis arrivé, le train était déjà parti.", "When I arrived, the train had already left."], ["Je n'avais pas encore fini quand il est arrivé.", "I hadn't finished yet when he arrived."]]}, {"h": "Après avoir + participle", "p": ["After doing something is après avoir + participle, or après être + participle for être verbs. Spanish usually says después de + infinitive here; French needs the past form."], "ex": [["Après avoir mangé, nous sommes allés au cinéma.", "After eating, we went to the cinema."]]}, {"h": "Avant de + infinitive", "p": ["Before doing something is avant de + infinitive, exactly like antes de. If the subjects are different, use avant que + subjunctive, from the last lesson."], "ex": [["Avant de partir, ferme la porte.", "Before you leave, close the door."]]}, {"h": "Se rendre compte", "p": ["Se rendre compte que is the everyday way to say to realize, like darse cuenta de que. Don't use réaliser for this in careful French."], "ex": [["Je me suis rendu compte que j'avais perdu ma valise.", "I realized I had lost my suitcase."]]}], "wrap": "Tell a short story that starts in the middle, then uses the plus-que-parfait to explain what had happened before."}, "20": {"intro": ["Things go wrong when you travel: a cancelled flight, a missed connection, lost luggage. Handling a situation with a complication is exactly what separates Intermediate High from Advanced, and this lesson prepares you for it.", "You'll also learn pronouns that save you from repeating nouns: the one, the ones, mine and yours."], "goals": ["Explain a problem and negotiate a solution", "Use celui, celle, ceux and celles", "Use le mien, le tien and le sien", "Recognize the passive with être"], "parts": [{"h": "Handling a complication", "p": ["Work in three steps. First, explain the problem calmly and precisely. Second, if the first offer doesn't work, say why, politely. Third, propose or ask for an alternative. Words like malheureusement and heureusement help you frame each step."], "ex": [["Je voudrais me plaindre, mon vol a été annulé.", "I'd like to complain, my flight was cancelled."], ["Qu'est-ce que vous pouvez me proposer ?", "What can you offer me?"]]}, {"h": "The one: celui, celle", "p": ["Celui (masculine), celle (feminine), ceux and celles (plural) replace a noun you've just mentioned. They're always followed by qui, que or de."], "table": {"head": ["", "Singular", "Plural"], "rows": [["masculine", "celui", "ceux"], ["feminine", "celle", "celles"]]}, "ex": [["Je prends celui qui part à dix heures.", "I'll take the one that leaves at ten."], ["Ce sont ceux de mon ami.", "They're my friend's."]], "bridge": {"p": "These match Spanish el que, la que, el de.", "pairs": [["celui qui part à dix heures", "el que sale a las diez"], ["ceux de mon ami", "los de mi amigo"]]}}, {"h": "Mine, yours, his and hers", "p": ["Possessive pronouns agree with the thing owned, and include the article: le mien, la mienne, les miens, les miennes. In everyday speech, à moi and à toi also work."], "table": {"head": ["Owner", "Masculine", "Feminine"], "rows": [["mine", "le mien", "la mienne"], ["yours", "le tien", "la tienne"], ["his, hers", "le sien", "la sienne"]]}, "ex": [["Cette place est la mienne.", "This seat is mine."], ["Quelle valise est la tienne ?", "Which suitcase is yours?"]]}, {"h": "The passive for events", "p": ["To focus on what happened rather than who did it, use être + past participle. The participle agrees with the subject."], "ex": [["Mon vol a été annulé.", "My flight was cancelled."]], "bridge": {"p": "Built like the Spanish passive with ser.", "pairs": [["mon vol a été annulé", "mi vuelo ha sido cancelado"]]}}], "wrap": "Practice the three steps out loud: explain a lost-luggage problem, refuse a first offer, and ask for something better."}, "21": {"intro": ["Welcome to the Advanced level. The biggest change from here on is length: Advanced speakers don't answer in sentences, they answer in paragraphs. They can narrate a story from start to finish, with background, events and an ending, and keep the listener oriented in time.", "You already know every past tense you need. This lesson is about weaving them together, and about recognizing the literary past tense you'll meet in books."], "goals": ["Tell a story in connected paragraphs", "Use linking words to order events", "Express simultaneous actions and contrast", "Recognize the passé simple in reading"], "parts": [{"h": "From sentences to paragraphs", "p": ["A strong story has three layers. The imparfait paints the scene: the weather, the place, what people were doing. The passé composé moves the action forward. The plus-que-parfait steps back to explain what had happened before.", "Before you speak, think of your story as a scene, a series of events, and an ending."]}, {"h": "Linking words", "p": ["Connectors keep your listener oriented. Vary them, rather than repeating et puis."], "table": {"head": ["Stage", "Linking words"], "rows": [["Beginning", "au début, il était une fois"], ["Sequence", "ensuite, puis, après"], ["Surprise", "tout à coup, soudain, au moment où"], ["Ending", "finalement, enfin, à la fin"]]}, "ex": [["Au début, tout allait bien.", "At first, everything was going well."], ["Au moment où je partais, le téléphone a sonné.", "Just as I was leaving, the phone rang."]]}, {"h": "At the same time, or in contrast", "p": ["Pendant que and tandis que link two actions happening at the same time. Alors que and tandis que can also mark a contrast: whereas."], "ex": [["Je lisais pendant que ma sœur regardait la télé.", "I was reading while my sister watched TV."], ["Il pleuvait, alors que la météo avait annoncé du soleil.", "It was raining, whereas the forecast had said sun."]]}, {"h": "Life events", "p": ["Naître, mourir, revenir and se marier all take être in compound tenses, so their participles agree: elle est née, ils sont revenus."], "ex": [["Mon grand-père est né en 1950.", "My grandfather was born in 1950."], ["Elle s'est mariée à vingt-cinq ans.", "She got married at twenty-five."]]}, {"h": "The passé simple, for reading", "p": ["Novels, fairy tales and history books use the passé simple where speech uses the passé composé. You don't need to produce it, but you must recognize it. The il and ils forms are the ones you'll meet most."], "table": {"head": ["Infinitive", "il, elle", "ils, elles"], "rows": [["être", "fut", "furent"], ["avoir", "eut", "eurent"], ["faire", "fit", "firent"], ["décider", "décida", "décidèrent"], ["revenir", "revint", "revinrent"]]}, "bridge": {"p": "Unlike the Spanish pretérito, which everyone speaks, the passé simple is almost purely written.", "pairs": [["il décida", "decidió (written)"], ["il a décidé", "decidió (spoken)"]]}}], "reading": {"title": "Une soirée inattendue", "fr": "C'était un vendredi soir de novembre. Il pleuvait, et je n'avais aucune envie de sortir. Au moment où j'allais me coucher, le téléphone a sonné. C'était Marc, un ami que je n'avais pas vu depuis des années. Il venait d'arriver en ville et il voulait me voir. Au début, j'ai hésité, puis j'ai accepté. Nous avons passé toute la nuit à parler de notre vie. Finalement, cette soirée que je voulais passer seul est devenue l'une des plus belles de l'année.", "en": "It was a Friday evening in November. It was raining, and I had no desire to go out. Just as I was about to go to bed, the phone rang. It was Marc, a friend I hadn't seen in years. He had just arrived in town and wanted to see me. At first I hesitated, then I said yes. We spent the whole night talking about our lives. In the end, the evening I had wanted to spend alone became one of the best of the year."}, "wrap": "Read the story above out loud, then tell your own version of an unexpected evening, using at least four linking words."}, "22": {"intro": ["Advanced speakers can narrate and describe in all major time frames, and that includes the future. This lesson takes you beyond simple plans to sequences of future events: what will happen once something else has happened.", "It also contains one of the most important traps for Spanish speakers in the whole course."], "goals": ["Review the futur simple and its irregular stems", "Use the future after quand and dès que", "Form and use the futur antérieur", "Talk about plans and intentions"], "parts": [{"h": "Future stems to know by heart", "p": ["Most verbs build the future on the infinitive. These common verbs use an irregular stem, with the regular endings."], "table": {"head": ["Infinitive", "Stem", "je"], "rows": [["avoir", "aur-", "aurai"], ["être", "ser-", "serai"], ["aller", "ir-", "irai"], ["faire", "fer-", "ferai"], ["pouvoir", "pourr-", "pourrai"], ["venir", "viendr-", "viendrai"], ["voir", "verr-", "verrai"], ["savoir", "saur-", "saurai"]]}, "ex": [["On verra bien !", "We'll see!"]]}, {"h": "After quand: the future, not the present", "p": ["When quand, lorsque or dès que refer to the future, French uses the future tense after them. This is a major difference from Spanish, which uses the present subjunctive."], "ex": [["Quand j'arriverai, je t'appellerai.", "When I arrive, I'll call you."]], "bridge": {"p": "Spanish uses the subjunctive after cuando. French uses the future.", "pairs": [["quand j'arriverai", "cuando llegue"], ["dès que je pourrai", "en cuanto pueda"]]}}, {"h": "The futur antérieur", "p": ["To say something will have happened by a certain point, use avoir or être in the future plus the past participle. It's very common after dès que and quand, for the event that comes first."], "table": {"head": ["Subject", "finir"], "rows": [["je", "aurai fini"], ["tu", "auras fini"], ["il, elle", "aura fini"], ["nous", "aurons fini"], ["vous", "aurez fini"], ["ils, elles", "auront fini"]]}, "ex": [["Dès que j'aurai fini, je viendrai.", "As soon as I've finished, I'll come."], ["Dans cinq ans, j'aurai acheté une maison.", "In five years I will have bought a house."]], "bridge": {"p": "This is the futuro perfecto, but Spanish uses the perfect subjunctive after cuando.", "pairs": [["dans cinq ans, j'aurai acheté", "dentro de cinco años habré comprado"], ["dès que j'aurai fini", "en cuanto haya terminado"]]}}, {"h": "Talking about intentions", "p": ["For plans, vary your structures: aller + infinitive for what's decided, avoir l'intention de for intentions, prévoir de for what's planned."], "ex": [["Nous avons l'intention de déménager bientôt.", "We intend to move soon."]]}], "reading": {"title": "Dans cinq ans", "fr": "Dans cinq ans, j'espère que j'aurai enfin terminé mes études. Dès que j'aurai obtenu mon diplôme, je chercherai un travail à Montréal, parce que j'ai toujours voulu vivre au Québec. J'économise déjà de l'argent pour le voyage. Quand je serai installée, j'apprendrai à conduire, car là-bas, la voiture est indispensable. Et un jour, peut-être, j'achèterai un petit appartement. Mais je sais que les projets changent : on verra bien !", "en": "In five years, I hope I'll have finally finished my studies. As soon as I've got my degree, I'll look for a job in Montreal, because I've always wanted to live in Quebec. I'm already saving money for the trip. When I'm settled, I'll learn to drive, because there a car is essential. And someday, maybe, I'll buy a small apartment. But I know plans change: we'll see!"}, "wrap": "Describe your next five years in at least six sentences, with two using quand or dès que and the futur antérieur."}, "23": {"intro": ["Imagining situations that aren't real is a sign of a mature speaker. In this lesson you'll talk about dreams, give advice from someone else's point of view, and explore what would happen if.", "Here Spanish speakers have to unlearn one strong habit: French never uses the subjunctive after si."], "goals": ["Master the conditional", "Build si + imparfait sentences", "Give advice with à ta place", "Use au cas où"], "parts": [{"h": "The conditional, complete", "p": ["The conditional uses the future stem with the imparfait endings: -ais, -ais, -ait, -ions, -iez, -aient. Irregular future stems carry over."], "table": {"head": ["Subject", "faire", "être"], "rows": [["je", "ferais", "serais"], ["tu", "ferais", "serais"], ["il, elle", "ferait", "serait"], ["nous", "ferions", "serions"], ["vous", "feriez", "seriez"], ["ils, elles", "feraient", "seraient"]]}}, {"h": "Si + imparfait, then conditional", "p": ["For an imagined present or future situation, put the imparfait after si and the conditional in the other half. Either half can come first."], "ex": [["Si je gagnais au loto, je ferais le tour du monde.", "If I won the lottery, I'd travel around the world."], ["Les gens seraient plus heureux s'ils travaillaient moins.", "People would be happier if they worked less."]], "bridge": {"p": "Spanish uses the imperfect subjunctive after si. French uses the ordinary imparfait. Never put the conditional or the subjunctive right after si.", "pairs": [["si j'étais riche", "si fuera rico"], ["si j'avais plus de temps", "si tuviera más tiempo"]]}}, {"h": "The three si patterns", "p": ["You now know two of the three patterns. The third comes in the next lesson."], "table": {"head": ["After si", "Other half", "Meaning"], "rows": [["présent", "futur", "real possibility"], ["imparfait", "conditionnel", "imagined situation"], ["plus-que-parfait", "conditionnel passé", "unreal past"]]}}, {"h": "Advice and precautions", "p": ["À ta place and à votre place introduce advice as if you were the other person. Au cas où (in case) is followed by the conditional."], "ex": [["À ta place, je choisirais la deuxième.", "If I were you, I'd choose the second one."], ["Appelle-moi au cas où il y aurait un problème.", "Call me in case there's a problem."]], "bridge": {"p": "Spanish por si takes the indicative. French au cas où takes the conditional.", "pairs": [["au cas où il y aurait un problème", "por si hay un problema"]]}}], "reading": {"title": "Si j'étais riche", "fr": "Si j'étais riche, je ne changerais pas tout. Je garderais mes amis, bien sûr, et probablement mon appartement, que j'adore. Mais je quitterais mon travail pour quelque temps et je ferais le tour du monde. Je passerais un mois au Japon, un autre au Sénégal, et je finirais en Patagonie. Au retour, j'aiderais les gens de mon quartier qui en ont besoin. Si seulement c'était possible ! En attendant, je continue à jouer au loto chaque semaine.", "en": "If I were rich, I wouldn't change everything. I'd keep my friends, of course, and probably my apartment, which I love. But I'd leave my job for a while and travel around the world. I'd spend a month in Japan, another in Senegal, and I'd end up in Patagonia. When I got back, I'd help the people in my neighborhood who need it. If only it were possible! In the meantime, I keep playing the lottery every week."}, "wrap": "Write down three si sentences about your own life, check that none has a conditional right after si, and read them aloud."}, "24": {"intro": ["This lesson completes the system of hypotheses with the past: what would have happened if things had gone differently. It's the language of regrets, reproaches and lucky escapes.", "As in the last lesson, the key is to resist the Spanish subjunctive after si."], "goals": ["Form the conditionnel passé", "Build si + plus-que-parfait sentences", "Express regrets and reproaches", "Mix past conditions with present results"], "parts": [{"h": "The conditionnel passé", "p": ["Use avoir or être in the conditional, plus the past participle. Être verbs agree as usual."], "table": {"head": ["Subject", "venir", "faire"], "rows": [["je", "serais venu(e)", "aurais fait"], ["tu", "serais venu(e)", "aurais fait"], ["il, elle", "serait venu(e)", "aurait fait"], ["nous", "serions venu(e)s", "aurions fait"], ["vous", "seriez venu(e)(s)", "auriez fait"], ["ils, elles", "seraient venu(e)s", "auraient fait"]]}, "bridge": {"p": "This is the condicional perfecto.", "pairs": [["je serais venu", "habría venido"]]}}, {"h": "Si + plus-que-parfait", "p": ["For an unreal past, put the plus-que-parfait after si and the conditionnel passé in the other half."], "ex": [["Si j'avais su, je serais venu.", "If I had known, I would have come."], ["Si elle était partie plus tôt, elle n'aurait pas raté l'avion.", "If she'd left earlier, she wouldn't have missed the plane."]], "bridge": {"p": "Spanish uses the pluperfect subjunctive after si. French uses the ordinary plus-que-parfait.", "pairs": [["si j'avais su", "si hubiera sabido"]]}}, {"h": "Should have, could have", "p": ["J'aurais dû + infinitive expresses regret or reproach. J'aurais pu + infinitive is a missed possibility."], "ex": [["Tu aurais dû me le dire.", "You should have told me."], ["Nous aurions pu prendre le train.", "We could have taken the train."]]}, {"h": "Past condition, present result", "p": ["You can mix time frames: a past condition with a present consequence uses the plus-que-parfait and the ordinary conditional."], "ex": [["Si j'avais étudié, je parlerais mieux aujourd'hui.", "If I had studied, I'd speak better today."]]}, {"h": "Moving on", "p": ["Tant pis and au moins help you accept what can't be changed."], "ex": [["Tant pis, au moins on a essayé.", "Too bad, at least we tried."]]}], "reading": {"title": "Une occasion ratée", "fr": "Il y a dix ans, on m'a proposé un poste à Bruxelles. J'avais vingt-cinq ans et j'ai eu peur. J'ai refusé. Avec le recul, je me dis que j'aurais dû accepter. Si j'étais partie, j'aurais appris le néerlandais, j'aurais rencontré d'autres gens, et ma vie serait sans doute très différente aujourd'hui. Mais tant pis. Si je n'étais pas restée, je n'aurais jamais rencontré mon mari. Au moins, j'ai appris une chose : la prochaine occasion, je ne la raterai pas.", "en": "Ten years ago, I was offered a position in Brussels. I was twenty-five and I got scared. I turned it down. Looking back, I tell myself I should have accepted. If I had gone, I would have learned Dutch, I would have met other people, and my life would no doubt be very different today. But too bad. If I hadn't stayed, I would never have met my husband. At least I learned one thing: the next opportunity, I won't miss it."}, "wrap": "Tell a short story about a near miss, ending with one sentence about what would have happened if things had gone the other way."}, "25": {"intro": ["Much of what we say is about what other people said. Reporting a conversation, a message or a piece of news accurately is an everyday Advanced skill.", "The rules for shifting tenses are almost identical to Spanish, so this lesson is mostly about the French connecting words."], "goals": ["Report statements with dire que", "Shift tenses correctly", "Report questions with si, ce que and ce qui", "Shift time expressions"], "parts": [{"h": "Reporting statements", "p": ["Use a reporting verb + que. Que is never dropped, even when English drops that. Pronouns and possessives change to fit the new speaker."], "ex": [["Il a dit qu'il était fatigué.", "He said he was tired."]]}, {"h": "Shifting tenses", "p": ["When the reporting verb is in the past, tenses move one step back."], "table": {"head": ["Original", "Reported"], "rows": [["présent: je suis fatigué", "imparfait: qu'il était fatigué"], ["passé composé: j'ai réservé", "plus-que-parfait: qu'il avait réservé"], ["futur: je partirai", "conditionnel: qu'il partirait"], ["futur proche: je vais venir", "qu'il allait venir"]]}, "bridge": {"p": "Spanish shifts in exactly the same way.", "pairs": [["il a dit qu'il était fatigué", "dijo que estaba cansado"], ["elle a dit qu'elle partirait", "dijo que se iría"]]}}, {"h": "Reporting questions", "p": ["Yes-or-no questions use si (whether). Question words stay. What becomes ce que when it's the object, and ce qui when it's the subject. Never use qu'est-ce que in a reported question."], "table": {"head": ["Direct question", "Reported question"], "rows": [["Tu veux venir ?", "si je voulais venir"], ["Qu'est-ce que tu fais ?", "ce que je faisais"], ["Qu'est-ce qui s'est passé ?", "ce qui s'était passé"], ["Où vas-tu ?", "où j'allais"]]}, "bridge": {"p": "Ce que and ce qui both translate as lo que.", "pairs": [["ce qu'il faisait", "lo que hacía"], ["ce qui s'était passé", "lo que había pasado"]]}}, {"h": "Time words shift too", "p": ["When the moment of reporting is different, time expressions change."], "table": {"head": ["In direct speech", "In reported speech"], "rows": [["aujourd'hui", "ce jour-là"], ["demain", "le lendemain"], ["hier", "la veille"], ["la semaine prochaine", "la semaine suivante"]]}, "ex": [["Elle a annoncé qu'elle partirait le lendemain.", "She announced she'd leave the next day."]]}, {"h": "Citing sources", "p": ["Selon and d'après introduce what someone else says, like según. Apparemment marks something you've heard but not checked."], "ex": [["D'après la météo, il pleuvra demain.", "According to the forecast, it'll rain tomorrow."]]}], "reading": {"title": "Le message de Claire", "fr": "Hier soir, Claire m'a laissé un long message. Elle m'a dit qu'elle avait enfin trouvé un appartement et qu'elle déménagerait le mois suivant. Elle m'a demandé si je pouvais l'aider ce jour-là et si j'avais une voiture. Elle a ajouté qu'elle avait déjà réservé un camion, mais qu'elle ne savait pas conduire. Enfin, elle m'a promis qu'elle préparerait un bon repas pour me remercier. Je lui ai répondu que je viendrais avec plaisir.", "en": "Last night, Claire left me a long message. She told me she had finally found an apartment and would move the following month. She asked me whether I could help her that day and whether I had a car. She added that she had already booked a truck, but that she didn't know how to drive. Finally, she promised she'd make a good meal to thank me. I answered that I'd come gladly."}, "wrap": "Think of the last real conversation you had and report it in six sentences, with at least one reported question."}, "26": {"intro": ["Renting an apartment and dealing with the problems that come with it is a classic Advanced situation: a transaction with a complication, in a slightly formal register.", "The grammar focus is the last group of relative pronouns: dont, lequel and ce dont. They let you build precise, compact sentences."], "goals": ["Talk about renting and housing", "Use dont for de + noun and for whose", "Use lequel after prepositions", "Use ce qui, ce que and ce dont"], "parts": [{"h": "Dont", "p": ["Dont replaces de + a noun. Use it with verbs and expressions built with de, like parler de and avoir besoin de. It also means whose: the noun that follows keeps its article."], "ex": [["L'appartement dont je t'ai parlé est meublé.", "The apartment I told you about is furnished."], ["Ma voisine, dont le fils est médecin, est très gentille.", "My neighbor, whose son is a doctor, is very nice."]], "bridge": {"p": "Spanish cuyo agrees with the noun and drops the article. French dont never changes and keeps it.", "pairs": [["dont le fils", "cuyo hijo"], ["dont je t'ai parlé", "del que te hablé"]]}}, {"h": "Lequel after prepositions", "p": ["After a preposition, use lequel for things, agreeing in gender and number. With à and de it contracts, like au and du."], "table": {"head": ["", "Masculine", "Feminine", "Plural"], "rows": [["after dans, pour, avec", "lequel", "laquelle", "lesquels, lesquelles"], ["with à", "auquel", "à laquelle", "auxquels, auxquelles"], ["with de", "duquel", "de laquelle", "desquels, desquelles"]]}, "ex": [["L'immeuble dans lequel j'habite est très bruyant.", "The building I live in is very noisy."], ["Voilà la raison pour laquelle je déménage.", "That's the reason I'm moving."]], "bridge": {"p": "These are el cual, la cual.", "pairs": [["dans lequel", "en el cual"], ["pour laquelle", "por la cual"]]}}, {"h": "Ce qui, ce que, ce dont", "p": ["When there's no noun to refer back to, put ce in front. All three translate as lo que; pick by the job it does in the clause."], "table": {"head": ["Form", "Used when", "Example"], "rows": [["ce qui", "it's the subject", "ce qui m'inquiète"], ["ce que", "it's the object", "ce que je veux"], ["ce dont", "the verb takes de", "ce dont j'ai besoin"]]}, "ex": [["C'est ce dont j'ai besoin.", "That's what I need."]]}, {"h": "Asking firmly but politely", "p": ["With a landlord or a service, use vous, state facts with dates, and make requests with the conditional: pourriez-vous, je souhaiterais."], "ex": [["Le chauffage ne marche pas et il y a une fuite.", "The heating doesn't work and there's a leak."], ["Le propriétaire doit le réparer rapidement.", "The landlord must fix it quickly."]]}], "reading": {"title": "Annonce", "fr": "À louer : appartement meublé de deux pièces, dans un immeuble calme près de la gare. Loyer : 850 euros par mois, chauffage compris. Caution : un mois de loyer. L'appartement, dont la cuisine a été refaite l'année dernière, dispose d'une grande chambre et d'un balcon. Libre à partir du premier mars. Pour toute question ou pour fixer une visite, contactez la propriétaire par mail.", "en": "For rent: furnished two-room apartment in a quiet building near the station. Rent: 850 euros a month, heating included. Deposit: one month's rent. The apartment, whose kitchen was redone last year, has a large bedroom and a balcony. Available from March 1. For any questions or to arrange a visit, contact the landlady by email."}, "wrap": "Describe your ideal apartment in five sentences, using dont, lequel and ce que at least once each."}, "27": {"intro": ["French workplaces are more formal than many English-speaking ones, and written French has fixed formulas that people expect. Knowing them makes you sound competent immediately.", "This lesson gives you the structure of a professional email, the language of meetings, and the polite forms that make requests acceptable."], "goals": ["Choose the right register at work", "Write a professional email", "Make polite requests with veuillez and the conditional", "Talk about meetings and deadlines"], "parts": [{"h": "Register at work", "p": ["Use vous with clients, superiors and anyone you don't know well. Colleagues often switch to tu, but let them suggest it. In writing, stay formal even with people you tutoie in person."]}, {"h": "The shape of a formal email", "p": ["French emails follow a predictable structure. The opening and closing formulas carry a lot of weight."], "table": {"head": ["Part", "Formula"], "rows": [["Opening", "Madame, Monsieur, (or Madame Dupont,)"], ["First line", "Je vous écris au sujet de…"], ["Attachment", "Veuillez trouver ci-joint…"], ["Request", "Pourriez-vous me confirmer…"], ["Before closing", "Dans l'attente de votre réponse,"], ["Closing", "Cordialement, (or a longer formula in letters)"]]}, "bridge": {"p": "Openings line up with Spanish, but closings are more elaborate in formal French letters.", "pairs": [["Madame, Monsieur,", "Estimados señores:"], ["Cordialement,", "Saludos cordiales,"]]}}, {"h": "Polite requests", "p": ["Veuillez + infinitive is a formal please, mostly written. In speech, use the conditional: pourriez-vous, seriez-vous disponible, je souhaiterais."], "ex": [["Veuillez trouver ci-joint le rapport.", "Please find the report attached."], ["Pourriez-vous confirmer l'heure de la réunion ?", "Could you confirm the meeting time?"]]}, {"h": "Meetings and deadlines", "p": ["Fixer un rendez-vous is to set up a meeting; reporter is to postpone, a false friend for Spanish speakers. Le délai is a deadline or time frame."], "ex": [["Nous devons reporter la réunion.", "We have to postpone the meeting."], ["Le délai est vendredi.", "The deadline is Friday."]]}], "reading": {"title": "Un mail professionnel", "fr": "Madame Durand,\nJe vous remercie de votre message du 12 mars. Comme convenu, je vous confirme notre rendez-vous lundi prochain à dix heures dans nos bureaux. Je vous propose l'ordre du jour suivant : présentation du projet, calendrier, et budget. Veuillez trouver ci-joint notre proposition détaillée. N'hésitez pas à me contacter si vous avez la moindre question.\nDans l'attente de votre réponse,\nCordialement,\nThomas Martin", "en": "Ms. Durand,\nThank you for your message of March 12. As agreed, I confirm our meeting next Monday at ten in our offices. I suggest the following agenda: project presentation, timeline and budget. Please find our detailed proposal attached. Don't hesitate to contact me if you have any questions.\nLooking forward to your reply,\nBest regards,\nThomas Martin"}, "wrap": "Rewrite a casual message you'd send a colleague as a formal email, using at least four formulas from this lesson."}, "28": {"intro": ["Advanced Mid speakers move beyond their own lives to topics of community and national interest. The environment is a natural first step: everyone has an opinion, and the vocabulary is close to Spanish.", "Talking about policies and collective action calls for the passive voice and for clear ways to express cause."], "goals": ["Discuss environmental issues", "Use the passive in all tenses", "Use on and se to avoid the passive", "Express cause and change over time"], "parts": [{"h": "The passive", "p": ["Use être in any tense, plus the past participle, which agrees with the subject. The tense of être carries the time. To say who did it, add par."], "table": {"head": ["Tense", "Example"], "rows": [["présent", "Les déchets sont recyclés."], ["passé composé", "La loi a été votée."], ["futur", "De nouvelles mesures seront prises."], ["imparfait", "La rivière était polluée par les usines."]]}, "bridge": {"p": "Formed exactly like the Spanish passive with ser.", "pairs": [["cette loi a été votée", "esta ley fue votada"]]}}, {"h": "On and se instead of the passive", "p": ["Spoken French often avoids the passive. On is the most common alternative. Some verbs also use se, exactly like the Spanish pasiva refleja."], "ex": [["On consomme de plus en plus d'énergie.", "We're using more and more energy."], ["Les voitures électriques se vendent bien.", "Electric cars sell well."]], "bridge": {"p": "Se vendent works just like se venden.", "pairs": [["les voitures se vendent bien", "los coches se venden bien"]]}}, {"h": "Because of, thanks to", "p": ["À cause de introduces a negative cause, grâce à a positive one. Both are followed by a noun, and combine with le and les."], "ex": [["À cause du réchauffement climatique, les étés sont de plus en plus chauds.", "Because of global warming, summers are getting hotter."], ["Grâce aux énergies renouvelables, nous polluons moins.", "Thanks to renewable energy, we pollute less."]]}, {"h": "Describing change", "p": ["De plus en plus and de moins en moins describe a trend, like cada vez más and cada vez menos. Add de before a noun."], "ex": [["de plus en plus chauds", "hotter and hotter"], ["de plus en plus d'énergie", "more and more energy"]]}], "reading": {"title": "Une ville sans voitures", "fr": "Depuis l'année dernière, le centre-ville de Pontevedra, en Espagne, est presque entièrement interdit aux voitures. La mesure a d'abord été critiquée par les commerçants, qui avaient peur de perdre des clients. Pourtant, les résultats sont surprenants : la pollution a été réduite de moitié, le bruit a baissé, et de plus en plus de familles reviennent vivre dans le centre. Aujourd'hui, d'autres villes européennes étudient ce modèle. Reste à savoir s'il peut fonctionner dans une grande capitale.", "en": "Since last year, the center of Pontevedra, in Spain, has been almost entirely closed to cars. The measure was at first criticized by shopkeepers, who were afraid of losing customers. Yet the results are surprising: pollution has been cut in half, noise has fallen, and more and more families are moving back to the center. Today, other European cities are studying the model. It remains to be seen whether it can work in a large capital."}, "wrap": "Summarize the reading in four sentences, then give your opinion in four more, with at least one passive and one on."}, "29": {"intro": ["Following the news in French is one of the best ways to grow your vocabulary and your sense of the culture. News French has its own style: compact headlines, careful attribution, and a special use of the conditional.", "This lesson teaches you to read headlines, report events, and signal how sure you are."], "goals": ["Understand news vocabulary", "Use the conditional for unconfirmed facts", "Read headlines built on nouns", "Attribute information to a source"], "parts": [{"h": "The news conditional", "p": ["When a fact isn't confirmed, journalists use the conditional: le président aurait démissionné means the president has reportedly resigned. Present conditional for present facts, past conditional for past events."], "ex": [["Le président aurait démissionné.", "The president has reportedly resigned."], ["La présidente aurait annoncé de nouvelles mesures.", "The president is said to have announced new measures."]], "bridge": {"p": "Spanish news uses the same condicional de rumor.", "pairs": [["le président aurait démissionné", "el presidente habría dimitido"]]}}, {"h": "Headlines built on nouns", "p": ["Headlines replace verbs with nouns and drop articles. To read them, turn the noun back into a verb in your head."], "table": {"head": ["Verb", "Noun", "Headline"], "rows": [["augmenter, hausser", "la hausse", "Hausse des prix"], ["baisser", "la baisse", "Baisse du chômage"], ["faire grève", "la grève", "Grève des trains"], ["élire", "l'élection", "Élection du président"]]}, "ex": [["Hausse des prix : les Français inquiets.", "Prices up: the French are worried."]]}, {"h": "Citing sources", "p": ["Selon, d'après and il paraît que attribute information, and show you're reporting rather than asserting."], "ex": [["Selon les témoins, l'accident s'est passé à midi.", "According to witnesses, the accident happened at noon."], ["Il paraît que deux personnes ont été blessées.", "Apparently two people were injured."]]}, {"h": "Describing events", "p": ["Avoir lieu (to take place) and participer à (to take part in) are everyday news verbs. Une enquête can be a police investigation or a survey."], "ex": [["Des milliers de personnes ont participé à la manifestation.", "Thousands of people took part in the protest."]]}], "reading": {"title": "Grève dans les transports", "fr": "Une nouvelle grève aura lieu jeudi dans les transports publics. Selon les syndicats, près de la moitié des trains seront annulés. Le mouvement, qui proteste contre la hausse des prix et la baisse du pouvoir d'achat, devrait également toucher les bus et le métro. D'après le ministère, des négociations seraient en cours, mais aucun accord n'a été trouvé pour le moment. Les voyageurs sont invités à reporter leurs déplacements.", "en": "A new strike will take place on Thursday in public transport. According to the unions, nearly half of trains will be cancelled. The movement, which is protesting rising prices and falling purchasing power, is also expected to affect buses and the subway. According to the ministry, negotiations are reportedly under way, but no agreement has been reached for now. Travelers are asked to postpone their trips."}, "wrap": "Find a headline in today's French news, rewrite it as a full sentence, and say whether the information is confirmed."}, "30": {"intro": ["Education is a topic where every country does things differently, which makes it perfect for comparing and arguing. This lesson gives you the vocabulary of schools and learning.", "Grammatically, it tackles the gerund, the form that tells how or while you do something, and fixes one of the most persistent mistakes Spanish speakers make in French."], "goals": ["Discuss education and society", "Form and use the gerund", "Express the progressive without the gerund", "Recognize the present participle in writing"], "parts": [{"h": "Forming the gerund", "p": ["Take the nous form of the present, remove -ons, add -ant, and put en in front. Three verbs are irregular."], "table": {"head": ["Infinitive", "nous form", "Gerund"], "rows": [["écouter", "écoutons", "en écoutant"], ["faire", "faisons", "en faisant"], ["finir", "finissons", "en finissant"], ["être", "(irregular)", "en étant"], ["avoir", "(irregular)", "en ayant"], ["savoir", "(irregular)", "en sachant"]]}}, {"h": "How and while", "p": ["The gerund tells how something is done, or what was happening at the same time. Its subject is always the same as the main verb's."], "ex": [["J'ai appris le français en écoutant la radio.", "I learned French by listening to the radio."], ["En arrivant à l'école, j'ai vu mes amis.", "As I arrived at school, I saw my friends."]], "bridge": {"p": "This is the Spanish gerundio of manner, with en in front.", "pairs": [["en écoutant la radio", "escuchando la radio"]]}}, {"h": "The progressive trap", "p": ["Spanish estoy estudiando does not translate with the gerund. French uses the simple present, or être en train de + infinitive to stress that it's happening right now. Je suis étudiant means I'm a student."], "ex": [["J'étudie.", "I'm studying."], ["Je suis en train d'étudier.", "I'm in the middle of studying."]], "bridge": {"p": "Never translate estar + gerundio word for word.", "pairs": [["je suis en train d'étudier", "estoy estudiando"]]}}, {"h": "Tout en", "p": ["Tout en + participle stresses that two things happen at once, often with a hint of contrast."], "ex": [["Elle travaille tout en faisant ses études.", "She works while also studying."]]}, {"h": "The present participle in writing", "p": ["Without en, the -ant form can replace qui + verb in formal writing: une personne parlant français, a person who speaks French. Recognize it in texts; in speech, qui is more natural."]}], "reading": {"title": "Le baccalauréat", "fr": "En France, l'école est gratuite et obligatoire de trois à seize ans. À la fin du lycée, les élèves passent le baccalauréat, un examen national que tout le monde appelle le bac. En le réussissant, ils peuvent entrer à l'université, qui coûte très peu, car elle est financée par l'État. Ce système, qui veut garantir l'égalité entre les élèves, est pourtant critiqué : selon plusieurs études, les enfants de familles favorisées continuent à mieux réussir que les autres.", "en": "In France, school is free and compulsory from ages three to sixteen. At the end of high school, students take the baccalauréat, a national exam everyone calls the bac. By passing it, they can go to university, which costs very little because it's funded by the state. This system, which aims to guarantee equality between pupils, is nonetheless criticized: according to several studies, children from advantaged families continue to do better than the others."}, "wrap": "Describe how you learn French using at least four gerunds, then say one thing you're en train de faire right now."}, "31": {"intro": ["Explaining why things happen and what follows from them is the backbone of any serious discussion. This lesson uses public health as its theme and gives you a full toolkit for cause, consequence and purpose.", "These connectors are what make your speech sound organized rather than like a list of facts."], "goals": ["Express cause in several ways", "Express consequence", "Express purpose with afin de and afin que", "Use faire + infinitive"], "parts": [{"h": "Cause", "p": ["Parce que answers a question. Puisque gives a reason the listener already knows. Comme starts the sentence with the cause. With a noun, use à cause de or grâce à."], "table": {"head": ["Word", "Followed by", "Example"], "rows": [["parce que", "a clause", "parce qu'il était fatigué"], ["puisque", "a known reason", "puisque tu es malade"], ["comme", "a clause, at the start", "Comme il était fatigué,…"], ["à cause de", "a noun", "à cause du stress"]]}, "ex": [["Puisque tu es malade, reste à la maison.", "Since you're sick, stay home."]]}, {"h": "Consequence", "p": ["Donc and c'est pourquoi are the most common. Par conséquent is more formal. Si bien que joins a cause and its result in one sentence."], "ex": [["La population vieillit, c'est pourquoi nous avons besoin de plus d'hôpitaux.", "The population is aging, that's why we need more hospitals."], ["Il a beaucoup plu, si bien que les routes étaient dangereuses.", "It rained a lot, so the roads were dangerous."]]}, {"h": "Purpose", "p": ["Afin de is a more formal pour. With an infinitive when the subject is the same; with afin que or pour que + subjunctive when it changes."], "ex": [["Mange mieux afin d'éviter des problèmes.", "Eat better to avoid problems."], ["Le médecin a tout expliqué afin que je comprenne.", "The doctor explained everything so I'd understand."]], "bridge": {"p": "Exactly like a fin de and a fin de que.", "pairs": [["afin que je comprenne", "a fin de que entienda"]]}}, {"h": "Faire + infinitive", "p": ["Faire + infinitive means to have something done. Se faire vacciner is to get vaccinated; se faire couper les cheveux is to get a haircut."], "ex": [["Il faut se faire vacciner.", "You need to get vaccinated."]], "bridge": {"p": "Spanish often uses a simple reflexive where French needs faire.", "pairs": [["se faire vacciner", "vacunarse"]]}}], "reading": {"title": "Un système sous pression", "fr": "Le système de santé français est souvent cité comme l'un des meilleurs du monde, puisque presque tous les soins sont remboursés. Pourtant, il est aujourd'hui sous pression. Comme la population vieillit, les maladies chroniques sont de plus en plus nombreuses, si bien que les hôpitaux manquent de personnel. C'est pourquoi le gouvernement mise sur la prévention : afin de réduire les coûts, il encourage une meilleure alimentation et la pratique du sport.", "en": "The French health care system is often cited as one of the best in the world, since almost all care is reimbursed. Yet today it is under pressure. As the population ages, chronic illnesses are increasingly common, so hospitals are short of staff. That's why the government is betting on prevention: in order to reduce costs, it encourages a better diet and regular exercise."}, "wrap": "Explain one health habit you'd like to change, why, and what you'll do about it, using one word each for cause, consequence and purpose."}, "32": {"intro": ["Advanced High speakers don't just say they liked something; they explain why, with precise and nuanced language. This lesson gives you the vocabulary to talk about books, films and art the way a critic would.", "You'll also learn to form adverbs and place them correctly, which instantly makes your French more expressive."], "goals": ["Present and evaluate a work", "Use nuanced adjectives", "Form adverbs in -ment", "Place adverbs correctly"], "parts": [{"h": "Evaluating precisely", "p": ["Replace bon and intéressant with words that say exactly what you mean. Combine them with nuance: à la fois, plutôt, un peu, vraiment."], "table": {"head": ["Positive", "Negative"], "rows": [["émouvant", "décevant"], ["passionnant", "ennuyeux"], ["réussi", "raté"], ["excellent", "médiocre"]]}, "ex": [["Ce roman est à la fois émouvant et drôle.", "This novel is both moving and funny."], ["J'ai trouvé la fin un peu décevante.", "I found the ending a bit disappointing."]]}, {"h": "Adverbs in -ment", "p": ["Add -ment to the feminine form of the adjective. Adjectives ending in a vowel use the masculine. Those ending in -ant and -ent become -amment and -emment."], "table": {"head": ["Adjective", "Adverb"], "rows": [["profond, profonde", "profondément"], ["heureux, heureuse", "heureusement"], ["vrai", "vraiment"], ["constant", "constamment"], ["évident", "évidemment"]]}, "bridge": {"p": "The same idea as Spanish -mente.", "pairs": [["profondément", "profundamente"]]}}, {"h": "Where adverbs go", "p": ["In simple tenses, the adverb goes right after the verb. In compound tenses, short common adverbs go between avoir or être and the participle."], "ex": [["Je recommande fortement cette pièce.", "I strongly recommend this play."], ["La critique a beaucoup aimé ce roman.", "Critics really liked this novel."]], "bridge": {"p": "Spanish never splits haber from the participle. French does.", "pairs": [["j'ai beaucoup aimé", "me gustó mucho"]]}}, {"h": "Gender traps", "p": ["Le personnage is always masculine, even for a woman. L'œuvre is feminine. Many art words are close to Spanish but with a different gender, so check them."]}], "reading": {"title": "Critique", "fr": "Avec son troisième roman, l'autrice confirme son talent. L'intrigue, qui se passe dans un petit village breton, est simple : une femme revient dans la maison de son enfance après la mort de sa mère. Mais le livre est profondément émouvant, car il parle avec une grande justesse du temps qui passe et des secrets de famille. On regrette seulement une fin un peu rapide. Ce roman vaut néanmoins largement la peine d'être lu.", "en": "With her third novel, the author confirms her talent. The plot, set in a small Breton village, is simple: a woman returns to her childhood home after her mother's death. But the book is deeply moving, because it speaks with great accuracy about the passing of time and family secrets. The only regret is a somewhat rushed ending. This novel is nonetheless well worth reading."}, "wrap": "Write a five-sentence review of the last thing you watched or read, with at least two adverbs in -ment."}, "33": {"intro": ["French is spoken on five continents, by more people outside France than inside it. Understanding the French-speaking world, la francophonie, is part of understanding the language itself: its accents, its words and its history.", "This lesson also prepares you to read history, which means recognizing the passé simple."], "goals": ["Present a French-speaking country", "Use prepositions with countries confidently", "Talk about dates and centuries", "Read the passé simple in historical texts"], "parts": [{"h": "Countries, again", "p": ["The rules from lesson 7 apply everywhere: en for feminine countries, au for masculine ones. Y replaces the place: on y parle français."], "table": {"head": ["Country", "Gender", "In or to"], "rows": [["la Belgique", "f", "en Belgique"], ["la Suisse", "f", "en Suisse"], ["le Sénégal", "m", "au Sénégal"], ["le Maroc", "m", "au Maroc"], ["le Québec", "m", "au Québec"]]}, "ex": [["Au Maroc, on parle arabe et français.", "In Morocco, people speak Arabic and French."]]}, {"h": "Dates and centuries", "p": ["Years take en with no article: en 1960. Centuries use au and ordinal numbers, often written in Roman numerals: au XVIIe siècle, au dix-septième siècle."], "ex": [["Le Sénégal est devenu indépendant en 1960.", "Senegal became independent in 1960."], ["Québec a été fondée au dix-septième siècle.", "Quebec City was founded in the seventeenth century."]], "bridge": {"p": "Spanish also uses en for years, but no article for centuries.", "pairs": [["au dix-septième siècle", "en el siglo diecisiete"]]}}, {"h": "The passé simple in history", "p": ["History books tell events in the passé simple. You met its il forms in lesson 21. Here are more of the forms you'll see most."], "table": {"head": ["Infinitive", "il, elle", "ils, elles"], "rows": [["être", "fut", "furent"], ["devenir", "devint", "devinrent"], ["fonder", "fonda", "fondèrent"], ["prendre", "prit", "prirent"], ["naître", "naquit", "naquirent"], ["mourir", "mourut", "moururent"]]}, "ex": [["Il fut le premier président du pays.", "He was the country's first president."]]}, {"h": "One language, many accents", "p": ["Each francophone country has its own accent and its own words. In Quebec, a weekend is une fin de semaine; in Belgium and Switzerland, 70 is septante and 90 is nonante. Recognizing these variations is an Advanced skill."], "ex": [["Chaque pays a son propre accent.", "Each country has its own accent."]]}], "reading": {"title": "Léopold Sédar Senghor", "fr": "Léopold Sédar Senghor naquit en 1906 au Sénégal, alors colonie française. Brillant élève, il partit étudier à Paris, où il devint le premier Africain à réussir l'agrégation. Poète, il fonda avec Aimé Césaire le mouvement de la Négritude, qui célébrait les cultures africaines. En 1960, quand le Sénégal devint indépendant, il fut élu premier président du pays. Il fut aussi l'un des pères de la francophonie moderne.", "en": "Léopold Sédar Senghor was born in 1906 in Senegal, then a French colony. A brilliant student, he went to study in Paris, where he became the first African to pass the agrégation. A poet, he founded the Négritude movement with Aimé Césaire, which celebrated African cultures. In 1960, when Senegal became independent, he was elected the country's first president. He was also one of the fathers of the modern francophone world."}, "wrap": "Retell the reading in the passé composé, as you would in conversation, then add two facts about another francophone figure."}, "34": {"intro": ["Being able to talk about numbers and trends precisely is essential for professional and civic conversations. This lesson gives you the language of the economy and the job market.", "It's mostly vocabulary and a few key structures, but they make the difference between vague and convincing."], "goals": ["Use percentages and fractions", "Describe rises, falls and stability", "Say by how much something changed", "Express ongoing change with en train de"], "parts": [{"h": "Numbers and fractions", "p": ["Percentages are said pour cent. Fractions use la moitié, le tiers and le quart, followed by de."], "table": {"head": ["Figure", "French"], "rows": [["50 %", "la moitié"], ["33 %", "un tiers"], ["25 %", "un quart"], ["2 %", "deux pour cent"], ["300 000 000", "trois cents millions"]]}, "ex": [["Un tiers des salariés travaillent à distance.", "A third of employees work remotely."]]}, {"h": "Describing trends", "p": ["Augmenter, baisser and doubler describe change; rester stable describes its absence. The nouns la hausse and la baisse are common in writing."], "ex": [["Les prix ont doublé en dix ans.", "Prices have doubled in ten years."], ["Le taux de chômage est resté stable.", "The unemployment rate has remained stable."]]}, {"h": "By how much: de", "p": ["To give the size of a change, French uses de where Spanish uses en or un."], "ex": [["Le chômage a baissé de deux pour cent.", "Unemployment fell by two percent."]], "bridge": {"p": "Spanish: subió un 3 %. French: a augmenté de 3 %.", "pairs": [["a augmenté de trois pour cent", "subió un tres por ciento"]]}}, {"h": "Change in progress", "p": ["Être en train de + infinitive describes something happening over this period, the closest French gets to estar + gerundio."], "ex": [["Le marché de l'emploi est en train de changer.", "The job market is changing."]]}, {"h": "Singular or plural verb", "p": ["After la moitié des, un tiers des and la plupart des, the verb usually agrees with the plural noun that follows. The singular is also accepted with la moitié."], "ex": [["La moitié des jeunes cherchent un emploi.", "Half of young people are looking for work."]]}], "reading": {"title": "Le télétravail", "fr": "Depuis la crise sanitaire, le télétravail s'est installé durablement en France. Selon une enquête récente, un tiers des salariés travaillent désormais à distance au moins un jour par semaine, contre moins de dix pour cent avant 2020. Les entreprises y voient un moyen de réduire leurs coûts, tandis que les salariés apprécient de gagner du temps. Reste un problème : la moitié des emplois ne peuvent pas se faire à distance, ce qui crée de nouvelles inégalités.", "en": "Since the health crisis, remote work has become firmly established in France. According to a recent survey, a third of employees now work remotely at least one day a week, compared with less than ten percent before 2020. Companies see it as a way to cut costs, while employees appreciate saving time. One problem remains: half of all jobs can't be done remotely, which creates new inequalities."}, "wrap": "Describe three figures from your own life or work and how they've changed, using de to give the size of each change."}, "35": {"intro": ["Persuading someone isn't about repeating your opinion louder. It's about acknowledging the other side and then showing why your view still holds. That move, conceding and then refuting, is a hallmark of Advanced High speakers.", "This lesson gives you the connectors that make it possible, and the moods that go with them."], "goals": ["Build a persuasive argument", "Concede a point with certes and bien que", "Contrast ideas with cependant and en revanche", "Use malgré and avoir beau"], "parts": [{"h": "The shape of persuasion", "p": ["State your claim. Concede what's true on the other side. Then refute it, showing why your claim still stands. Certes… mais is the simplest way to do this in one sentence."], "ex": [["Certes, il y a des avantages, mais aussi des inconvénients.", "Admittedly, there are advantages, but also drawbacks."]]}, {"h": "Concession and its moods", "p": ["Bien que and quoique take the subjunctive. Même si takes the indicative. Malgré takes a noun."], "table": {"head": ["Word", "Followed by", "Example"], "rows": [["bien que, quoique", "subjunctive", "quoiqu'il soit jeune"], ["même si", "indicative", "même si c'est cher"], ["malgré", "a noun", "malgré la pluie"]]}, "ex": [["Malgré la pluie, nous sommes allés à la plage.", "Despite the rain, we went to the beach."]], "bridge": {"p": "Spanish aunque covers all three. French makes you choose.", "pairs": [["quoiqu'il soit jeune", "aunque sea joven"], ["malgré la pluie", "a pesar de la lluvia"]]}}, {"h": "Opposition", "p": ["Mais is neutral. Pourtant and cependant mark a surprising contrast. En revanche and par contre compare two sides; par contre is more spoken."], "ex": [["Il travaille beaucoup ; cependant, il gagne peu.", "He works a lot; however, he earns little."], ["Par contre, la ville est beaucoup plus chère.", "On the other hand, the city is much more expensive."]]}, {"h": "Avoir beau", "p": ["Avoir beau + infinitive means however much you do something, it doesn't help. It's very French, and very effective."], "ex": [["J'ai beau essayer, je ne comprends pas.", "However hard I try, I don't understand."]], "bridge": {"p": "The closest Spanish is por más que.", "pairs": [["j'ai beau essayer", "por más que lo intento"]]}}, {"h": "Reinforcing", "p": ["En effet confirms what you just said. D'ailleurs adds a further argument. Au contraire rejects the opposite view."], "ex": [["En effet, les chiffres le confirment.", "Indeed, the figures confirm it."]]}], "reading": {"title": "Faut-il interdire la voiture en ville ?", "fr": "Certes, la voiture reste indispensable pour beaucoup de gens, en particulier ceux qui vivent loin du centre. Bien que les transports publics se soient améliorés, ils ne desservent pas tous les quartiers. Pourtant, les chiffres sont clairs : malgré les progrès des moteurs, la pollution tue chaque année des milliers de personnes. On a beau construire de nouvelles routes, les embouteillages ne disparaissent pas. En revanche, les villes qui ont réduit la place de la voiture ont vu la qualité de vie s'améliorer.", "en": "Admittedly, cars remain essential for many people, especially those who live far from the center. Although public transport has improved, it doesn't serve every neighborhood. Yet the figures are clear: despite progress in engines, pollution kills thousands of people every year. However many new roads are built, traffic jams don't disappear. On the other hand, cities that have reduced the space given to cars have seen their quality of life improve."}, "wrap": "Write one paragraph on a topic you care about: claim, concession with certes or bien que, and refutation with pourtant or en revanche."}, "36": {"intro": ["Welcome to the Superior level. Superior speakers can support an opinion with extended, structured argument, discuss abstract ideas, and do it all in a register suited to a formal audience. Mistakes, if any, never get in the way of the message.", "This lesson gives you the architecture of a French argument, and two uses of the subjunctive that mark truly advanced French."], "goals": ["Structure an extended argument", "Use formal connectors precisely", "Use the subjunctive after superlatives", "Use the subjunctive after negative and indefinite antecedents"], "parts": [{"h": "The French way to argue", "p": ["French education trains students in the dissertation: a thesis, an antithesis that examines the opposite view, and a synthesis that goes beyond both. Even in speech, this habit shapes how educated French speakers argue. A nuanced conclusion is valued more than a forceful one."]}, {"h": "Connectors by function", "p": ["Formal argument relies on precise signposts. Choose them by the job they do."], "table": {"head": ["Function", "Connectors"], "rows": [["Ordering", "en premier lieu, ensuite, enfin"], ["Adding", "en outre, de plus, d'ailleurs"], ["Balancing", "d'une part… d'autre part"], ["Conceding", "certes, il est vrai que"], ["Maintaining", "il n'en reste pas moins que"], ["Concluding", "en somme, en définitive"]]}, "ex": [["D'une part, la technologie nous libère ; d'autre part, elle nous rend dépendants.", "On the one hand, technology frees us; on the other, it makes us dependent."], ["Il n'en reste pas moins que le progrès a un coût.", "The fact remains that progress has a cost."]]}, {"h": "Subjunctive after superlatives", "p": ["After a superlative, or le seul, le premier and le dernier, French uses the subjunctive in the following relative clause, to express a subjective judgment."], "ex": [["C'est le meilleur livre que j'aie jamais lu.", "It's the best book I've ever read."]], "bridge": {"p": "Spanish uses the indicative here. French prefers the subjunctive.", "pairs": [["le meilleur livre que j'aie lu", "el mejor libro que he leído"]]}}, {"h": "Subjunctive after nobody and anyone", "p": ["When the antecedent is negative, or may not exist, the relative clause takes the subjunctive."], "ex": [["Je ne connais personne qui puisse répondre.", "I don't know anyone who can answer."]], "bridge": {"p": "Here Spanish does exactly the same.", "pairs": [["je ne connais personne qui puisse", "no conozco a nadie que pueda"]]}}, {"h": "Nuancing", "p": ["Superior speakers rarely make absolute claims. Nuancer, dans la mesure où and il convient de distinguer let you limit and refine a position."], "ex": [["Je voudrais nuancer ce point de vue.", "I'd like to qualify that point of view."], ["Dans la mesure où la liberté individuelle est menacée, nous devons réagir.", "Insofar as individual freedom is threatened, we must react."]]}], "reading": {"title": "La technologie nous rend-elle libres ?", "fr": "D'une part, il est indéniable que la technologie a élargi notre liberté : jamais l'accès au savoir n'a été aussi simple, et jamais nous n'avons pu communiquer aussi facilement. D'autre part, cette liberté a un prix. Nos choix sont de plus en plus orientés par des algorithmes que nous ne comprenons pas, et notre attention est devenue une marchandise. Il n'en reste pas moins que la technologie n'est qu'un outil : c'est l'usage que nous en faisons, individuellement et collectivement, qui détermine si elle nous libère ou nous asservit.", "en": "On the one hand, it's undeniable that technology has expanded our freedom: access to knowledge has never been so easy, and we have never been able to communicate so easily. On the other hand, this freedom comes at a price. Our choices are increasingly steered by algorithms we don't understand, and our attention has become a commodity. The fact remains that technology is only a tool: it's the use we make of it, individually and collectively, that determines whether it frees or enslaves us."}, "wrap": "Outline an argument on a topic of your choice in three parts: thesis, antithesis, synthesis, with one formal connector in each."}, "37": {"intro": ["Hypothesizing about abstract questions is one of the defining functions of the Superior level. It's not just what would you do if you won the lottery, but what would happen to society if.", "This lesson gives you the conjunctions that frame hypotheses precisely, and the subtle moods that come with them."], "goals": ["Frame hypotheses with formal conjunctions", "Use the expletive ne", "Use quand bien même", "Distinguish probability from possibility"], "parts": [{"h": "Hypothetical conjunctions", "p": ["These conjunctions all take the subjunctive. They let you set up a scenario and reason inside it."], "table": {"head": ["Conjunction", "Meaning"], "rows": [["à supposer que", "supposing that"], ["en admettant que", "assuming that"], ["pourvu que", "provided that, let's hope"], ["à moins que", "unless"], ["sans que", "without"]]}, "ex": [["À supposer que les machines remplacent les humains, que ferions-nous ?", "Supposing machines replaced humans, what would we do?"], ["Pourvu qu'il arrive à l'heure !", "Let's hope he arrives on time!"]], "bridge": {"p": "Spanish uses the subjunctive after the same conjunctions.", "pairs": [["à moins qu'il pleuve", "a menos que llueva"], ["sans que personne le remarque", "sin que nadie lo note"]]}}, {"h": "The expletive ne", "p": ["After à moins que, avant que and verbs of fearing, formal French often adds a ne that has no negative meaning. It's optional, and dropping it is common in speech, but you'll see it in careful writing."], "ex": [["Nous irons à moins qu'il ne pleuve.", "We'll go unless it rains."]]}, {"h": "Quand bien même", "p": ["Quand bien même is a formal even if, followed by the conditional. In everyday French, même si + imparfait says the same thing."], "ex": [["Quand bien même il s'excuserait, je ne lui pardonnerais pas.", "Even if he apologized, I wouldn't forgive him."]]}, {"h": "Probable or possible", "p": ["A subtle but important distinction: il est probable que takes the indicative, because it leans toward certainty. Il est possible que takes the subjunctive."], "table": {"head": ["Expression", "Mood"], "rows": [["il est probable que", "indicative: évoluera"], ["il est possible que", "subjunctive: évolue"]]}, "ex": [["Il est probable que la société évoluera rapidement.", "Society will probably change quickly."]]}], "reading": {"title": "Un monde sans travail", "fr": "Imaginons un instant que les machines puissent accomplir la quasi-totalité des tâches humaines. À supposer qu'un revenu universel garantisse à chacun de quoi vivre, que ferions-nous de notre temps ? Les plus optimistes affirment que nous nous consacrerions enfin à l'art, à la science et aux autres. Les plus pessimistes craignent, au contraire, une perte de sens. Quand bien même nos besoins matériels seraient satisfaits, il n'est pas certain que nous serions plus heureux.", "en": "Let's imagine for a moment that machines could carry out almost all human tasks. Supposing a universal income guaranteed everyone enough to live on, what would we do with our time? The most optimistic claim we would finally devote ourselves to art, science and others. The most pessimistic fear, on the contrary, a loss of meaning. Even if our material needs were met, it's not certain we would be any happier."}, "wrap": "Pick an abstract what-if, such as a world without money or without borders, and write three sentences with three different hypothetical conjunctions."}, "38": {"intro": ["At the Superior level, precision matters more than ever. Abstract topics like ethics demand exact words, and the ability to pack ideas densely into a sentence without losing clarity.", "This lesson works on both: the vocabulary of technology and ethics, and the structures that make formal French compact."], "goals": ["Discuss ethical questions about technology", "Write in a nominal, compact style", "Use auquel, duquel and grâce auquel", "Use abstract collocations naturally"], "parts": [{"h": "Nominal style", "p": ["Formal French often turns verbs into nouns. It makes writing more compact and more abstract. Learn the noun with each verb."], "table": {"head": ["Verb phrase", "Noun phrase"], "rows": [["on protège les données", "la protection des données"], ["on surveille la population", "la surveillance de la population"], ["les algorithmes sont transparents", "la transparence des algorithmes"], ["on encadre l'IA", "l'encadrement de l'IA"]]}}, {"h": "Lequel with à and de", "p": ["When the verb takes à or de, lequel contracts. Use these for things; for people, qui is more natural after a preposition."], "table": {"head": ["Verb", "Relative"], "rows": [["penser à", "la question à laquelle je pense"], ["grâce à", "l'outil grâce auquel on gagne du temps"], ["parler de, près de", "le bâtiment près duquel j'habite"]]}, "ex": [["La question à laquelle je pense est éthique.", "The question I'm thinking about is ethical."], ["C'est un outil grâce auquel on gagne du temps.", "It's a tool thanks to which we save time."]], "bridge": {"p": "These match al cual and del cual.", "pairs": [["grâce auquel", "gracias al cual"], ["à laquelle je pense", "en la cual pienso"]]}}, {"h": "Abstract collocations", "p": ["Certain verbs go with certain nouns. Using the right pair is what makes formal French sound native."], "table": {"head": ["Verb", "Noun"], "rows": [["soulever", "une question, un risque"], ["poser", "un problème, une question"], ["garantir", "un droit, la transparence"], ["faire confiance", "à quelqu'un, à un système"]]}, "ex": [["L'intelligence artificielle soulève de nombreux risques.", "AI raises many risks."], ["La surveillance de masse pose un problème de liberté.", "Mass surveillance poses a problem of freedom."]]}, {"h": "Faire confiance à", "p": ["To trust is faire confiance à, with à. Never use a direct object with it."], "ex": [["Les utilisateurs doivent pouvoir faire confiance aux algorithmes.", "Users must be able to trust algorithms."]], "bridge": {"p": "Spanish uses en; French uses à.", "pairs": [["faire confiance aux algorithmes", "confiar en los algoritmos"]]}}], "reading": {"title": "Encadrer l'intelligence artificielle", "fr": "L'intelligence artificielle soulève des questions auxquelles nos lois n'avaient pas été préparées. À qui appartiennent les données grâce auxquelles les algorithmes apprennent ? Qui est responsable lorsqu'une machine se trompe ? L'Union européenne a choisi d'encadrer ces technologies en fonction du risque qu'elles présentent. Pour ses défenseurs, cette approche garantit les droits fondamentaux des citoyens. Pour ses détracteurs, elle risque de freiner l'innovation dans un domaine où l'Europe est déjà en retard.", "en": "Artificial intelligence raises questions our laws weren't prepared for. Who owns the data from which algorithms learn? Who is responsible when a machine makes a mistake? The European Union has chosen to regulate these technologies according to the risk they pose. For its supporters, this approach guarantees citizens' fundamental rights. For its critics, it risks slowing innovation in a field where Europe is already behind."}, "wrap": "Rewrite three short sentences from your own writing in nominal style, then use two of the collocations from this lesson."}, "39": {"intro": ["Explaining political and institutional questions fairly, without slipping into opinion, is a demanding Superior task. It requires neutral vocabulary, impersonal structures and the discipline to present each side in its own best terms.", "This lesson gives you those tools, with the institutions of France as a reference point."], "goals": ["Use institutional vocabulary", "Use impersonal constructions", "Choose the right mood after il semble que", "Present opposing positions neutrally"], "parts": [{"h": "Impersonal constructions", "p": ["Formal French uses impersonal il to state facts and principles without attributing them to anyone."], "table": {"head": ["Construction", "Followed by", "Meaning"], "rows": [["il s'agit de", "noun or infinitive", "it's a matter of"], ["il convient de", "infinitive", "it is appropriate to"], ["il importe que", "subjunctive", "it matters that"], ["il semble que", "subjunctive", "it seems that"], ["il me semble que", "indicative", "I think that"]]}, "ex": [["Il s'agit de défendre les droits des citoyens.", "It's a matter of defending citizens' rights."], ["Il importe que chaque citoyen vote.", "It matters that every citizen vote."]], "bridge": {"p": "Il s'agit de is se trata de, and it never takes a personal subject.", "pairs": [["il s'agit de défendre", "se trata de defender"]]}}, {"h": "Il semble que or il me semble que", "p": ["A subtle trap: il semble que expresses an impression and takes the subjunctive, while il me semble que expresses a personal opinion and takes the indicative."], "ex": [["Il semble qu'un compromis soit possible.", "It seems a compromise may be possible."], ["Il me semble qu'un compromis est possible.", "I think a compromise is possible."]]}, {"h": "Presenting positions neutrally", "p": ["Attribute each view to its holders: les partisans de, les opposants à, ses défenseurs, ses détracteurs. Use neutral verbs like estimer, considérer and faire valoir, and save evaluative words for your own conclusion."], "ex": [["L'opposition s'oppose à cette réforme.", "The opposition opposes this reform."], ["L'opinion publique est divisée sur cette question.", "Public opinion is divided on this issue."]]}, {"h": "French institutions in brief", "p": ["France is a semi-presidential republic: a directly elected president, a prime minister, and a parliament of two chambers, the Assemblée nationale and the Sénat. Laws are adopted by the parliament, sometimes after long debates and compromises between parties."], "ex": [["Le Parlement a adopté la loi à une large majorité.", "Parliament passed the law by a large majority."]]}], "reading": {"title": "Le débat sur la retraite", "fr": "En France, l'âge de la retraite fait l'objet de débats récurrents. Les partisans d'un recul de l'âge légal font valoir que la population vieillit et que le système doit rester financé. Leurs adversaires estiment au contraire qu'il s'agit d'une injustice pour ceux qui exercent des métiers pénibles, et proposent d'autres sources de financement. Il semble qu'aucune solution ne fasse l'unanimité : chaque réforme s'accompagne de grèves et de manifestations importantes.", "en": "In France, the retirement age is the subject of recurring debates. Supporters of raising the legal age argue that the population is aging and the system must remain funded. Their opponents believe, on the contrary, that it's an injustice for those in physically demanding jobs, and propose other sources of funding. It seems no solution wins unanimous support: every reform is accompanied by major strikes and protests."}, "wrap": "Present a debate you know well in four neutral sentences, with two impersonal constructions and no evaluative words."}, "40": {"intro": ["One of the clearest signs of Superior proficiency is the ability to tailor your language to your audience: relaxed with friends, neutral in daily life, polished in formal settings. French has unusually distinct registers, and switching between them is a skill in its own right.", "This lesson maps the three registers and teaches you to recognize, and use, the features of each."], "goals": ["Distinguish familiar, standard and formal French", "Recognize features of spoken French", "Use formal structures appropriately", "Recognize verlan and literary forms"], "parts": [{"h": "Three registers", "p": ["The same idea can be said in three ways. Standard French is always safe; familiar French belongs with friends; formal French belongs in writing and official settings."], "table": {"head": ["Familier", "Courant", "Soutenu"], "rows": [["J'sais pas.", "Je ne sais pas.", "Je l'ignore."], ["la bagnole", "la voiture", "le véhicule"], ["le boulot", "le travail", "l'emploi"], ["T'as vu ?", "Tu as vu ?", "Avez-vous vu ?"], ["ça", "ça, cela", "cela"]]}, "bridge": {"p": "Spanish has the same layers.", "pairs": [["le boulot", "el curro"], ["le fric", "la pasta"]]}}, {"h": "Features of spoken French", "p": ["In casual speech, ne disappears, tu becomes t' before a vowel, on replaces nous, and ça replaces cela. Du coup (so) and genre (like) fill the gaps."], "ex": [["T'es où ? Je te cherche partout.", "Where are you? I'm looking for you everywhere."], ["Ouais, c'est sympa, ce boulot.", "Yeah, this job's nice."]]}, {"h": "Features of formal French", "p": ["Formal French uses inversion in questions, cela rather than ça, nous rather than on, the full negation, and the expletive ne. Set phrases like je me permets de and puis-je mark politeness."], "ex": [["Puis-je vous poser une question ?", "May I ask you a question?"], ["Cela dit, il convient de rester poli.", "That said, one should remain polite."]]}, {"h": "Recognizing verlan", "p": ["Verlan reverses syllables: l'envers becomes verlan. You don't need to use it, but you'll hear it in films and songs."], "table": {"head": ["Verlan", "Standard", "Meaning"], "rows": [["relou", "lourd", "annoying"], ["ouf", "fou", "crazy"], ["meuf", "femme", "woman"], ["chelou", "louche", "shady, weird"]]}}, {"h": "Literary forms", "p": ["In literature you'll meet the imperfect subjunctive, as in qu'il fût and qu'il eût, used where speech has qu'il soit and qu'il ait. Recognize it; never use it in conversation."]}], "reading": {"title": "Un message, trois registres", "fr": "À un ami : « Salut ! Je fais une petite fête samedi soir chez moi, tu viens ? Ramène qui tu veux ! »\nÀ une collègue : « Bonjour Claire, j'organise une petite soirée samedi chez moi. Ça me ferait plaisir que tu viennes, si tu es disponible. »\nÀ un invité important : « Madame, j'ai l'honneur de vous convier à une réception qui se tiendra samedi à vingt heures. Je vous serais reconnaissant de bien vouloir me confirmer votre présence. »", "en": "To a friend: \"Hi! I'm having a little party Saturday night at my place, are you coming? Bring whoever you want!\"\nTo a colleague: \"Hello Claire, I'm organizing a small get-together at my place on Saturday. I'd be happy if you came, if you're free.\"\nTo an important guest: \"Madam, I have the honor of inviting you to a reception to be held on Saturday at eight p.m. I would be grateful if you would kindly confirm your attendance.\""}, "wrap": "Take one sentence you said today and rewrite it in all three registers."}, "41": {"intro": ["Idioms are where a language shows its personality. Native speakers use them constantly, and understanding them, let alone using them well, is a mark of Superior proficiency.", "Spanish gives you a head start: many French idioms have a Spanish twin. Others are uniquely French and have to be learned."], "goals": ["Un
