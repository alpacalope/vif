derstand and use common idioms", "Spot idioms with Spanish equivalents", "Learn idioms with no Spanish twin", "Avoid advanced false friends"], "parts": [{"h": "Idioms with a Spanish twin", "p": ["Many French idioms match Spanish almost word for word. These are the easiest to remember."], "table": {"head": ["French", "Spanish"], "rows": [["coûter les yeux de la tête", "costar un ojo de la cara"], ["il pleut des cordes", "llueve a cántaros"], ["être dans la lune", "estar en la luna"], ["se casser la tête", "romperse la cabeza"]]}, "ex": [["Ce voyage a coûté les yeux de la tête.", "This trip cost an arm and a leg."], ["Il pleut des cordes, restons à la maison.", "It's pouring, let's stay home."]]}, {"h": "Uniquely French", "p": ["Others have no Spanish equivalent and need to be learned as units. Their images can be surprising: to stand someone up is literally to put a rabbit on them."], "table": {"head": ["Idiom", "Literal", "Meaning"], "rows": [["poser un lapin", "to put a rabbit", "to stand someone up"], ["tomber dans les pommes", "to fall into the apples", "to faint"], ["avoir le cafard", "to have the cockroach", "to feel down"], ["avoir la flemme", "to have the phlegm", "to not be bothered"]]}, "ex": [["Il m'a posé un lapin hier.", "He stood me up yesterday."]]}, {"h": "Using idioms well", "p": ["Idioms are mostly informal. Use them in conversation and informal writing, not in a formal report. One well-placed idiom sounds natural; five in a row sounds like a textbook."], "ex": [["J'en ai marre de ce travail.", "I'm fed up with this job."], ["Le dimanche, je fais la grasse matinée.", "On Sundays, I sleep in."]]}, {"h": "Advanced false friends", "p": ["Some words look the same in French, Spanish and English but don't mean the same in all three."], "table": {"head": ["French", "Means", "Not"], "rows": [["actuellement", "currently (like actualmente)", "actually"], ["éventuellement", "possibly", "eventually"], ["la librairie", "bookshop", "library (la bibliothèque)"], ["sensible", "sensitive (like sensible)", "sensible"]]}, "ex": [["Elle est actuellement à la bibliothèque.", "She's currently at the library."]]}], "reading": {"title": "Une journée à oublier", "fr": "Ce matin, j'avais vraiment la flemme de me lever. Évidemment, il pleuvait des cordes. Au bureau, mon patron m'a cassé les pieds toute la matinée avec un dossier sur lequel je me casse la tête depuis des semaines. À midi, mon ami Paul m'a posé un lapin. Le soir, j'ai voulu m'acheter un livre pour me consoler, mais il coûtait les yeux de la tête. Bref, j'en ai eu marre, et je suis rentré me coucher. Demain, je fais la grasse matinée.", "en": "This morning, I really couldn't be bothered to get up. Of course, it was pouring. At the office, my boss annoyed me all morning about a file I've been racking my brain over for weeks. At noon, my friend Paul stood me up. In the evening, I wanted to buy myself a book to cheer up, but it cost an arm and a leg. In short, I was fed up and went home to bed. Tomorrow, I'm sleeping in."}, "wrap": "Describe your week in five sentences using three idioms, then check each one fits the informal register."}, "42": {"intro": ["This final lesson brings together everything the course has built: sustained, organized speech on a complex topic, in a formal register, holding up under questions. That's the Superior level in practice.", "You'll learn the classic structure of a French exposé, the language that guides an audience through it, and how to handle questions with poise."], "goals": ["Structure a formal presentation", "Guide your audience with signposts", "Hedge and nuance claims", "Handle questions and objections"], "parts": [{"h": "The structure of an exposé", "p": ["French presentations follow a well-known plan. The introduction is the most important part: it must catch attention, state the central question, and announce the plan."], "table": {"head": ["Part", "What it does"], "rows": [["Accroche", "Catches attention: a fact, a quote, a question"], ["Problématique", "States the central question"], ["Annonce du plan", "Announces the two or three parts"], ["Développement", "Develops each part with examples"], ["Conclusion", "Sums up and opens a new question"]]}}, {"h": "Signposting", "p": ["Listeners can't reread, so tell them where you are. These phrases mark each stage clearly."], "ex": [["Dans un premier temps, j'aborderai l'histoire du problème.", "First, I'll address the history of the problem."], ["Dans un second temps, nous approfondirons cette idée.", "Second, we'll go deeper into this idea."], ["En guise de conclusion, rappelons les points essentiels.", "By way of conclusion, let's recall the key points."]]}, {"h": "Hedging and nuance", "p": ["Superior speakers rarely overstate. Il semblerait que (with the subjunctive), dans une certaine mesure and en définitive let you make claims with appropriate caution."], "ex": [["Il semblerait que les résultats confirment notre hypothèse.", "It would seem the results confirm our hypothesis."], ["Dans une certaine mesure, vous avez raison.", "To some extent, you're right."]]}, {"h": "Handling questions", "p": ["Acknowledge the question, rephrase it if needed, answer directly, and bring it back to your thesis. If you don't know, say so and offer a lead."], "ex": [["C'est une remarque très pertinente.", "That's a very relevant comment."], ["Votre question me permet d'illustrer mon propos.", "Your question lets me illustrate my point."]]}], "reading": {"title": "Introduction d'un exposé", "fr": "« Chaque minute, nous produisons plus de données qu'au cours de toute l'histoire de l'humanité jusqu'en 2000. Ce chiffre vertigineux soulève une question simple : sommes-nous encore maîtres de nos informations ? Dans un premier temps, nous verrons comment les données sont devenues une ressource économique majeure. Dans un second temps, nous nous demanderons quelles règles permettraient de mieux les protéger. Enfin, en guise de conclusion, nous proposerons quelques pistes pour l'avenir. »", "en": "\"Every minute, we produce more data than in all of human history up to 2000. This dizzying figure raises a simple question: are we still in control of our information? First, we'll see how data has become a major economic resource. Second, we'll ask which rules would allow us to protect it better. Finally, by way of conclusion, we'll suggest a few avenues for the future.\""}, "wrap": "You've reached the end of the course. Give your final presentation in Speak: if you can hold a structured, formal talk and handle challenging questions, you're working at the Superior level."}};
const MODES=[["learn","Learn"],["words","Words"],["type","Type"],["listen","Listen"],["write","Write"],["speak","Speak"]];
const LEVELS=["Foundation","Novice mid to high","Novice high to intermediate low","Intermediate low to mid","Intermediate mid to high","Advanced low","Advanced mid to high","Superior"];

/* ---------- state (same storage key as before, so progress carries over) ---------- */
const STORE="vif-progress-v1";
let S={u:{},last:null,drafts:{},fb:{}};
try{const raw=localStorage.getItem(STORE); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
S.fb=S.fb||{}; S.drafts=S.drafts||{};
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){} queueSync();}

/* ---------- account sync: progress lives in your Claude account, so every device shares it ---------- */
let remote=null, syncTimer=null, syncing=Promise.resolve();
function mergeState(a,b){ // a = this device, b = account copy
  const out={m:Object.assign({},b.m||{},a.m||{}),fsel:a.fsel||b.fsel,qsel:a.qsel||b.qsel,qlen:a.qlen||b.qlen,qlast:a.qlast||b.qlast,u:{},pos:a.pos||b.pos||null,last:a.last!=null?a.last:(b.last!=null?b.last:null),drafts:Object.assign({},b.drafts||{},a.drafts||{}),fb:Object.assign({},b.fb||{},a.fb||{})};
  const ids=new Set([...Object.keys(a.u||{}),...Object.keys(b.u||{})]);
  ids.forEach(k=>{const x=(a.u||{})[k]||{},y=(b.u||{})[k]||{};
    const un=f=>[...new Set([...(x[f]||[]),...(y[f]||[])])];
    out.u[k]={w:un("w"),t:un("t"),l:un("l"),wr:Math.max(x.wr||0,y.wr||0),seen:!!(x.seen||y.seen)};});
  return out;}
function queueSync(){ if(!remote) return; clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ const body={state:JSON.stringify(S),at:Date.now()};
    syncing=syncing.then(()=>remote.set(body)).catch(()=>{}); },1200);}
(async()=>{try{
  if(!(window.claude&&claude.use)) return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  const ref=db.doc("data/users/"+id+"/vif"); const snap=await ref.get();
  let acct=null; if(snap.exists){try{acct=JSON.parse(String(snap.data().state||"{}"));}catch(e){}}
  const before=JSON.stringify(S);
  if(acct) S=mergeState(S,acct);
  try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}
  remote=ref;
  if(!acct||JSON.stringify(S)!==JSON.stringify(acct)) queueSync();
  if(JSON.stringify(S)!==before && view.name==="home") renderHome();
  if(!before.includes('"pos"') && S.pos && view.name==="home") resume();
}catch(e){remote=null;}})();
function us(id){return S.u[id]||(S.u[id]={w:[],t:[],l:[],wr:0});}
function mark(id,k,i){const u=us(id); if(!u[k].includes(i)){u[k].push(i); save();}}
function unitPct(unit){const u=S.u[unit.id]; if(!u) return 0;
  const p=.2*(u.w.length/unit.words.length)+.3*(u.t.length/unit.type.length)+.3*(u.l.length/unit.listen.length)+(u.wr>0?.2:0);
  return Math.round(Math.min(1,p)*100);}
function coursePct(){return Math.round(UNITS.reduce((a,u)=>a+unitPct(u),0)/UNITS.length);}
function currentId(){ if(S.last!=null && unitPct(UNITS[S.last])<80) return S.last;
  const u=UNITS.find(u=>unitPct(u)<80); return u?u.id:UNITS.length-1; }

/* ---------- speech ---------- */
const synth=("speechSynthesis" in window)?window.speechSynthesis:null; let frVoice=null;
const VOICE_NAMES=["thomas","aurelie","nicolas","audrey"];
const vnorm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s*\((enhanced|premium|amelioree)\)/,"").trim();
function vqual(v){const n=(v.name+" "+v.voiceURI).toLowerCase(); return /premium/.test(n)?"Premium":/enhanced|améliorée|amelioree/.test(n)?"Enhanced":"Standard";}
function frVoices(){ frVoices.fallback=false; if(!synth) return [];
  const R={"fr-fr":"France","fr-ca":"Canada","fr-be":"Belgium","fr-ch":"Switzerland"}, rank={"Premium":0,"Enhanced":1,"Standard":2}, best={};
  synth.getVoices().filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("fr")).forEach(v=>{
    const key=vnorm(v.name); if(!VOICE_NAMES.includes(key)) return;
    if(!best[key]||rank[vqual(v)]<rank[vqual(best[key])]) best[key]=v; });
  const fmt=v=>({v,name:v.name.replace(/\s*\((enhanced|premium|améliorée)\)/i,""),qual:vqual(v),region:R[v.lang.toLowerCase().replace("_","-")]||v.lang});
  const mine=VOICE_NAMES.filter(k=>best[k]).map(k=>fmt(best[k]));
  if(mine.length) return mine;
  frVoices.fallback=true;
  return synth.getVoices().filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("fr")).map(fmt)
    .sort((a,b)=>rank[a.qual]-rank[b.qual]||a.region.localeCompare(b.region)||a.name.localeCompare(b.name));}
function pickVoice(){if(!synth)return;
  const mine=frVoices();
  const fr=synth.getVoices().filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("fr"));
  const score=v=>{const n=(v.name+" "+v.voiceURI).toLowerCase(); let s=0; if(/premium/.test(n)) s+=30; if(/enhanced|améliorée|amelioree/.test(n)) s+=20; if(/^fr-fr/i.test(v.lang.replace("_","-"))) s+=5; return s;};
  frVoice=(mine[0]&&mine[0].v)||fr.sort((a,b)=>score(b)-score(a))[0]||null;
  let saved=null; try{saved=localStorage.getItem("vif-voice");}catch(e){}
  if(saved){const o=mine.find(o=>o.v.voiceURI===saved); if(o) frVoice=o.v;}
  try{ if(view.name==="home") paintVoices(); }catch(e){} }
function paintVoices(){
  const box=$("#voices"); if(!box) return; const list=frVoices(); box.textContent="";
  const note=$("#vnote"); if(note) note.textContent=frVoices.fallback
    ? "Safari only offers web pages the voices built into iOS, so downloaded Enhanced voices like Thomas, Aurélie, Nicolas and Audrey can't be used here. These are the French voices this browser makes available. Tap one to hear it and use it in the app."
    : "Tap a voice to hear it and use it everywhere in the app.";
  if(!list.length){const p=document.createElement("p");p.className="vnote";p.textContent=synth?"Thomas, Aurélie, Nicolas and Audrey aren't available in this browser. The app is using your device's default French voice.":"Audio isn't available in this browser.";box.append(p);return;}
  list.forEach(o=>{const b=document.createElement("button"); const on=frVoice&&o.v.voiceURI===frVoice.voiceURI;
    b.className="vrow"+(on?" on":""); b.dataset.voice=o.v.voiceURI;
    b.innerHTML=`<span><span class="vn"></span><br><span class="vr"></span></span><span class="q"></span><span class="ck">${on?CHECK.replace('width="20" height="20"','width="13" height="13"'):""}</span>`;
    b.querySelector(".vn").textContent=o.name; b.querySelector(".vr").textContent=o.region; b.querySelector(".q").textContent=o.qual.toUpperCase();
    box.append(b);});
}
function chooseVoice(uri){const o=frVoices().find(o=>o.v.voiceURI===uri); if(!o) return;
  frVoice=o.v; try{localStorage.setItem("vif-voice",uri);}catch(e){}
  paintVoices(); say("Bonjour, je m'appelle "+o.name+".");}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;
  let tries=0, seenN=-1; const poll=setInterval(()=>{tries++; const n=synth.getVoices().length; if(n!==seenN){seenN=n; pickVoice();} if(tries>=20) clearInterval(poll);},300);}
let speakTimer=null, utter=null;
function say(t,slow){if(!synth){toast("Audio isn't available in this browser.");return;}
  synth.cancel(); clearTimeout(speakTimer);
  if(!say.unlocked){ try{const w=new SpeechSynthesisUtterance(" "); w.volume=0; synth.speak(w);}catch(e){} say.unlocked=true; }
  speakTimer=setTimeout(()=>{ utter=new SpeechSynthesisUtterance(t); utter.lang="fr-FR"; if(frVoice) utter.voice=frVoice;
    utter.rate=slow?.68:.95; synth.speak(utter); },250);}

/* ---------- checking ---------- */
function norm(s){return s.toLowerCase().normalize("NFC").replace(/[’‘`´]/g,"'").replace(/œ/g,"oe").replace(/æ/g,"ae")
  .replace(/-/g," ").replace(/[.,!?;:…«»"()]/g," ").replace(/'\s+/g,"'").replace(/\s+/g," ").trim();}
const bare=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ina=new Set(),inb=new Set();let i=0,j=0;
  while(i<m&&j<n){if(a[i]===b[j]){ina.add(i);inb.add(j);i++;j++;}else if(d[i+1][j]>=d[i][j+1])i++;else j++;}
  return {len:d[0][0],ina,inb};}
function check(input,answers){const ni=norm(input);
  for(const a of answers) if(norm(a)===ni) return {kind:"ok",best:a};
  for(const a of answers) if(bare(norm(a))===bare(ni)) return {kind:"near",best:a};
  const ui=ni.split(" ").filter(Boolean);let best=answers[0],bs=-1,br=null;
  for(const a of answers){const at=norm(a).split(" ");const r=lcs(ui.map(bare),at.map(bare));const sc=r.len/Math.max(at.length,ui.length);if(sc>bs){bs=sc;best=a;br=r;}}
  return {kind:"bad",best,res:br};}
function answerHtml(r){ if(r.kind!=="bad"||!r.res) return esc(r.best);
  return r.best.split(/\s+/).map((w,i)=>r.res.inb.has(i)?esc(w):`<mark>${esc(w)}</mark>`).join(" ");}
function noteFor(r,input){ if(r.kind==="ok") return "Correct.";
  if(r.kind==="near") return "Almost. Check the accents.";
  return "You wrote: "+input.trim(); }

function glossaryWords(){
  const seen=new Set(), out=[];
  UNITS.filter(u=>unitPct(u)>=80).forEach(u=>u.words.forEach(w=>{
    const k=w[0].toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push({fr:w[0],es:w[1],en:w[2],g:w[3]||"",u:u.id});}));
  const key=s=>bare(s.toLowerCase().replace(/^(le |la |les |l'|un |une |du |des |de l'|de la |se |s')/,""));
  return out.sort((a,b)=>key(a.fr).localeCompare(key(b.fr),"fr"));
}
function renderGlossary(){
  view={name:"glossary",q:""}; setNight(false);
  const words=glossaryWords();
  $("#app").innerHTML=`<div class="screen">

function paintGlossary(words,q){
  const box=$("#glist"); if(!box) return; box.textContent="";
  const nq=bare(q.trim().toLowerCase());
  const list=nq?words.filter(w=>bare([w.fr,w.es,w.en].join(" ").toLowerCase()).includes(nq)):words;
  if(!list.length){const d=document.createElement("p");d.className="gempty";d.textContent="No matches.";box.append(d);return;}
  let letter="";
  list.forEach(w=>{
    const L=bare(w.fr.replace(/^(le |la |les |l'|un |une |du |des |de l'|de la |se |s')/i,""))[0].toUpperCase();
    if(!nq&&L!==letter){letter=L;const h=document.createElement("div");h.className="gletter";h.textContent=L;box.append(h);}
    const b=document.createElement("button"); b.className="gitem"; b.dataset.say=w.fr; b.lang="fr";

function allCards(ids){const out=[];UNITS.filter(u=>ids.includes(u.id)).forEach(u=>u.words.forEach(w=>out.push({fr:w[0],es:w[1],en:w[2],g:w[3]||"",u:u.id})));return out;}

const BOX=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(cards){return shuffle(cards.slice()).sort((a,b)=>lvl(a.fr)-lvl(b.fr));}
function startFlash(){
  if(!S.fsel) S.fsel=defaultSel(); const cards=allCards(S.fsel); if(!cards.length) return renderFlashSetup();
  view={name:"flash",cards,queue:buildQueue(cards),pos:0,flipped:false}; setNight(false);
  $("#app").innerHTML=`<div class="screen">
    <header class="uhead"><button class="back" data-act="fsetup" aria-label="Back to deck">${BACK("#0b0b0d")}</button><span class="title t28"><span>Flashcards</span></span></header>

function setLevel(l){
  if(flBusy||view.name!=="flash") return; const x=view.queue[view.pos];

const ART=/^(le |la |un |une |du |de la |de l'|mon |ma |ton |ta |ce |cette )/i;
function makeQuiz(cards,n){
  const pool=shuffle(cards.slice()).slice(0,Math.min(n,cards.length)), all=allCards(UNITS.map(u=>u.id));
  return pool.map(w=>{
    const genderOK=/^(m|f|m pl|f pl)$/.test(w.g)&&!ART.test(w.fr)&&!w.fr.includes(",");
    const r=Math.random(), kind=genderOK&&r<.25?"gender":(r<.62?"fr2en":"en2fr");
    if(kind==="gender") return {kind,label:"Masculine or feminine?",big:w.fr,bigFr:true,opts:["Masculine","Feminine"],ans:w.g[0]==="m"?0:1,w};
    const key=kind==="fr2en"?"en":"fr";
    const src=cards.length>=4?cards:all; const others=shuffle(src.filter(x=>x[key]!==w[key])).filter((x,i,a)=>a.findIndex(y=>y[key]===x[key])===i).slice(0,3);
    const opts=shuffle([w,...others]);
    return {kind,label:kind==="fr2en"?"What does it mean?":"How do you say it in French?",big:kind==="fr2en"?w.fr:w.en,bigFr:kind==="fr2en",
      opts:opts.map(x=>x[key]),ans:opts.indexOf(w),w};
  });
}
function startQuiz(){
  if(!S.qsel) S.qsel=defaultSel(); const cards=allCards(S.qsel); if(!cards.length) return renderQuizSetup();
  view={name:"quiz",qs:makeQuiz(cards,S.qlen||10),i:0,score:0,missed:[],answered:false}; setNight(false); paintQuiz(); remember();
}
function paintQuiz(){
  const n=view.qs.length;
  if(view.i>=n) return paintResults();
  const q=view.qs[view.i];
  $("#app").innerHTML=`<div class="screen">
    <header class="uhead"><button class="back" data-act="qsetup" aria-label="Back to quiz setup">${BACK("#0b0b0d")}</button><span class="title t28"><span>Quiz</span></span><span class="pct" style="margin-left:auto">${view.i+1} / ${n}</span></header>
    <div class="qbar"><i style="width:${view.i/n*100}%"></i></div>
    <div class="qzone zone"><span class="mono">${q.label}</span>
      <div class="qbig ${q.bigFr?"":"en"}" lang="${q.bigFr?"fr":"en"}">${esc(q.big)}</div>
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-qo="${k}" lang="${q.kind==="en2fr"?"fr":"en"}">${esc(o)}</button>`).join("")}</div></div></div>`;
}
function answerQuiz(k){
  if(view.name!=="quiz"||view.answered) return; view.answered=true;
  const q=view.qs[view.i], ok=k===q.ans; if(ok) view.score++; else view.missed.push(q.w);
  document.querySelectorAll(".opt").forEach((b,j)=>{ if(j===q.ans) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); else b.classList.add("dim"); });
  say(q.w.fr);
  setTimeout(()=>{ if(view.name!=="quiz") return; view.i++; view.answered=false; paintQuiz();
    const z=document.querySelector(".zone"); if(z&&!reduceMotion()) z.classList.add("enter"); }, ok?900:1700);
}
function paintResults(){
  const n=view.qs.length; S.qlast=`${view.score}/${n}`; save();
  const miss=view.missed.map(x=>`<button class="gitem" data-say="${esc(x.fr)}" lang="fr"><span class="fr">${esc(x.fr)}${x.g?`<small>${GSHORT[x.g]||""}</small>`:""}</span><span class="mean" lang="en">${esc([x.es,x.en].filter(Boolean).join(" · "))}</span></button>`).join("");
  $("#app").innerHTML=`<div class="screen">${setupHead("Quiz")}
    <div class="center" style="flex:0;padding-top:40px"><span class="mono" style="color:var(--muted)">Your score</span><div class="qscore">${view.score}<span style="color:var(--faint)">/${n}</span></div></div>
    ${miss?`<section class="group"><span class="mono">Words to review · ${view.missed.length}</span><div class="glist">${miss}</div></section>`:`<p class="vnote" style="text-align:center">No misses. Every answer was right.</p>`}
    <div class="home-pad"></div>
    <footer class="foot two sticky"><button class="btn" data-act="qsetup">Change units</button><button class="btn black" data-act="qstart">Again</button></footer></div>`;

}
function toggleSel(key,id){const s=S[key]||[]; const i=s.indexOf(id); if(i>=0) s.splice(i,1); else s.push(id); s.sort((a,b)=>a-b); S[key]=s; save();}

function titleHtml(u,cls){return `<span class="title ${cls}"><b>${pad(u.id)}</b><span>${esc(u.title)}</span></span>`;}

function renderHome(){
  view={name:"home"}; setNight(false);
  const cur=UNITS[currentId()];
  let groups="";
  for(let ph=0;ph<LEVELS.length;ph++){
    const rows=UNITS.filter(u=>u.phase===ph).map(u=>{
      const p=unitPct(u), isCur=u.id===cur.id, done=p>=80;
      const cls=isCur?"now":done?"":"future";
      const st=isCur?p+"%":done?"Done":(p>0?p+"%":"—");
      return `<button class="row ${cls}" data-unit="${u.id}"><span class="n">${pad(u.id)}</span><span class="nm">${esc(u.title)}</span><span class="st">${esc(st.toUpperCase())}</span></button>`;
    }).join("");
    const us_=UNITS.filter(u=>u.phase===ph), nd=us_.filter(u=>unitPct(u)>=80).length;
    const open=(S.fold&&S.fold[ph]!=null)?S.fold[ph]:us_.some(u=>u.id===cur.id);
    const chev=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
    groups+=`<section class="group fold${open?"":" shut"}" data-ph="${ph}"><button class="ghead" data-fold="${ph}" aria-expanded="${open}"><span class="mono">${LEVELS[ph]}</span><span class="gc">${nd}/${us_.length}</span>${chev}</button><div class="gbody"><div>${rows}</div></div></section>`;
  }
  $("#app").innerHTML=`<div class="screen">
    <header class="home-top"><div class="wordmark">VIF<i>.</i></div><span class="pct">${coursePct()}%</span></header>
    <button class="next" data-unit="${cur.id}" aria-label="Resume unit ${cur.id}, ${esc(cur.title)}">
      <span class="t"><span class="mono">${S.last==null?"Start here":"Up next"}</span>${titleHtml(cur,"t28")}<span class="fr">${esc(cur.fr)}</span></span>
      <span class="go">${ARROW("#0b0b0d")}</span></button>
    ${groups}
    <button class="gentry" data-act="glossary"><span class="nm">Glossary</span><span class="st">${glossaryWords().length} WORDS</span>${ARROW("#0b0b0d")}</button>
    <button class="gentry" data-act="fsetup"><span class="nm">Flashcards</span><span class="st">${Object.values(S.m||{}).filter(v=>v===4).length} MASTERED</span>${ARROW("#0b0b0d")}</button>
    <button class="gentry" data-act="qsetup"><span class="nm">Quiz</span><span class="st">${S.qlast?"LAST "+esc(S.qlast):"START"}</span>${ARROW("#0b0b0d")}</button>
    <section class="group"><span class="mono">Voice</span><div id="voices"></div>
      <p class="vnote" id="vnote">Tap a voice to hear it and use it everywhere in the app.</p></section>
    ${STANDALONE?`<section class="group"><span class="mono">Backup</span>
      <button class="gentry" data-act="bexport"><span class="nm">Save progress file</span><span class="st">EXPORT</span>${ARROW("#0b0b0d")}</button>
      <button class="gentry" data-act="bimport"><span class="nm">Load progress file</span><span class="st">IMPORT</span>${ARROW("#0b0b0d")}</button>
      <p class="vnote">Progress is saved on this device. Save a file now and then to keep a backup or move it to another device.</p></section>`:""}
    <div class="home-pad"></div></div>`;
  paintVoices(); window.scrollTo(0,0); remember();
}

function firstTab(u){const st=us(u.id);
  if(!st.seen&&!st.w.length) return "learn";
  if(st.w.length<u.words.length) return "words"; if(st.t.length<u.type.length) return "type";
  if(st.l.length<u.listen.length) return "listen"; if(!st.wr) return "write"; return "speak";}

function openUnit(id,tab,idx){const u=UNITS[id];S.last=id;save();
  const i={words:0,type:0,listen:0};
  if(idx){i.words=Math.min(+idx.words||0,u.words.length-1);i.type=Math.min(+idx.type||0,u.type.length-1);i.listen=Math.min(+idx.listen||0,u.listen.length-1);}
  if(tab&&!MODES.some(m=>m[0]===tab)) tab=null;
  view={name:"unit",id,tab:tab||firstTab(u),i,def:false,answered:false,wmode:S.fb[id]?"fb":"draft"};
  renderUnit();}

function renderUnit(){
  const u=UNITS[view.id], night=view.tab==="listen"; setNight(night);
  $("#app").innerHTML=`<div class="screen ${night?"night":""}">
    <header class="uhead"><button class="back" data-act="home" aria-label="All units">${BACK(night?"#f4f4f6":"#0b0b0d")}</button>${titleHtml(u,"t28")}</header>
    <nav class="tabs" aria-label="Practice mode">${MODES.map(([k,l])=>`<button class="tab ${k} ${k===view.tab?"on":""}" data-tab="${k}" aria-pressed="${k===view.tab}">${l}</button>`).join("")}</nav>
    <div class="stage" id="stage"></div></div>`;
  renderStage(); window.scrollTo(0,0);
}

function keysHtml(){return `<div class="keys" aria-label="Accent keys">${ACCENTS.map(k=>`<button type="button" data-key="${k}" tabindex="-1">${k}</button>`).join("")}</div>`;}
function phraseSize(t){const n=t.length;return n<=18?72:n<=28?60:n<=40?48:n<=60?40:n<=85?34:30;}

function remember(){
  S.pos = view.name==="unit" ? {name:"unit",id:view.id,tab:view.tab,i:Object.assign({},view.i)}
        : {name:view.name}; save(); }
function resume(){
  const p=S.pos;
  if(p&&p.name==="unit"&&UNITS[p.id]){ openUnit(p.id,p.tab,p.i); return; }
  if(p&&p.name==="glossary"){ renderGlossary(); return; }
  if(p&&p.name==="fsetup"){ renderFlashSetup(); return; }
  if(p&&p.name==="flash"){ startFlash(); return; }
  if(p&&(p.name==="qsetup"||p.name==="quiz")){ renderQuizSetup(); return; }
  renderHome();
}

    const vocab=u.words.map(w=>`<button class="gitem" data-say="${esc(w[0])}"><span class="fr" lang="fr">${esc(w[0])}${w[3]?`<small>${GSHORT[w[3]]||esc(w[3])}</small>`:""}</span><span class="mean">${esc([w[1],w[2]].filter(Boolean).join(" · "))}</span></button>`).join("");
    el.innerHTML=`<article class="lesson">
        <header class="lhero"><span class="mono kicker">Lesson ${pad(u.id)} · ${esc(u.level)}</span>
          <h1 class="ltitle">${esc(u.title)}</h1><span class="lfr" lang="fr">${esc(u.fr)}</span>
          ${L.intro.map((p,k)=>`<p class="${k?"":"lead"}">${nb(p)}</p>`).join("")}</header>
        <section class="goals"><span class="mono">In this lesson</span><ul>${L.goals.map(g=>`<li><i>${TICK}</i><span>${nb(g)}</span></li>`).join("")}</ul></section>
        ${parts}
        ${L.reading?`<section class="reading"><span class="mono">Reading</span><h2 class="rtitle" lang="fr">${esc(L.reading.title)}</h2>
          <p class="rfr" lang="fr">${esc(L.reading.fr)}</p><p class="ren" id="ren" hidden>${esc(L.reading.en)}</p>
          <div class="rbtns"><button class="btn green" data-act="readfr">Hear it</button><button class="btn" data-act="readen">Show translation</button></div></section>`:""}
        <section class="wrapup"><span class="mono">Before you move on</span><p>${esc(L.wrap)}</p></section>
        <section><div class="vhead"><b>Vocabulary</b><span class="mono" style="color:var(--muted)">${u.words.length} words</span></div><div class="glist" style="padding-bottom:0">${vocab}</div></section>
      </article>
      <footer class="foot one"><button class="btn green" data-act="towords">Start words</button></footer>`;
    return;
  }
  if(view.tab==="words"){
    const i=view.i.words,w=u.words[i];
    if(view.def) mark(u.id,"w",i);
    el.innerHTML=`<div class="center">
        <button class="word" lang="fr" data-act="sayword" aria-label="${esc(w[0])}, tap to hear">${esc(w[0])}</button>
        ${w[3]?`<span class="gender">${GENDER[w[3]]||esc(w[3])}</span>`:""}
        <div class="def" aria-live="polite">${view.def?`${w[1]?`<span>${esc(w[1])}</span>`:""}<span>${esc(w[2])}</span>`:""}</div>
      </div>
      <footer class="foot"><button class="btn" data-act="wprev" ${i===0?"disabled":""}>Previous</button>
        <button class="btn pink" data-act="def">${view.def?"Hide definition":"View definition"}</button>

  }
  if(view.tab==="type"){
    const i=view.i.type,item=u.type[i],fs=phraseSize(item[0]);
    el.innerHTML=`<div class="phrase-zone zone" style="--off:${Math.round(fs*.9*1.15)}px">
        <h2 class="phrase" style="font-size:${fs}px">${esc(item[0])}</h2>
        <div class="fix" id="fix" aria-live="polite"></div></div>
      <div class="entry">
        <form class="pill" id="tform"><input id="ans" lang="fr" aria-label="Your answer in French" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="En français…">

        ${keysHtml()}</div>
      <footer class="foot"><button class="btn" data-act="tprev" ${i===0?"disabled":""}>Previous</button>
        <button class="btn" data-act="show">Show answer</button>
        <button class="btn cyan" data-act="tnext">${i===u.type.length-1?"Listen":"Next"}</button></footer>`;
    return;
  }
  if(view.tab==="listen"){
    const i=view.i.listen, bars=[14,26,40,22,52,34,18,44,28,48,20,36,12,30,16];
    const on=Math.round(st.l.length/u.listen.length*bars.length);
    el.innerHTML=`<div class="lcount"><span>Dictation</span><span>${pad(i+1)} / ${pad(u.listen.length)}</span></div>
      <div class="center zone" style="gap:24px">
        <div class="wave" aria-hidden="true">${bars.map((h,k)=>`<i class="${k<Math.max(on,3)?"on":""}" style="height:${h}px"></i>`).join("")}</div>
        <button class="play" data-act="play" aria-label="Play the sentence">${PLAY}</button>
        <div class="chips"><button class="chip" data-act="slow">0.7× slower</button></div>
        <div class="lres" id="fix" aria-live="polite"></div>
      </div>
      <div class="lfield"><span>Type what you hear</span>

          <button class="submit purple" type="submit" aria-label="Submit">${ARROW("#fff")}</button></form></div>

        <button class="btn purple" data-act="lnext">${i===u.listen.length-1?"Write":"Next"}</button></footer>`;
    return;
  }
  if(view.tab==="write"){
    const f=S.fb[u.id];
    if(view.wmode==="fb"&&f){
      el.innerHTML=`<div class="fbwrap"><p class="corrected" lang="fr" id="corr"></p><div class="notes" id="notes"></div></div>
        <footer class="foot"><button class="btn" data-act="edit">Edit</button><button class="btn gold" data-act="hearfb">Hear it</button><button class="btn" data-act="tospeak">Next</button></footer>`;
      paintFeedback(f); return;
    }
    if(view.wmode==="thinking"){
      el.innerHTML=`<div class="fbwrap"><p class="thinking">READING YOUR FRENCH…</p></div>

    }

      <footer class="foot two"><button class="btn" data-act="copyessay">Copy for chat</button>
        <button class="btn gold" data-act="getfb" ${sampleState==="off"?"disabled":""}>Get feedback</button></footer>`;
    wc(); if(sampleState==="off") $("#werr").textContent="Use Copy for chat to get corrections.";
    return;
  }
  if(view.tab==="speak"){
    const parts=u.speak.line.split(/,\s*/);
    el.innerHTML=`<div class="center"><span class="mono" style="color:var(--gray)">Open voice mode and say</span>
        <span class="say">${esc(parts[0])}${parts[1]?`,<br>${esc(parts.slice(1).join(", "))}`:""}</span>
        <span class="task">${esc(u.speak.task)}</span></div>
      <footer class="foot one"><button class="btn black" data-act="copyline">Copy prompt</button></footer>`;

function wc(){const t=$("#essay");if(!t)return;const n=(t.value.trim().match(/\S+/g)||[]).length;$("#wc").textContent=n+" word"+(n===1?"":"s");}

function paintFeedback(f){
  const corr=$("#corr"), notes=$("#notes");
  const orig=norm(f.original||"").split(" ").map(bare);
  const toks=String(f.corrected||"").split(/(\s+)/);
  const words=toks.filter(t=>!/^\s+$/.test(t)&&t!=="");
  const r=lcs(words.map(w=>bare(norm(w))),orig);
  let wi=0;
  toks.forEach(t=>{ if(t==="") return; if(/^\s+$/.test(t)){corr.append(t);return;}
    const keep=r.ina.has(wi)||!norm(t); wi++;
    if(keep) corr.append(t); else {const x=document.createElement("u");x.textContent=t;corr.append(x);} });
  (f.notes||[]).slice(0,5).forEach(n=>{const s=document.createElement("span");s.textContent=String(n);notes.append(s);});
  if(f.tryNext){const s=document.createElement("span");s.textContent="Try next: "+f.tryNext;s.style.color="var(--muted)";notes.append(s);}
}

function speakPrompt(u){
  return `Run a French speaking session for Unit ${u.id} (${u.title}) of my course: https://claude.ai/artifact/4VzAGrzd8Z2RJH39rUHJoo. Use that unit's speaking task and run it the way the doc's practice section describes.`;
}

/* ---------- actions ---------- */
function result(r,input){
  const box=$("#fix"); if(!box) return;
  const ask=(r.kind==="bad"&&view.tab==="type"&&sampleState==="ready")?`<button class="ask" data-act="ask">Ask Claude if yours also works</button>`:"";
  box.innerHTML=`<span class="a" lang="fr">${answerHtml(r)}</span><span class="b"></span>${ask}`;
  box.querySelector(".b").textContent=noteFor(r,input);
}
function submitAnswer(){
  const u=UNITS[view.id], inp=$("#ans"); const val=inp.value;
  if(!val.trim()){inp.focus();return;}
  const isType=view.tab==="type", i=view.i[view.tab];
  const r=check(val,isType?u.type[i][1]:[u.listen[i]]);
  if(r.kind!=="bad") mark(u.id,isType?"t":"l",i);
  if(r.kind==="ok"){ celebrate(); if(isType) say(r.best); return; }
  result(r,val);
  view.answered=true; say(r.best);
}
const CHECK=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
let advancing=false;
function celebrate(){
  if(advancing) return; advancing=true;
  const b=document.querySelector(".submit"), inp=$("#ans"); if(inp) inp.readOnly=true;
  if(b){b.innerHTML=CHECK; b.classList.add("ok"); b.setAttribute("aria-label","Correct");}
  const fix=$("#fix"); if(fix) fix.textContent="";
  const key=view.tab, u=UNITS[view.id], list=key==="type"?u.type:u.listen, last=view.i[key]>=list.length-1;
  setTimeout(()=>{
    if(view.name!=="unit"||view.tab!==key){advancing=false;return;}
    if(last){advancing=false; step(key,1); return;}
    const z=document.querySelector(".zone");
    const go=()=>{view.i[key]++; view.answered=false; renderStage(); advancing=false;
      const nz=document.querySelector(".zone"); if(nz&&!reduceMotion()) nz.classList.add("enter");
      $("#ans")?.focus({preventScroll:true});};
    if(z&&!reduceMotion()){z.classList.add("leave"); setTimeout(go,220);} else go();
  },900);
}
function showAnswer(){const u=UNITS[view.id],i=view.i[view.tab];
  const a=view.tab==="type"?u.type[i][1][0]:u.listen[i];
  const box=$("#fix"); box.innerHTML=`<span class="a" lang="fr"></span><span class="b">Type it out once to lock it in.</span>`;
  box.querySelector(".a").textContent=a; say(a); $("#ans")?.focus({preventScroll:true});}
function step(key,dir){if(advancing)return; const u=UNITS[view.id],list=key==="type"?u.type:u.listen;
  const n=view.i[key]+dir;
  if(n<0) return;
  if(n>=list.length){view.i[key]=0; toast(key==="type"?"Set done. On to listening.":"Set done. On to writing."); slideTo(key==="type"?"listen":"write"); return;}
  view.i[key]=n; view.answered=false; renderStage(); }
function setTab(t){if(view.tab===t)return; view.tab=t; view.def=false; view.answered=false;
  if(t==="write") view.wmode=S.fb[view.id]?"fb":"draft"; renderUnit();}
const ORDER=MODES.map(m=>m[0]);
const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
let sliding=false;
function slideTo(t){
  if(sliding||view.name!=="unit"||t===view.tab) return;
  synth&&synth.cancel();
  const st=$("#stage"); if(!st||reduceMotion()){setTab(t);return;}
  const dir=ORDER.indexOf(t)>ORDER.indexOf(view.tab)?1:-1, w=st.offsetWidth+32; sliding=true;
  st.style.transition="transform .24s cubic-bezier(.4,0,.6,1), opacity .24s";
  st.style.transform=`translateX(${-dir*w}px)`; st.style.opacity="0";
  setTimeout(()=>{
    setTab(t); const ns=$("#stage");
    ns.style.transition="none"; ns.style.transform=`translateX(${dir*w}px)`; ns.style.opacity="0"; void ns.offsetWidth;
    ns.style.transition="transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s";
    ns.style.transform="translateX(0)"; ns.style.opacity="1";
    setTimeout(()=>{ns.style.transition="";ns.style.transform="";ns.style.opacity="";sliding=false;},340);
  },240);
}
function snapBack(st){st.style.transition="transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s";st.style.transform="translateX(0)";st.style.opacity="1";
  setTimeout(()=>{st.style.transition="";st.style.transform="";st.style.opacity="";},260);}

async function askClaude(btn){
  const u=UNITS[view.id],i=view.i.type,val=$("#ans").value; btn.disabled=true; btn.textContent="Thinking…";
  const prompt=`A French learner translated: "${u.type[i][0]}"\nTheir French: "${val}"\nAccepted answers include: ${u.type[i][1].map(a=>`"${a}"`).join(", ")}.\nIs their French correct and natural (ignore capitalization and punctuation)? Reply with only JSON: {"correct": true|false, "explanation": "one plain sentence in English"}`;
  try{const r=await sampleFn.json(prompt,{modelTier:"quick"});
    if(r&&r.correct===true) mark(u.id,"t",i);
    btn.replaceWith(Object.assign(document.createElement("span"),{className:"b",textContent:(r&&r.correct?"Yours works too. ":"")+String((r&&r.explanation)||"")}));
  }catch(e){btn.textContent=sampleErr(e);}
}
let fbCtl=null;
async function getFeedback(){
  const u=UNITS[view.id], text=(S.drafts[u.id]||"").trim();
  if(text.length<10){toast("Write a bit more first.");return;}
  view.wmode="thinking"; renderStage(); fbCtl=new AbortController();
  const prompt=`You are a warm, precise French tutor. The learner speaks fluent Spanish and English and works at ACTFL ${u.level} level, in a unit on: ${u.focus}.
Writing task: ${u.write}
Learner's text:
"""
${text.slice(0,6000)}
"""
Correct it with minimal changes that keep their meaning. Where Spanish explains an error (a false friend, a structure that differs), say so briefly.
Reply with only JSON: {"corrected": "the full corrected text", "notes": ["one short plain sentence per fix, most important first, at most 5"], "tryNext": "one short thing to practice next, with a brief French example"}
If there are no errors, return an empty notes array.`;
  try{const r=await sampleFn.json(prompt,{signal:fbCtl.signal});
    S.fb[u.id]={original:text,corrected:String(r.corrected||text),notes:Array.isArray(r.notes)?r.notes.map(String):[],tryNext:String(r.tryNext||"")};
    us(u.id).wr++; save(); view.wmode="fb";
  }catch(e){view.wmode="draft"; if(!(e&&e.code==="cancelled")) setTimeout(()=>toast(sampleErr(e)),50);}
  if(view.name==="unit"&&view.tab==="write") renderStage();
}

/* ---------- events ---------- */
let lastField=null;
document.addEventListener("focusin",e=>{if(e.target.matches("#ans,#essay"))lastField=e.target;});
document.addEventListener("mousedown",e=>{if(e.target.closest("[data-key]"))e.preventDefault();});
document.addEventListener("input",e=>{if(e.target.id==="gq"){paintGlossary(glossaryWords(),e.target.value);return;}
  if(e.target.id==="essay"){S.drafts[view.id]=e.target.value;save();wc();}
  if(e.target.id==="ans"&&view.answered){view.answered=false;const lb=document.querySelector('[data-act="lcheck"]');if(lb)lb.textContent="Check";}});
document.addEventListener("submit",e=>{e.preventDefault(); if(e.target.id==="tform"||e.target.id==="lform") submitAnswer();});
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.say!=null){say(t.dataset.say);return;}
  if(t.dataset.voice!=null) return chooseVoice(t.dataset.voice);
  if(t.dataset.fu!=null){toggleSel("fsel",+t.dataset.fu); const y=scrollY; renderFlashSetup(); scrollTo(0,y); return;}
  if(t.dataset.qu!=null){toggleSel("qsel",+t.dataset.qu); const y=scrollY; renderQuizSetup(); scrollTo(0,y); return;}
  if(t.dataset.ql!=null){S.qlen=+t.dataset.ql; save(); const y=scrollY; renderQuizSetup(); scrollTo(0,y); return;}
  if(t.dataset.act==="bexport") return exportProgress();
  if(t.dataset.act==="bimport") return importProgress();
  if(t.dataset.fold!=null){const ph=+t.dataset.fold, g=t.closest(".group"); const open=g.classList.toggle("shut")===false; t.setAttribute("aria-expanded",open); S.fold=S.fold||{}; S.fold[ph]=open; save(); return;}
  if(t.dataset.lv!=null) return setLevel(+t.dataset.lv);
  if(t.dataset.qo!=null) return answerQuiz(+t.dataset.qo);
  if(t.dataset.unit!=null) return openUnit(+t.dataset.unit, t.classList.contains("next")?undefined:undefined);
  if(t.dataset.tab) return slideTo(t.dataset.tab);
  if(t.dataset.key){const f=lastField||$("#ans")||$("#essay");if(!f)return;
    const s=f.selectionStart??f.value.length,en=f.selectionEnd??s;f.value=f.value.slice(0,s)+t.dataset.key+f.value.slice(en);
    f.focus();f.setSelectionRange(s+1,s+1);f.dispatchEvent(new Event("input",{bubbles:true}));return;}
  const u=view.name==="unit"?UNITS[view.id]:null;
  switch(t.dataset.act){
    case "home": synth&&synth.cancel(); return renderHome();
    case "glossary": return renderGlossary();
    case "towords": return slideTo("words");
    case "readfr": { const L=LESSONS[view.id]; if(L&&L.reading) say(L.reading.fr.replace(/\n/g," ")); return; }
    case "readen": { const r=$("#ren"); if(r){ r.hidden=!r.hidden; t.textContent=r.hidden?"Show translation":"Hide translation"; } return; }
    case "fsetup": return renderFlashSetup();
    case "fall": S.fsel=UNITS.map(u=>u.id); save(); return renderFlashSetup();
    case "fnone": S.fsel=[]; save(); return renderFlashSetup();
    case "fstart": return startFlash();
    case "fflip": if(view.name==="flash"){view.flipped=!view.flipped; $("#fcard").classList.toggle("flip",view.flipped); if(view.flipped) say(view.queue[view.pos].fr);} return;
    case "qsetup": return renderQuizSetup();
    case "qall": S.qsel=UNITS.map(u=>u.id); save(); return renderQuizSetup();
    case "qnone": S.qsel=[]; save(); return renderQuizSetup();
    case "qstart": return startQuiz();
    case "sayword": return say(u.words[view.i.words][0]);
    case "def": view.def=!view.def; if(view.def) say(u.words[view.i.words][0]); return renderStage();
    case "wprev": if(view.i.words>0){view.i.words--;view.def=false;renderStage();} return;
    case "wnext": if(view.i.words<u.words.length-1){view.i.words++;view.def=false;renderStage();} else slideTo("type"); return;
    case "tprev": return step("type",-1);
    case "tnext": return step("type",1);
    case "lprev": return step("listen",-1);
    case "lnext": return step("listen",1);
    case "show": return showAnswer();
    case "play": t.classList.contains("play")&&t.animate&&t.animate([{transform:"scale(.96)"},{transform:"scale(1)"}],{duration:180}); say(u.listen[view.i.listen]); return;
    case "slow": return say(u.listen[view.i.listen],true);
    case "ask": return askClaude(t);
    case "getfb": return getFeedback();
    case "stopfb": fbCtl&&fbCtl.abort(); return;
    case "edit": view.wmode="draft"; return renderStage();
    case "hearfb": return say(S.fb[view.id].corrected);
    case "tospeak": return slideTo("speak");
    case "copyessay": return copy(`Unit ${u.id} typing:\n\n${$("#essay").value}`,$("#essay"));
    case "copyline": return copy(speakPrompt(u),null,"Copied. Paste it into a new chat, then start voice mode.");
  }
});
document.addEventListener("keydown",e=>{
  if(view.name!=="unit"||e.target.matches("input,textarea")) return;
  if(view.tab==="words"){if(e.key==="ArrowRight")document.querySelector('[data-act="wnext"]')?.click();
    if(e.key==="ArrowLeft")document.querySelector('[data-act="wprev"]')?.click();}
});

/* swipe: the stage follows your finger, then slides to the next mode */
let sw=null;
document.addEventListener("touchstart",e=>{
  if(view.name!=="unit"||sliding||e.touches.length!==1||e.target.closest("input,textarea,.keys")){sw=null;return;}
  const p=e.touches[0]; sw={x:p.clientX,y:p.clientY,t:Date.now(),axis:null,dx:0};},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!sw) return; const p=e.touches[0], dx=p.clientX-sw.x, dy=p.clientY-sw.y;
  if(!sw.axis){ if(Math.abs(dx)<10&&Math.abs(dy)<10) return; sw.axis=Math.abs(dx)>Math.abs(dy)*1.2?"x":"y"; }
  if(sw.axis!=="x"||reduceMotion()) return;
  const i=ORDER.indexOf(view.tab), atEdge=(dx>0&&i===0)||(dx<0&&i===ORDER.length-1);
  sw.dx=atEdge?dx*.25:dx; const st=$("#stage"); if(!st) return;
  st.style.transition="none"; st.style.transform=`translateX(${sw.dx}px)`; st.style.opacity=String(1-Math.min(.5,Math.abs(sw.dx)/600));
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!sw||view.name!=="unit"){sw=null;return;} const s0=sw; sw=null;
  if(s0.axis!=="x") return;
  const p=e.changedTouches[0], dx=p.clientX-s0.x, dt=Math.max(1,Date.now()-s0.t), st=$("#stage");
  const i=ORDER.indexOf(view.tab), n=i+(dx<0?1:-1);
  const go=(Math.abs(dx)>(st?st.offsetWidth:360)*.22||Math.abs(dx)/dt>.45)&&n>=0&&n<ORDER.length;
  if(go) slideTo(ORDER[n]); else if(st) snapBack(st);
},{passive:true});
document.addEventListener("touchcancel",()=>{if(sw&&$("#stage"))snapBack($("#stage"));sw=null;},{passive:true});

splash();
</script>
</body>
</html>
