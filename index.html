de…", "It's about…"], ["Je le recommande à tous ceux qui…", "I'd recommend it to anyone who…"]]}}, {"id": 33, "phase": 6, "title": "The French-speaking world", "fr": "La francophonie", "level": "Advanced High", "focus": "history and identity; countries and regions; reading the passé simple; dates and centuries", "words": [["la francophonie", "la francofonía", "French-speaking world", "f"], ["francophone", "francófono", "French-speaking, French speaker", ""], ["la langue officielle", "la lengua oficial", "official language", "f"], ["la colonie", "la colonia", "colony", "f"], ["l'indépendance", "la independencia", "independence", "f"], ["indépendant, indépendante", "independiente", "independent", ""], ["le siècle", "el siglo", "century", "m"], ["la culture", "la cultura", "culture", "f"], ["la tradition", "la tradición", "tradition", "f"], ["l'accent", "el acento", "accent", "m"], ["le Sénégal", "Senegal", "Senegal", "m"], ["la Belgique", "Bélgica", "Belgium", "f"], ["la Suisse", "Suiza", "Switzerland", "f"], ["le Maroc", "Marruecos", "Morocco", "m"], ["environ", "aproximadamente", "about, around", ""], ["le million", "el millón", "million", "m"], ["cent", "cien", "hundred", ""], ["fonder", "fundar", "to found", ""], ["appartenir", "pertenecer", "to belong", ""], ["plusieurs", "varios", "several", ""], ["chaque", "cada", "each", ""], ["l'arabe", "el árabe", "Arabic", "m"]], "type": [["French is an official language in about thirty countries.", ["Le français est une langue officielle dans environ trente pays."]], ["Senegal became independent in 1960.", ["Le Sénégal est devenu indépendant en 1960."]], ["Quebec City was founded in the seventeenth century.", ["Québec a été fondée au dix-septième siècle.", "Québec a été fondé au dix-septième siècle."]], ["In Belgium and Switzerland, people speak several languages.", ["En Belgique et en Suisse, on parle plusieurs langues."]], ["There are about three hundred million French speakers.", ["Il y a environ trois cents millions de francophones."]], ["Each country has its own accent.", ["Chaque pays a son propre accent."]]], "listen": ["Au Maroc, on parle arabe et français.", "La Belgique a trois langues officielles.", "Ces traditions appartiennent à l'histoire du pays.", "Il fut le premier président du pays.", "Montréal est la deuxième ville francophone du monde."], "write": "Choose a French-speaking country or region and write about 200 words presenting its history, its languages and one cultural tradition. Include at least two dates.", "speak": {"line": "Unit 33, the French-speaking world", "task": "Present a French-speaking country or region as if I were planning to visit: its history, its languages and what makes it unique. Then answer my questions.", "phrases": [["Ce qui est intéressant, c'est que…", "What's interesting is that…"], ["Au cours du … siècle,…", "During the … century,…"], ["On y parle…", "People there speak…"]]}}, {"id": 34, "phase": 6, "title": "The economy", "fr": "L'économie", "level": "Advanced High", "focus": "numbers, percentages and fractions; describing trends; en train de; agreement with collective nouns", "words": [["l'économie", "la economía", "economy", "f"], ["le chômage", "el desempleo", "unemployment", "m"], ["l'emploi", "el empleo", "job, employment", "m"], ["le taux", "la tasa", "rate", "m"], ["pour cent", "por ciento", "percent", ""], ["baisser", "bajar", "to fall", ""], ["la croissance", "el crecimiento", "growth", "f"], ["la crise", "la crisis", "crisis", "f"], ["l'inflation", "la inflación", "inflation", "f"], ["le pouvoir d'achat", "el poder adquisitivo", "purchasing power", "m"], ["embaucher", "contratar", "to hire", ""], ["licencier", "despedir", "to lay off", ""], ["la moitié", "la mitad", "half", "f"], ["le tiers", "el tercio", "third", "m"], ["doubler", "duplicar", "to double", ""], ["stable", "estable", "stable", ""], ["les jeunes", "los jóvenes", "young people", "m pl"], ["atteindre", "alcanzar", "to reach", ""], ["le salarié, la salariée", "el, la asalariado", "employee", "m/f"], ["à distance", "a distancia", "remotely", ""], ["la période", "el periodo", "period", "f"], ["moyen, moyenne", "medio", "average", ""]], "type": [["Unemployment fell by two percent.", ["Le chômage a baissé de deux pour cent."]], ["Half of young people are looking for a job.", ["La moitié des jeunes cherchent un emploi.", "La moitié des jeunes cherche un emploi."]], ["Prices have doubled in ten years.", ["Les prix ont doublé en dix ans."]], ["The company is going to hire thirty people.", ["L'entreprise va embaucher trente personnes."]], ["Purchasing power is falling because of inflation.", ["Le pouvoir d'achat baisse à cause de l'inflation."]], ["The unemployment rate has remained stable.", ["Le taux de chômage est resté stable."]]], "listen": ["La croissance a atteint un pour cent.", "Un tiers des salariés travaillent à distance.", "En période de crise, les entreprises licencient.", "Le salaire moyen a augmenté de trois pour cent.", "Le marché de l'emploi est en train de changer."], "write": "Describe in about 200 words a trend in your country's economy or job market: unemployment, prices, remote work or another. Give figures, explain the causes and predict what will happen next.", "speak": {"line": "Unit 34, explaining a trend", "task": "In a short presentation, explain how work has changed in the last ten years, with figures and examples, and say what you expect for the next ten.", "phrases": [["Les chiffres montrent que…", "The figures show that…"], ["On constate une hausse de…", "There's been a rise of…"], ["À long terme,…", "In the long run,…"]]}}, {"id": 35, "phase": 6, "title": "Persuading", "fr": "Convaincre", "level": "Advanced High", "focus": "concession and opposition: bien que, quoique, même si, malgré, pourtant, cependant, en revanche, avoir beau", "words": [["cependant", "sin embargo", "however", ""], ["en revanche", "en cambio", "on the other hand", ""], ["par contre", "en cambio", "on the other hand (spoken)", ""], ["quand même", "de todos modos", "still, anyway", ""], ["malgré", "a pesar de", "despite", ""], ["quoique", "aunque", "although", ""], ["avoir beau", "por más que", "however much", ""], ["néanmoins", "no obstante", "nevertheless", ""], ["convaincre", "convencer", "to convince", ""], ["l'argument", "el argumento", "argument", "m"], ["l'avantage", "la ventaja", "advantage", "m"], ["l'inconvénient", "la desventaja", "drawback", "m"], ["admettre", "admitir", "to admit", ""], ["reconnaître", "reconocer", "to recognize, to acknowledge", ""], ["certes", "ciertamente", "admittedly", ""], ["d'ailleurs", "además", "besides", ""], ["en effet", "en efecto", "indeed", ""], ["au contraire", "al contrario", "on the contrary", ""], ["la pluie", "la lluvia", "rain", "f"], ["avoir raison", "tener razón", "to be right", ""], ["le chiffre", "la cifra", "figure, number", "m"], ["l'expérience", "la experiencia", "experience", "f"], ["jeune", "joven", "young", ""]], "type": [["Despite the rain, we went to the beach.", ["Malgré la pluie, nous sommes allés à la plage.", "Malgré la pluie, on est allés à la plage."]], ["He works a lot; however, he earns little.", ["Il travaille beaucoup ; cependant, il gagne peu.", "Il travaille beaucoup, pourtant il gagne peu."]], ["However hard I try, I don't understand.", ["J'ai beau essayer, je ne comprends pas."]], ["Admittedly, there are advantages, but also drawbacks.", ["Certes, il y a des avantages, mais aussi des inconvénients."]], ["Even if it's expensive, it's worth it.", ["Même si c'est cher, ça vaut la peine.", "Même si c'est cher, ça en vaut la peine."]], ["I admit that you're right.", ["J'admets que tu as raison.", "Je reconnais que tu as raison."]]], "listen": ["Par contre, la ville est beaucoup plus chère.", "Il a quand même réussi.", "En effet, les chiffres le confirment.", "Quoiqu'il soit jeune, il a beaucoup d'expérience.", "D'ailleurs, ce n'est pas le seul problème."], "write": "Write a persuasive text of about 220 words: should remote work become the norm? State your position, concede one point to the other side, and then refute it.", "speak": {"line": "Unit 35, persuade me", "task": "Convince me to change one habit: eat less meat, stop using my car, learn a language. I'll resist. Acknowledge my objections, then counter them.", "phrases": [["Je comprends ton point de vue, mais…", "I understand your point of view, but…"], ["Certes…, mais…", "Admittedly…, but…"], ["Au fond,…", "Basically,…"]]}}, {"id": 36, "phase": 7, "title": "Debating ideas", "fr": "Débattre", "level": "Superior", "focus": "structuring an argument; formal connectors; the subjunctive after superlatives and with negative or indefinite antecedents", "words": [["d'une part", "por una parte", "on the one hand", ""], ["d'autre part", "por otra parte", "on the other hand", ""], ["en premier lieu", "en primer lugar", "in the first place", ""], ["en outre", "además", "furthermore", ""], ["en somme", "en suma", "in short", ""], ["il n'en reste pas moins que", "no es menos cierto que", "the fact remains that", ""], ["dans la mesure où", "en la medida en que", "insofar as", ""], ["la thèse", "la tesis", "thesis, position", "f"], ["le point de vue", "el punto de vista", "point of view", "m"], ["soutenir", "sostener", "to argue, to support", ""], ["remettre en question", "cuestionar", "to call into question", ""], ["nuancer", "matizar", "to qualify, to nuance", ""], ["souligner", "subrayar", "to emphasize", ""], ["la liberté", "la libertad", "freedom", "f"], ["la responsabilité", "la responsabilidad", "responsibility", "f"], ["le progrès", "el progreso", "progress", "m"], ["individuel, individuelle", "individual", "individual", ""], ["collectif, collective", "colectivo", "collective", ""], ["la technologie", "la tecnología", "technology", "f"], ["libérer", "liberar", "to free", ""], ["dépendant, dépendante", "dependiente", "dependent", ""], ["menacer", "amenazar", "to threaten", ""], ["réagir", "reaccionar", "to react", ""], ["le coût", "el coste", "cost", "m"], ["définir", "definir", "to define", ""], ["la limite", "el límite", "limit", "f"], ["la question", "la cuestión, la pregunta", "question, issue", "f"], ["ouvert, ouverte", "abierto", "open", ""]], "type": [["On the one hand, technology frees us; on the other hand, it makes us dependent.", ["D'une part, la technologie nous libère ; d'autre part, elle nous rend dépendants.", "D'une part, la technologie nous libère, d'autre part, elle nous rend dépendants."]], ["It's the best book I've ever read.", ["C'est le meilleur livre que j'aie jamais lu."]], ["I don't know anyone who can answer.", ["Je ne connais personne qui puisse répondre."]], ["I would like to qualify this point of view.", ["Je voudrais nuancer ce point de vue.", "J'aimerais nuancer ce point de vue."]], ["Insofar as individual freedom is threatened, we must react.", ["Dans la mesure où la liberté individuelle est menacée, nous devons réagir."]], ["The fact remains that progress has a cost.", ["Il n'en reste pas moins que le progrès a un coût."]]], "listen": ["En premier lieu, il faut définir le problème.", "Cette thèse a été remise en question.", "En outre, il faut souligner la responsabilité collective.", "Je soutiens que la liberté a des limites.", "En somme, la question reste ouverte."], "write": "Write a structured essay of about 300 words: does technology make us freer? Include an introduction, two developed arguments, a counterargument, and a nuanced conclusion.", "speak": {"line": "Unit 36, a debate", "task": "Formal debate: I'll give you a statement on an abstract topic such as freedom, progress or happiness. Defend a position for three minutes with a clear structure, then handle my counterarguments without losing your thread.", "phrases": [["Permettez-moi de nuancer…", "Let me qualify…"], ["Il convient de distinguer…", "One must distinguish…"], ["Je ne nie pas que…, mais…", "I don't deny that…, but…"]]}}, {"id": 37, "phase": 7, "title": "Abstract hypotheses", "fr": "Et si…?", "level": "Superior", "focus": "hypothetical conjunctions with the subjunctive; the expletive ne; quand bien même; probability and possibility", "words": [["à supposer que", "suponiendo que", "supposing that", ""], ["pourvu que", "con tal de que, ojalá", "provided that, let's hope", ""], ["à moins que", "a menos que", "unless", ""], ["quand bien même", "aun cuando", "even if (formal)", ""], ["en admettant que", "admitiendo que", "assuming that", ""], ["sans que", "sin que", "without", ""], ["l'hypothèse", "la hipótesis", "hypothesis", "f"], ["le scénario", "el escenario", "scenario", "m"], ["la conséquence", "la consecuencia", "consequence", "f"], ["probable", "probable", "likely", ""], ["envisager", "plantearse", "to consider", ""], ["s'avérer", "resultar", "to turn out", ""], ["évoluer", "evolucionar", "to evolve", ""], ["l'humanité", "la humanidad", "humanity", "f"], ["disparaître", "desaparecer", "to disappear", ""], ["remplacer", "reemplazar", "to replace", ""], ["la machine", "la máquina", "machine", "f"], ["humain, humaine", "humano", "human", ""], ["s'excuser", "disculparse", "to apologize", ""], ["pardonner", "perdonar", "to forgive", ""], ["faux, fausse", "falso", "false", ""], ["remarquer", "notar", "to notice", ""], ["s'adapter", "adaptarse", "to adapt", ""], ["proposer de", "proponer", "to suggest (doing)", ""]], "type": [["Supposing that machines replace humans, what would we do?", ["À supposer que les machines remplacent les humains, que ferions-nous ?", "À supposer que les machines remplacent les humains, qu'est-ce que nous ferions ?"]], ["We'll go unless it rains.", ["Nous irons à moins qu'il ne pleuve.", "Nous irons à moins qu'il pleuve.", "On ira à moins qu'il pleuve."]], ["Even if he apologized, I wouldn't forgive him.", ["Quand bien même il s'excuserait, je ne lui pardonnerais pas."]], ["Let's hope he arrives on time!", ["Pourvu qu'il arrive à l'heure !"]], ["This hypothesis turned out to be false.", ["Cette hypothèse s'est avérée fausse."]], ["He left without anyone noticing.", ["Il est parti sans que personne ne le remarque.", "Il est parti sans que personne le remarque."]]], "listen": ["Il est probable que la société évoluera rapidement.", "Imaginons un scénario dans lequel le travail disparaîtrait.", "En admettant que tu aies raison, que proposes-tu ?", "Quelles en seraient les conséquences ?", "L'humanité devra s'adapter."], "write": "Write about 300 words on a hypothetical question: if work disappeared, what would give meaning to our lives? Explore at least two scenarios and their consequences.", "speak": {"line": "Unit 37, imagine", "task": "I'll give you an unusual hypothetical situation. Explore it for three minutes: possible scenarios, their consequences, and which outcome you think is most likely and why.", "phrases": [["Admettons que…", "Let's assume that…"], ["Dans ce cas de figure,…", "In that scenario,…"], ["Il n'est pas exclu que…", "It's not impossible that…"]]}}, {"id": 38, "phase": 7, "title": "Ethics and technology", "fr": "Éthique et technologie", "level": "Superior", "focus": "precise abstract vocabulary; nominal style; relative pronouns after prepositions: auquel, duquel, grâce auquel", "words": [["l'éthique", "la ética", "ethics", "f"], ["éthique", "ético", "ethical", ""], ["l'intelligence artificielle", "la inteligencia artificial", "artificial intelligence", "f"], ["les données", "los datos", "data", "f pl"], ["la vie privée", "la privacidad", "privacy", "f"], ["la surveillance", "la vigilancia", "surveillance", "f"], ["l'algorithme", "el algoritmo", "algorithm", "m"], ["le droit", "el derecho", "right, law", "m"], ["la confiance", "la confianza", "trust", "f"], ["faire confiance à", "confiar en", "to trust", ""], ["fiable", "fiable", "reliable", ""], ["le risque", "el riesgo", "risk", "m"], ["l'enjeu", "lo que está en juego", "stake, key issue", "m"], ["encadrer", "regular", "to regulate, to frame", ""], ["la transparence", "la transparencia", "transparency", "f"], ["manipuler", "manipular", "to manipulate", ""], ["garantir", "garantizar", "to guarantee", ""], ["l'utilisateur, l'utilisatrice", "el usuario, la usuaria", "user", "m/f"], ["auquel, à laquelle", "al cual, a la cual", "to which", ""], ["grâce auquel", "gracias al cual", "thanks to which", ""], ["l'outil", "la herramienta", "tool", "m"], ["personnel, personnelle", "personal", "personal", ""], ["soulever", "plantear", "to raise (an issue)", ""], ["nombreux, nombreuse", "numeroso", "many, numerous", ""], ["fondamental, fondamentale", "fundamental", "fundamental", ""], ["le choix", "la elección", "choice", "m"], ["technique", "técnico", "technical", ""], ["la masse", "la masa", "mass", "f"], ["poser", "plantear, poner", "to pose, to raise", ""], ["laisser", "dejar", "to let, to leave", ""]], "type": [["Personal data must be protected.", ["Les données personnelles doivent être protégées."]], ["It's a tool thanks to which we save time.", ["C'est un outil grâce auquel on gagne du temps.", "C'est un outil grâce auquel nous gagnons du temps."]], ["The question I'm thinking about is ethical.", ["La question à laquelle je pense est éthique."]], ["Artificial intelligence raises many risks.", ["L'intelligence artificielle soulève de nombreux risques."]], ["Users must be able to trust algorithms.", ["Les utilisateurs doivent pouvoir faire confiance aux algorithmes."]], ["We must regulate these technologies to guarantee transparency.", ["Il faut encadrer ces technologies pour garantir la transparence.", "Il faut encadrer ces technologies afin de garantir la transparence."]]], "listen": ["Le droit à la vie privée est fondamental.", "Ces algorithmes manipulent nos choix.", "Les enjeux sont à la fois techniques et éthiques.", "La surveillance de masse pose un problème de liberté.", "On ne peut pas laisser les machines décider à notre place."], "write": "Write an argumentative essay of about 300 words: should artificial intelligence be strictly regulated? Define the issue, weigh what's at stake, and propose concrete measures.", "speak": {"line": "Unit 38, ethics and technology", "task": "Discuss with me whether we should accept less privacy in exchange for more security or convenience. Define the terms, take a position, and defend it against my objections.", "phrases": [["L'enjeu principal est…", "The main issue is…"], ["Encore faut-il que…", "It would still need to be the case that…"], ["Cela soulève la question de…", "This raises the question of…"]]}}, {"id": 39, "phase": 7, "title": "Politics and institutions", "fr": "Les institutions", "level": "Superior", "focus": "impersonal constructions: il s'agit de, il convient de, il importe que, il semble que; presenting positions neutrally", "words": [["la démocratie", "la democracia", "democracy", "f"], ["l'État", "el Estado", "the state", "m"], ["la constitution", "la constitución", "constitution", "f"], ["le Parlement", "el Parlamento", "parliament", "m"], ["le député, la députée", "el diputado, la diputada", "member of parliament", "m/f"], ["le citoyen, la citoyenne", "el ciudadano, la ciudadana", "citizen", "m/f"], ["le vote", "el voto", "vote", "m"], ["la réforme", "la reforma", "reform", "f"], ["le débat", "el debate", "debate", "m"], ["le parti", "el partido", "political party", "m"], ["le pouvoir", "el poder", "power", "m"], ["l'opinion publique", "la opinión pública", "public opinion", "f"], ["il s'agit de", "se trata de", "it's a matter of, it's about", ""], ["il convient de", "conviene", "it is appropriate to", ""], ["il importe que", "importa que", "it matters that", ""], ["il semble que", "parece que", "it seems that", ""], ["neutre", "neutral", "neutral", ""], ["défendre", "defender", "to defend", ""], ["s'opposer à", "oponerse a", "to oppose", ""], ["le compromis", "el acuerdo, el compromiso", "compromise", "m"], ["majoritaire", "mayoritario", "majority (adj.)", ""], ["la majorité", "la mayoría", "majority", "f"], ["l'opposition", "la oposición", "opposition", "f"], ["adopter", "adoptar", "to adopt, to pass", ""], ["large", "amplio", "wide, large", ""], ["présenter", "presentar", "to present", ""], ["la position", "la posición", "position", "f"], ["durer", "durar", "to last", ""], ["se rendre", "ir, acudir", "to go (formal)", ""], ["l'urne", "la urna", "ballot box", "f"], ["divisé, divisée", "dividido", "divided", ""]], "type": [["It's a matter of defending citizens' rights.", ["Il s'agit de défendre les droits des citoyens."]], ["It is appropriate to present both positions.", ["Il convient de présenter les deux positions."]], ["It matters that every citizen vote.", ["Il importe que chaque citoyen vote."]], ["The opposition opposes this reform.", ["L'opposition s'oppose à cette réforme."]], ["It seems that a compromise is possible.", ["Il semble qu'un compromis soit possible."]], ["Parliament passed the law by a large majority.", ["Le Parlement a adopté la loi à une large majorité."]]], "listen": ["Le débat sur la réforme a duré des semaines.", "Les citoyens se rendent aux urnes dimanche.", "Ce parti est majoritaire au Parlement.", "L'opinion publique est divisée sur cette question.", "Il convient de rester neutre."], "write": "Write about 300 words presenting, as neutrally as possible, a political debate in your country: what's at stake, the main positions and their arguments. Keep your own opinion for the last paragraph.", "speak": {"line": "Unit 39, presenting a debate", "task": "Explain a current political debate in your country, presenting each side fairly and accurately. Then, only when I ask, give your own view and justify it.", "phrases": [["Les partisans de… estiment que…", "Supporters of … believe that…"], ["Leurs adversaires font valoir que…", "Their opponents argue that…"], ["Il s'agit avant tout de…", "Above all, it's about…"]]}}, {"id": 40, "phase": 7, "title": "Register and nuance", "fr": "Les registres", "level": "Superior", "focus": "familiar, standard and formal French; features of each register; recognizing literary forms and verlan", "words": [["le registre", "el registro", "register", "m"], ["familier, familière", "coloquial", "informal, colloquial", ""], ["soutenu, soutenue", "culto", "formal, elevated", ""], ["le mec", "el tío", "guy (informal)", "m"], ["la bagnole", "el coche (coloquial)", "car (informal)", "f"], ["le boulot", "el curro", "job (informal)", "m"], ["bosser", "currar", "to work (informal)", ""], ["le fric", "la pasta", "money (informal)", "m"], ["sympa", "majo", "nice (informal)", ""], ["ouais", "sí (coloquial)", "yeah", ""], ["le verlan", "el verlan", "back slang", "m"], ["cela", "eso", "that (formal)", ""], ["l'interlocuteur, l'interlocutrice", "el, la interlocutor", "the person you're speaking to", "m/f"], ["poli, polie", "educado", "polite", ""], ["le ton", "el tono", "tone", "m"], ["s'exprimer", "expresarse", "to express oneself", ""], ["en panne", "averiado", "broken down", ""], ["acceptable", "aceptable", "acceptable", ""], ["plein de", "un montón de", "loads of", ""], ["partout", "por todas partes", "everywhere", ""], ["cela dit", "dicho esto", "that said", ""], ["puis-je", "¿puedo?", "may I (formal)", ""]], "type": [["(casual) I don't know.", ["Je sais pas.", "J'sais pas.", "Je ne sais pas."]], ["(casual) My car broke down.", ["Ma bagnole est tombée en panne.", "Ma voiture est tombée en panne."]], ["(formal) That is not acceptable.", ["Cela n'est pas acceptable.", "Ce n'est pas acceptable."]], ["(casual) He earns loads of money at his job.", ["Il gagne plein de fric à son boulot.", "Il gagne beaucoup d'argent à son travail."]], ["(formal) May I ask you a question?", ["Puis-je vous poser une question ?", "Est-ce que je peux vous poser une question ?"]], ["You have to adapt your tone to the person you're talking to.", ["Il faut adapter son ton à son interlocuteur.", "Il faut adapter son ton à son interlocutrice."]]], "listen": ["T'es où ? Je te cherche partout.", "Ouais, c'est sympa, ce boulot.", "Il s'exprime dans un registre très soutenu.", "Ce mec est vraiment sympa.", "Cela dit, il convient de rester poli."], "write": "Write the same message three times, about 80 words each, inviting someone to a party: by text to a close friend, by email to a colleague, and in a formal letter to an important guest.", "speak": {"line": "Unit 40, changing register", "task": "Tell me the same short story twice: first as you would to a close friend in very casual French, then as you would to a formal audience. I'll point out anything that doesn't fit the register.", "phrases": [["Du coup,…", "So,… (casual)"], ["Par conséquent,…", "Consequently,… (formal)"], ["Je me permets de…", "May I… (formal)"]]}}, {"id": 41, "phase": 7, "title": "Idioms and figurative language", "fr": "Les expressions", "level": "Superior", "focus": "common idioms; idioms with Spanish equivalents; advanced false friends", "words": [["avoir le cafard", "estar depre", "to feel down", ""], ["poser un lapin", "dar plantón", "to stand someone up", ""], ["coûter les yeux de la tête", "costar un ojo de la cara", "to cost an arm and a leg", ""], ["avoir un coup de foudre", "tener un flechazo", "to fall in love at first sight", ""], ["tomber dans les pommes", "desmayarse", "to faint", ""], ["il pleut des cordes", "llueve a cántaros", "it's pouring", ""], ["être dans la lune", "estar en las nubes", "to daydream", ""], ["casser les pieds", "dar la lata", "to annoy", ""], ["avoir la flemme", "dar pereza", "to not be bothered", ""], ["en avoir marre", "estar harto", "to be fed up", ""], ["faire la grasse matinée", "quedarse en la cama", "to sleep in", ""], ["se casser la tête", "romperse la cabeza", "to rack one's brain", ""], ["actuellement", "actualmente", "currently", ""], ["éventuellement", "posiblemente", "possibly", ""], ["la librairie", "la librería", "bookshop", "f"], ["la bibliothèque", "la biblioteca", "library", "f"], ["sensible", "sensible", "sensitive", ""], ["arrêter", "dejar de, parar", "to stop", ""]], "type": [["This trip cost an arm and a leg.", ["Ce voyage a coûté les yeux de la tête."]], ["It's pouring, let's stay home.", ["Il pleut des cordes, restons à la maison."]], ["He stood me up yesterday.", ["Il m'a posé un lapin hier."]], ["I'm fed up with this job.", ["J'en ai marre de ce travail.", "J'en ai marre de ce boulot."]], ["On Sundays, I sleep in.", ["Le dimanche, je fais la grasse matinée."]], ["She's currently at the library.", ["Elle est actuellement à la bibliothèque."]]], "listen": ["Arrête de me casser les pieds !", "Ce matin, j'avais vraiment la flemme.", "Il a eu un coup de foudre pour cette ville.", "Ne te casse pas la tête, c'est simple.", "Éventuellement, on pourrait se voir demain."], "write": "Write a short story of about 250 words in which you naturally use at least six idioms from this lesson.", "speak": {"line": "Unit 41, idioms", "task": "Tell me about a frustrating day using at least five idioms naturally. Then I'll use idioms you don't know, and you'll work out their meaning from context.", "phrases": [["Ça veut dire quoi, exactement ?", "What does that mean, exactly?"], ["Comme on dit,…", "As they say,…"], ["Au sens figuré,…", "Figuratively,…"]]}}, {"id": 42, "phase": 7, "title": "Presenting and defending", "fr": "Exposé et soutenance", "level": "Superior", "focus": "structuring a formal presentation; signposting; hedging; handling questions and objections", "words": [["l'exposé", "la exposición", "presentation, talk", "m"], ["la problématique", "el planteamiento", "central question", "f"], ["l'introduction", "la introducción", "introduction", "f"], ["la conclusion", "la conclusión", "conclusion", "f"], ["aborder", "abordar", "to address, to tackle", ""], ["démontrer", "demostrar", "to demonstrate", ""], ["illustrer", "ilustrar", "to illustrate", ""], ["en guise de", "a modo de", "by way of", ""], ["dans un premier temps", "en un primer momento", "first", ""], ["dans un second temps", "en un segundo momento", "second", ""], ["pour conclure", "para concluir", "to conclude", ""], ["en définitive", "en definitiva", "ultimately", ""], ["il semblerait que", "parecería que", "it would seem that", ""], ["dans une certaine mesure", "en cierta medida", "to some extent", ""], ["la piste", "la pista", "avenue, lead", "f"], ["la remarque", "la observación", "comment, remark", "f"], ["pertinent, pertinente", "pertinente", "relevant", ""], ["approfondir", "profundizar", "to go deeper into", ""], ["se poser la question", "preguntarse", "to wonder", ""], ["le résultat", "el resultado", "result", "m"], ["quelques", "algunos", "a few", ""], ["efficace", "eficaz", "effective", ""], ["le propos", "el planteamiento", "point, remarks", "m"], ["rappeler", "recordar", "to recall, to remind", ""], ["essentiel, essentielle", "esencial", "essential", ""], ["même", "mismo", "same", ""]], "type": [["First, I will address the history of the problem.", ["Dans un premier temps, j'aborderai l'histoire du problème."]], ["That's a very relevant comment.", ["C'est une remarque très pertinente."]], ["It would seem that the results confirm our hypothesis.", ["Il semblerait que les résultats confirment notre hypothèse."]], ["To some extent, you're right.", ["Dans une certaine mesure, vous avez raison.", "Dans une certaine mesure, tu as raison."]], ["To conclude, I'd like to suggest a few avenues.", ["Pour conclure, j'aimerais proposer quelques pistes.", "Pour conclure, je voudrais proposer quelques pistes."]], ["Ultimately, the question remains open.", ["En définitive, la question reste ouverte."]]], "listen": ["Je vais démontrer que cette solution est la plus efficace.", "Dans un second temps, nous approfondirons cette idée.", "Votre question me permet d'illustrer mon propos.", "En guise de conclusion, rappelons les points essentiels.", "Je me pose la même question."], "write": "Write the full text of a five-minute presentation, about 400 words, on a topic you care about: an introduction with a central question, two developed parts, and a conclusion that opens onto a new question.", "speak": {"line": "Unit 42, final presentation", "task": "Give me your five-minute presentation, then take my questions. I'll challenge your arguments, ask for clarification and raise objections. Answer precisely and keep a formal register throughout.", "phrases": [["Si je peux me permettre de reformuler…", "If I may rephrase…"], ["C'est une excellente question.", "That's an excellent question."], ["Pour répondre à votre remarque,…", "To respond to your comment,…"]]}}];

const LESSONS={"0": {"intro": ["French spelling looks familiar to a Spanish speaker, but the sounds behind it often aren't. This first lesson isn't about grammar. It's about the handful of sounds Spanish doesn't have, because those sounds, more than vocabulary, decide whether people understand you.", "You'll spend most of this lesson listening and repeating. Tap any example to hear it, then say it out loud before you move on."], "goals": ["Hear and make the difference between u and ou", "Say nasal vowels without an n", "Make the French r", "Stop pronouncing silent letters"], "parts": [{"h": "U and ou", "p": ["Spanish has one rounded vowel at the front of the mouth. French has two. French ou is your Spanish u: lips rounded, tongue pulled back.", "French u is new. Say a Spanish i, keep your tongue exactly where it is, and round your lips tightly. If it feels strange, you're doing it right. Mixing the two changes the meaning: tu means you, tout means all."], "ex": [["tu", "you"], ["tout", "all"], ["la rue", "the street"], ["la roue", "the wheel"]], "bridge": {"p": "Spanish u sounds like French ou. French u has no Spanish equivalent.", "pairs": [["tout", "todo"], ["la roue", "la rueda"]]}}, {"h": "Eu, the rounded e", "p": ["Eu is built the same way as u. Start from a Spanish e and round your lips. Deux (two) and doux (soft) differ only in this vowel. In peur and sœur the mouth is a little more open, but the lips are still rounded."], "ex": [["deux", "two"], ["doux", "soft"], ["la peur", "fear"], ["la sœur", "sister"]]}, {"h": "Nasal vowels", "p": ["When a vowel is followed by n or m in the same syllable, French usually doesn't pronounce the n. The vowel itself goes through the nose, and the tongue never touches the roof of the mouth.", "This is the most noticeable habit of Spanish speakers: saying pain like pan, with a clear n at the end. Practice stopping just before the n."], "table": {"head": ["Spelling", "Sounds like", "Example"], "rows": [["an, en", "a in father, through the nose", "le vent"], ["on", "o, through the nose", "ils vont"], ["in, ain", "a in cat, through the nose", "le vin"]]}, "ex": [["le vent", "the wind"], ["ils vont", "they go"], ["le vin", "the wine"], ["le pain", "the bread"]], "bridge": {"p": "Pan in Spanish ends with a clear n. Pain in French ends with no n at all.", "pairs": [["le pain", "el pan"], ["le vin", "el vino"]]}}, {"h": "The French r", "p": ["The French r is made at the back of the throat, near where you make the Spanish j in jamón, but softer and with your voice switched on. Never roll it or tap it.", "A good way in: say a gentle Spanish j, then add voice until it becomes a light gargle."], "ex": [["la rue", "the street"], ["rouge", "red"], ["la roue", "the wheel"]]}, {"h": "Silent letters and rhythm", "p": ["Most final consonants are silent: petit, deux, tout. A final e is barely heard. Verb endings in -ent are always silent.", "French rhythm is different too. Spanish stresses one syllable inside each word. French keeps every syllable even and puts a single stress on the last syllable of the whole phrase. Le pain est bon has one stress, on bon."], "ex": [["Le pain est bon.", "The bread is good."], ["Tu es tout seul.", "You're all alone."], ["La rue est longue.", "The street is long."]]}], "wrap": "Don't aim for perfection yet. Aim to hear the difference. Every lesson after this one gives you more practice with these sounds."}, "1": {"intro": ["This lesson gives you the language for a first conversation: greeting someone, and saying who you are, where you live, how old you are and which languages you speak.", "Most of it will feel familiar from Spanish. The two big differences: French always needs a subject pronoun, and one verb, être, does the work of both ser and estar."], "goals": ["Greet people and say goodbye", "Introduce yourself in a few sentences", "Use être and avoir in the present", "Choose between tu and vous"], "parts": [{"h": "Greetings", "p": ["Bonjour works all day. Bonsoir replaces it in the evening, and au revoir is goodbye. When you meet someone, say enchanté, or enchantée if you're a woman.", "To give your name, use je m'appelle. It means I call myself, exactly like me llamo."], "ex": [["Bonjour ! Je m'appelle Paul.", "Hello! My name is Paul."], ["Enchanté.", "Nice to meet you."], ["Merci, au revoir !", "Thanks, goodbye!"]]}, {"h": "Subject pronouns are required", "p": ["In Spanish the verb ending tells you who's speaking, so soy americano is a full sentence. French verb endings often sound identical, so the pronoun is never dropped."], "table": {"head": ["French", "Spanish", "English"], "rows": [["je", "yo", "I"], ["tu", "tú", "you"], ["il, elle", "él, ella", "he, she"], ["nous", "nosotros", "we"], ["vous", "usted, ustedes", "you"], ["ils, elles", "ellos, ellas", "they"]]}, "ex": [["Je suis américain.", "I'm American."]]}, {"h": "Être: to be", "p": ["Être covers both ser and estar, so there's no choice to make. Soy and estoy both become je suis."], "table": {"head": ["Subject", "être"], "rows": [["je", "suis"], ["tu", "es"], ["il, elle", "est"], ["nous", "sommes"], ["vous", "êtes"], ["ils, elles", "sont"]]}, "ex": [["Il est ingénieur.", "He's an engineer."], ["Nous sommes amis.", "We're friends."], ["Vous êtes américain ?", "Are you American?"]]}, {"h": "Avoir: to have", "p": ["Avoir is tener, and like tener it gives your age. Never use être for age."], "table": {"head": ["Subject", "avoir"], "rows": [["je", "ai"], ["tu", "as"], ["il, elle", "a"], ["nous", "avons"], ["vous", "avez"], ["ils, elles", "ont"]]}, "ex": [["J'ai trente ans.", "I'm thirty."], ["J'ai vingt-cinq ans.", "I'm twenty-five."]], "bridge": {"p": "Age works exactly as in Spanish.", "pairs": [["j'ai trente ans", "tengo treinta años"]]}}, {"h": "Tu or vous", "p": ["Tu is tú: for friends, family, children, and people your age in casual settings. Vous is usted: for strangers, older people and anyone in a formal setting. Vous is also the only plural you, for any group.", "When in doubt, start with vous and let the other person suggest tu."], "ex": [["Tu parles français ?", "Do you speak French? (casual)"], ["Vous parlez français ?", "Do you speak French? (polite)"]]}, {"h": "Gender and shortened words", "p": ["Every noun is masculine or feminine. Le and un are masculine, la and une feminine. Before a vowel, le and la both become l', which hides the gender, so always learn a noun with its gender.", "Je shortens the same way: je habite becomes j'habite."], "ex": [["le travail", "work (m.)"], ["la langue", "language (f.)"], ["l'anglais", "English (m.)"], ["J'habite aux États-Unis.", "I live in the United States."]]}], "wrap": "Before the exercises, try a short introduction out loud without notes: your name, where you live, your age, your job and your languages."}, "2": {"intro": ["Now that you can talk about yourself, this lesson turns to the people around you. You'll describe family and friends, say what they look like and what they're like, and count to a hundred.", "Adjectives work much as they do in Spanish, agreeing with the noun. The new ideas are where adjectives go, and when to say c'est instead of il est."], "goals": ["Describe someone's looks and personality", "Make adjectives agree", "Use mon, ma and mes", "Count to 100"], "parts": [{"h": "Adjectives agree", "p": ["Add -e for feminine and -s for plural, the way Spanish adds -a and -s. An adjective that already ends in e, like drôle or rouge, stays the same in the feminine.", "The added -e often makes a silent consonant heard. Petit ends in a silent t; petite ends in a clear t."], "table": {"head": ["Masculine", "Feminine", "Plural"], "rows": [["grand", "grande", "grands"], ["petit", "petite", "petits"], ["noir", "noire", "noirs"], ["drôle", "drôle", "drôles"]]}, "ex": [["Ma sœur est grande et drôle.", "My sister is tall and funny."], ["Mes frères sont grands.", "My brothers are tall."]]}, {"h": "Adjectives that change more", "p": ["A few common adjectives change more than an -e. Learn both forms together, the way they appear in your word list."], "table": {"head": ["Masculine", "Feminine"], "rows": [["beau", "belle"], ["blanc", "blanche"], ["gentil", "gentille"]]}, "ex": [["C'est une belle maison.", "It's a beautiful house."], ["Mon amie est très gentille.", "My friend is very kind."]]}, {"h": "Before or after the noun", "p": ["Most adjectives follow the noun, as in Spanish. A short group comes before it: adjectives of beauty, age, goodness and size. Beau, petit, grand and bon are the ones you know so far."], "ex": [["une voiture blanche", "a white car"], ["une belle maison", "a beautiful house"], ["une petite voiture blanche", "a small white car"]]}, {"h": "My: mon, ma, mes", "p": ["Possessives agree with the thing owned, not with the owner. Use mon for masculine, ma for feminine and mes for plural.", "One twist: before a vowel, use mon even for a feminine noun, because ma amie is hard to say."], "table": {"head": ["Masculine", "Feminine", "Plural"], "rows": [["mon père", "ma mère", "mes frères"]]}, "ex": [["mon amie", "my (female) friend"], ["Mon père a les cheveux gris.", "My father has grey hair."]], "bridge": {"p": "Spanish mi becomes mon or ma depending on the noun. Mis becomes mes.", "pairs": [["mon père", "mi padre"], ["ma mère", "mi madre"], ["mes frères", "mis hermanos"]]}}, {"h": "C'est or il est", "p": ["Use c'est before an article or a name. Use il est or elle est before an adjective, or before a job. Just like Spanish es médica, French drops the article with professions."], "ex": [["C'est une belle maison.", "It's a beautiful house."], ["Elle est médecin.", "She's a doctor."], ["Il est très gentil.", "He's very kind."]]}, {"h": "Numbers to 100", "p": ["Up to 69, French counts much like Spanish. Then it switches to twenties: 70 is sixty-ten, 80 is four twenties, and 90 is four twenties and ten."], "table": {"head": ["Number", "French"], "rows": [["70", "soixante-dix"], ["80", "quatre-vingts"], ["90", "quatre-vingt-dix"], ["95", "quatre-vingt-quinze"]]}}], "wrap": "Describe three people you know, in three or four sentences each, before you start the exercises."}, "3": {"intro": ["This lesson is about everyday life: what you do, when you do it, and what you like. It introduces the present tense of regular verbs, the most useful sentence pattern in French.", "You'll also learn to say no and to tell the time."], "goals": ["Conjugate -er verbs in the present", "Use aller and faire", "Make sentences negative", "Tell the time and talk about days", "Say what you like and dislike"], "parts": [{"h": "Regular -er verbs", "p": ["Nine out of ten French verbs end in -er, and they all follow one pattern: remove -er and add the ending.", "Good news for speaking: four of the six forms sound exactly the same. Je travaille, tu travailles, il travaille and ils travaillent are all pronounced travaille. Manger keeps an e before -ons so the g stays soft: nous mangeons."], "table": {"head": ["Subject", "Ending", "travailler"], "rows": [["je", "-e", "travaille"], ["tu", "-es", "travailles"], ["il, elle", "-e", "travaille"], ["nous", "-ons", "travaillons"], ["vous", "-ez", "travaillez"], ["ils, elles", "-ent", "travaillent"]]}, "ex": [["Je travaille le lundi.", "I work on Mondays."], ["Nous mangeons à sept heures.", "We eat at seven."]]}, {"h": "Aller and faire", "p": ["Two of the most common verbs are irregular and worth memorizing now. Aller is ir. Faire is hacer, used for activities, and later for weather."], "table": {"head": ["Subject", "aller", "faire"], "rows": [["je", "vais", "fais"], ["tu", "vas", "fais"], ["il, elle", "va", "fait"], ["nous", "allons", "faisons"], ["vous", "allez", "faites"], ["ils, elles", "vont", "font"]]}, "ex": [["Tu vas souvent au cinéma ?", "Do you often go to the cinema?"], ["Qu'est-ce que tu fais ce soir ?", "What are you doing tonight?"]]}, {"h": "Saying no", "p": ["French wraps the verb in two words: ne before it and pas after it. Ne becomes n' before a vowel. Replace pas with jamais to say never.", "In casual speech, people often drop the ne. Recognize it when you hear it, but always write the full form."], "ex": [["Je ne regarde pas la télé.", "I don't watch TV."], ["Nous n'aimons pas le lundi.", "We don't like Mondays."], ["Elle ne va jamais à la salle de sport.", "She never goes to the gym."]], "bridge": {"p": "Spanish uses a single no before the verb. French needs both pieces.", "pairs": [["je ne regarde pas", "no miro"], ["elle ne va jamais", "nunca va"]]}}, {"h": "Aimer is not gustar", "p": ["In Spanish, the thing you like is the subject: me gusta el café. In French, you are the subject, as in English. Keep the article, just as Spanish does."], "ex": [["J'aime le café.", "I like coffee."]], "bridge": {"p": "Flip the sentence around the person.", "pairs": [["j'aime le café", "me gusta el café"], ["nous n'aimons pas le lundi", "no nos gustan los lunes"]]}}, {"h": "Days and time", "p": ["To give the time, use il est + number + heures. To say at a time, use à.", "A day with le means every week: le lundi is on Mondays. Lundi alone means this Monday."], "ex": [["Il est huit heures.", "It's eight o'clock."], ["Je commence à neuf heures.", "I start at nine."], ["Il est midi et demi.", "It's half past noon."]]}], "wrap": "Walk through your own weekday out loud, from morning to night, with a time for each activity."}, "4": {"intro": ["This lesson takes you out of the house and into the neighborhood. You'll describe where you live, talk about the weather, and say what you want, can and have to do.", "The grammar centers on three verbs that work just like their Spanish twins: vouloir, pouvoir and devoir."], "goals": ["Describe your home and neighborhood", "Use il y a", "Combine à and de with articles", "Talk about the weather", "Say what you want, can and must do"], "parts": [{"h": "Il y a", "p": ["Il y a is the French hay. It's the same for one thing or many, and it never changes form."], "ex": [["Il y a une boulangerie près de ma maison.", "There's a bakery near my house."], ["Il y a trois chambres dans la maison.", "There are three bedrooms in the house."]], "bridge": {"p": "One fixed phrase, used exactly like hay.", "pairs": [["il y a", "hay"]]}}, {"h": "Want, can, must", "p": ["Vouloir, pouvoir and devoir take an infinitive right after them, exactly like querer, poder and deber."], "table": {"head": ["Subject", "vouloir", "pouvoir", "devoir"], "rows": [["je", "veux", "peux", "dois"], ["tu", "veux", "peux", "dois"], ["il, elle", "veut", "peut", "doit"], ["nous", "voulons", "pouvons", "devons"], ["vous", "voulez", "pouvez", "devez"], ["ils, elles", "veulent", "peuvent", "doivent"]]}, "ex": [["Je veux aller au parc.", "I want to go to the park."], ["Tu peux prendre le bus ?", "Can you take the bus?"], ["Nous devons travailler samedi.", "We have to work on Saturday."]]}, {"h": "Au, aux, du, des", "p": ["Spanish combines a + el into al and de + el into del. French does the same, and also combines the plural. Feminine and l' forms don't change."], "table": {"head": ["Combination", "Becomes"], "rows": [["à + le", "au"], ["à + les", "aux"], ["de + le", "du"], ["de + les", "des"], ["à la, à l', de la, de l'", "no change"]]}, "ex": [["Je veux aller au parc.", "I want to go to the park."], ["Je dois aller à la banque.", "I have to go to the bank."]]}, {"h": "The weather", "p": ["Most weather uses faire, like hacer. Rain has its own verb, pleuvoir, used only with il."], "ex": [["Il fait froid aujourd'hui.", "It's cold today."], ["Il pleut beaucoup en novembre.", "It rains a lot in November."]], "bridge": {"p": "Same structure as Spanish.", "pairs": [["il fait froid", "hace frío"], ["il pleut", "llueve"]]}}, {"h": "Prendre", "p": ["Prendre is tomar: you take the bus, the subway, a coffee. It's irregular in the plural."], "table": {"head": ["Subject", "prendre"], "rows": [["je", "prends"], ["tu", "prends"], ["il, elle", "prend"], ["nous", "prenons"], ["vous", "prenez"], ["ils, elles", "prennent"]]}, "ex": [["Ils prennent le métro.", "They take the subway."]]}], "wrap": "Describe your home room by room, then say three things you want, can and must do this weekend."}, "5": {"intro": ["Until now you've mostly answered. This lesson makes you the one asking, the skill that turns memorized phrases into real conversation and a key step toward the Intermediate level.", "French has three ways to form a question. You'll use the first two constantly, and the third mostly when reading."], "goals": ["Ask yes-or-no questions three ways", "Use question words", "Use quel correctly", "Talk about hobbies"], "parts": [{"h": "Three ways to ask", "p": ["The easiest is intonation: say a statement and raise your voice at the end, exactly as in Spanish.", "The second puts est-ce que at the start. It turns any sentence into a question and sounds right in any setting.", "The third swaps the verb and subject. It's formal and mostly written; for now you only need to recognize it."], "table": {"head": ["Style", "Example", "Feel"], "rows": [["Intonation", "Tu joues de la guitare ?", "Casual"], ["Est-ce que", "Est-ce que tu joues de la guitare ?", "Neutral"], ["Inversion", "Joues-tu de la guitare ?", "Formal"]]}}, {"h": "Question words", "p": ["Put the question word first, then est-ce que, then the rest of the sentence. Qu'est-ce que is the everyday way to ask what."], "table": {"head": ["French", "Spanish"], "rows": [["qui", "quién"], ["que, quoi", "qué"], ["où", "dónde"], ["quand", "cuándo"], ["comment", "cómo"], ["pourquoi", "por qué"], ["combien", "cuánto"]]}, "ex": [["Où est-ce que tu habites ?", "Where do you live?"], ["Pourquoi est-ce que tu apprends le français ?", "Why are you learning French?"], ["Qu'est-ce que tu fais le week-end ?", "What do you do on weekends?"]]}, {"h": "Quel", "p": ["Quel asks which or what before a noun, and it agrees: quel, quelle, quels, quelles. All four sound the same, so agreement only matters in writing."], "ex": [["Quel est ton livre préféré ?", "What's your favorite book?"]], "bridge": {"p": "Spanish cuál doesn't change for gender. Quel does.", "pairs": [["quel livre", "qué libro"], ["quelle maison", "qué casa"]]}}, {"h": "Jouer à or jouer de", "p": ["Jouer means to play. Use jouer à for sports and games and jouer de for instruments. Both combine with the article: au foot, de la guitare."], "ex": [["Tu joues de la guitare ?", "Do you play guitar?"], ["Je joue au foot.", "I play soccer."]]}, {"h": "Punctuation", "p": ["French puts a space before ? and !, and never uses an opening ¿. It's small, but it makes your writing look French."], "ex": [["Combien ça coûte ?", "How much does it cost?"]]}], "wrap": "Write ten questions you'd ask a new French-speaking friend, using all three styles."}, "6": {"intro": ["This is your first real transaction: ordering in a café and buying food at a market. Handling a simple transaction is one of the clearest signs of the Intermediate level.", "The grammar here is the partitive, one of the few places where Spanish actively leads you astray."], "goals": ["Order food and drink politely", "Use du, de la and des", "Use de after negatives and quantities", "Ask for and understand prices"], "parts": [{"h": "Some: du, de la, des", "p": ["Spanish often uses no article at all: como pan, bebo agua. French always needs one. When you mean some, or an amount you don't specify, use the partitive."], "table": {"head": ["Noun", "Article", "Example"], "rows": [["masculine", "du", "du pain"], ["feminine", "de la", "de la viande"], ["before a vowel", "de l'", "de l'eau"], ["plural", "des", "des légumes"]]}, "ex": [["Je mange du pain tous les matins.", "I eat bread every morning."], ["Vous voulez de l'eau ?", "Would you like some water?"]], "bridge": {"p": "Where Spanish leaves the article out, French puts du, de la or des.", "pairs": [["je mange du pain", "como pan"], ["vous voulez de l'eau ?", "¿quiere agua?"]]}}, {"h": "After a negative: de", "p": ["After ne… pas or ne… plus, all of these shrink to plain de, or d' before a vowel."], "ex": [["Je ne bois pas de vin.", "I don't drink wine."], ["Nous n'avons plus de poulet.", "We're out of chicken."]]}, {"h": "After a quantity: de", "p": ["Quantity words take de with no article, just like una botella de agua."], "ex": [["une bouteille d'eau", "a bottle of water"], ["un kilo de tomates", "a kilo of tomatoes"]]}, {"h": "Ordering politely", "p": ["Je veux sounds blunt in a café. Use je voudrais, the equivalent of quisiera, and finish with s'il vous plaît."], "ex": [["Je voudrais un café, s'il vous plaît.", "I'd like a coffee, please."], ["L'addition, s'il vous plaît.", "The check, please."]], "bridge": {"p": "The polite forms line up one to one.", "pairs": [["je voudrais", "quisiera"], ["s'il vous plaît", "por favor"]]}}, {"h": "This and these", "p": ["Ce goes before a masculine noun and cette before a feminine one. Before a masculine noun starting with a vowel, ce becomes cet. Ces is the plural for both."], "ex": [["Ce fromage est très bon.", "This cheese is very good."], ["Cette chemise coûte trente euros.", "This shirt costs thirty euros."]]}, {"h": "Prices", "p": ["Say the euros, then the cents, without a word for cents."], "ex": [["Ça fait combien ?", "How much is it?"], ["Ça fait douze euros cinquante.", "That's twelve fifty."]]}], "wrap": "Role-play a café order out loud: a drink, something to eat, and asking for the check."}, "7": {"intro": ["This lesson gets you from one place to another: asking for directions, understanding them, buying a ticket and saying where you're traveling.", "You'll learn the command form of verbs, and French's slightly more complicated rules for prepositions with places."], "goals": ["Ask for and give directions", "Use the imperative", "Choose the right preposition for countries and cities", "Buy a train ticket"], "parts": [{"h": "Giving directions", "p": ["To tell someone what to do, use the imperative: the verb with no subject. With strangers, use the vous form. With friends, use the tu form, where -er verbs drop their final s."], "table": {"head": ["Infinitive", "vous", "tu"], "rows": [["tourner", "tournez", "tourne"], ["prendre", "prenez", "prends"], ["aller", "allez", "va"]]}, "ex": [["Tournez à gauche au carrefour.", "Turn left at the intersection."], ["Prenez la deuxième rue à droite.", "Take the second street on the right."], ["Allez tout droit jusqu'au feu.", "Go straight to the traffic light."]]}, {"h": "Countries and cities", "p": ["Spanish uses en for every country. French chooses by gender: en for feminine countries, au for masculine ones and aux for plural ones. Cities always take à. Most countries ending in -e are feminine."], "table": {"head": ["Place", "Use", "Example"], "rows": [["feminine country", "en", "en France"], ["masculine country", "au", "au Canada"], ["plural country", "aux", "aux États-Unis"], ["city", "à", "à Lyon"]]}, "ex": [["Elle habite en France.", "She lives in France."], ["Je vais au Canada en avion.", "I'm flying to Canada."]], "bridge": {"p": "One Spanish en becomes three different French words.", "pairs": [["en France", "en Francia"], ["au Canada", "en Canadá"], ["aux États-Unis", "en Estados Unidos"]]}}, {"h": "How you travel", "p": ["Use en for vehicles you sit inside: train, plane, bus. Use à when you travel on top of something, or on your own feet."], "ex": [["en train", "by train"], ["en avion", "by plane"], ["à pied", "on foot"]]}, {"h": "First, second, third", "p": ["Add -ième to a number to make it an ordinal: deuxième, troisième, dixième. First is the exception: premier, or première for a feminine noun."], "ex": [["la première rue", "the first street"], ["C'est la troisième rue à gauche.", "It's the third street on the left."]]}], "wrap": "Give directions from your home to the nearest café, one step at a time."}, "8": {"intro": ["This lesson covers your daily routine in more detail, and lets you talk about the near future and the recent past without learning a new tense.", "Both tricks use verbs you already know: aller for what's about to happen, venir for what just happened."], "goals": ["Use reflexive verbs", "Talk about plans with aller + infinitive", "Say what just happened with venir de", "Invite, accept and decline"], "parts": [{"h": "Reflexive verbs", "p": ["Reflexive verbs describe actions you do to yourself, and they work like levantarse. The pronoun matches the subject and always comes before the verb."], "table": {"head": ["Subject", "se lever"], "rows": [["je", "me lève"], ["tu", "te lèves"], ["il, elle", "se lève"], ["nous", "nous levons"], ["vous", "vous levez"], ["ils, elles", "se lèvent"]]}, "ex": [["Je me lève à six heures et demie.", "I get up at six thirty."], ["Je me couche vers onze heures.", "I go to bed around eleven."]]}, {"h": "The near future", "p": ["Aller + infinitive is ir a + infinitive. It's the most common way to talk about plans in spoken French."], "ex": [["Nous allons manger au restaurant demain.", "We're going to eat at the restaurant tomorrow."], ["Je vais me coucher tôt.", "I'm going to go to bed early."]], "bridge": {"p": "In Spanish the pronoun can attach to the end of the infinitive. In French it always goes right before it.", "pairs": [["je vais me coucher", "voy a acostarme"]]}}, {"h": "The recent past", "p": ["Venir de + infinitive means you've just done something, exactly like acabar de."], "ex": [["Je viens d'arriver.", "I just arrived."], ["Elle vient de partir.", "She just left."]], "bridge": {"p": "A direct match.", "pairs": [["je viens d'arriver", "acabo de llegar"]]}}, {"h": "On means we", "p": ["In conversation, French speakers use on far more often than nous. It means we, takes the il form of the verb, and sounds natural and relaxed."], "ex": [["On va se voir la semaine prochaine.", "We'll see each other next week."]]}, {"h": "Inviting and replying", "p": ["Ask whether someone is free, or whether they feel like doing something. Accept with d'accord. Decline with désolé and a reason, because a bare non sounds abrupt."], "ex": [["Tu es libre samedi ?", "Are you free on Saturday?"], ["Tu as envie d'aller au cinéma ?", "Do you feel like going to the cinema?"], ["D'accord, à samedi alors.", "OK, see you Saturday then."], ["Désolé, je ne peux pas ce week-end.", "Sorry, I can't this weekend."]]}], "wrap": "Invite a friend to something this weekend, then practice declining an invitation politely."}, "9": {"intro": ["This lesson opens up the past. Telling what happened, in order, is a defining skill of the Intermediate level.", "The passé composé is your main spoken past tense. It's built from two pieces you already know: a helper verb in the present, and a past participle."], "goals": ["Form the passé composé with avoir", "Know which verbs take être", "Make participles agree with être", "Tell a short story in order"], "parts": [{"h": "Building the passé composé", "p": ["Take avoir in the present and add the past participle of the main verb. In spoken French, this one tense covers both Spanish pasts."], "ex": [["Nous avons mangé dans un petit restaurant.", "We ate in a little restaurant."], ["J'ai pris le train pour Paris.", "I took the train to Paris."]], "bridge": {"p": "Comí and he comido both become one French form.", "pairs": [["j'ai mangé", "comí, he comido"]]}}, {"h": "Past participles", "p": ["Regular -er verbs end in -é, which sounds just like the infinitive. Most -ir verbs end in -i. Common irregular verbs have their own forms; learn them as vocabulary."], "table": {"head": ["Infinitive", "Participle"], "rows": [["manger", "mangé"], ["finir", "fini"], ["faire", "fait"], ["voir", "vu"], ["prendre", "pris"], ["perdre", "perdu"]]}, "ex": [["Tu as fini tes devoirs ?", "Did you finish your homework?"], ["J'ai perdu mes clés.", "I lost my keys."]]}, {"h": "Verbs that take être", "p": ["A group of verbs of movement and change of state use être instead of avoir. The ones you know are aller, venir, arriver, partir, rester and tomber. All reflexive verbs use être too.", "With être, the participle agrees with the subject like an adjective: add -e for feminine and -s for plural."], "table": {"head": ["Subject", "aller"], "rows": [["je", "suis allé(e)"], ["tu", "es allé(e)"], ["il", "est allé"], ["elle", "est allée"], ["nous", "sommes allé(e)s"], ["ils", "sont allés"]]}, "ex": [["Je suis allé au cinéma.", "I went to the cinema."], ["Elle est arrivée il y a deux jours.", "She arrived two days ago."], ["Ils sont restés à la maison.", "They stayed home."]]}, {"h": "Time markers", "p": ["Hier and la semaine dernière place events in the past. Il y a + a length of time means ago, exactly like hace."], "ex": [["Qu'est-ce que tu as fait le week-end dernier ?", "What did you do last weekend?"]], "bridge": {"p": "Same idea, different word.", "pairs": [["il y a deux jours", "hace dos días"]]}}, {"h": "Telling it in order", "p": ["Link events with d'abord and ensuite so the listener can follow the sequence."], "ex": [["D'abord, j'ai pris le train.", "First, I took the train."], ["Ensuite, je suis allé au cinéma.", "Then I went to the cinema."]]}], "wrap": "Tell the story of last weekend in six to eight sentences, using verbs with both avoir and être."}, "10": {"intro": ["The passé composé tells what happened. This lesson adds the imparfait, which describes what things were like and what used to happen.", "Here your Spanish is a huge advantage: the split between the two French past tenses matches the split between pretérito and imperfecto almost exactly."], "goals": ["Form the imparfait", "Describe the past and past habits", "Choose between imparfait and passé composé", "Tell a story with a background and events"], "parts": [{"h": "Forming the imparfait", "p": ["Start from the nous form of the present, remove -ons, and add the endings. Every verb works this way except être, whose stem is ét-."], "table": {"head": ["Subject", "Ending", "habiter"], "rows": [["je", "-ais", "habitais"], ["tu", "-ais", "habitais"], ["il, elle", "-ait", "habitait"], ["nous", "-ions", "habitions"], ["vous", "-iez", "habitiez"], ["ils, elles", "-aient", "habitaient"]]}, "ex": [["Quand j'étais petit, j'habitais dans un village.", "When I was little, I lived in a village."], ["Il faisait beau.", "The weather was nice."]]}, {"h": "Which past tense?", "p": ["Use the imparfait for the background: descriptions, feelings, weather, what was going on, and habits. Use the passé composé for the events that move the story forward."], "table": {"head": ["Imparfait", "Passé composé"], "rows": [["Description and background", "A completed event"], ["Habits: used to", "Something that happened once"], ["What was going on", "What interrupted it"]]}, "ex": [["Je lisais quand il est arrivé.", "I was reading when he arrived."], ["Nous dormions quand le téléphone a sonné.", "We were sleeping when the phone rang."]], "bridge": {"p": "If you'd use the imperfecto in Spanish, use the imparfait. If you'd use the pretérito, use the passé composé.", "pairs": [["je lisais quand il est arrivé", "leía cuando llegó"]]}}, {"h": "Signal words", "p": ["Some words almost always point to one tense. D'habitude, tous les étés and quand j'étais petit point to the imparfait. Soudain and un jour point to the passé composé."], "ex": [["Tous les étés, nous allions à la plage.", "Every summer we went to the beach."], ["D'habitude, elle prenait le bus.", "She usually took the bus."], ["Soudain, il a commencé à pleuvoir.", "Suddenly it started to rain."]]}, {"h": "Hearing the difference", "p": ["Il jouait and il a joué can sound close. The easiest clue is the helper verb: the passé composé has a or ai before the participle."], "ex": [["il jouait", "he used to play"], ["il a joué", "he played"]]}], "wrap": "Describe your childhood home, then tell one specific thing that happened there."}, "11": {"intro": ["Repeating nouns makes speech sound stiff. This lesson teaches the pronouns that replace them, so your sentences flow the way a native speaker's do.", "Direct and indirect pronouns will feel familiar. Y and en are new: Spanish has nothing like them, and they're everywhere in spoken French."], "goals": ["Use le, la, les and lui, leur", "Use y and en", "Put pronouns in the right place", "Combine two pronouns"], "parts": [{"h": "Direct object pronouns", "p": ["Le, la and les replace a person or thing that receives the action directly, just like lo, la, los and las. Le and la become l' before a vowel."], "ex": [["Je la vois tous les jours.", "I see her every day."], ["Je les ai vus hier.", "I saw them yesterday."]], "bridge": {"p": "Same idea, same position before the verb.", "pairs": [["je la vois", "la veo"]]}}, {"h": "Indirect object pronouns", "p": ["Lui and leur replace à + a person: to him, to her, to them. Lui covers both him and her."], "ex": [["Je lui ai donné le livre.", "I gave him the book."], ["Tu lui as parlé ?", "Did you talk to her?"]], "bridge": {"p": "Lui works like le, leur like les.", "pairs": [["je lui ai donné le livre", "le di el libro"]]}}, {"h": "Y: there", "p": ["Y replaces à + a place or a thing. It's how French says there without repeating the place."], "ex": [["Oui, j'y vais demain.", "Yes, I'm going there tomorrow."]]}, {"h": "En: some, of it", "p": ["En replaces de + a noun. It's essential with quantities: if you answer with a number, French needs en where Spanish and English can leave it out."], "ex": [["Tu as du pain ? Oui, j'en ai.", "Do you have bread? Yes, I have some."], ["Il en veut deux.", "He wants two."]], "bridge": {"p": "Spanish says quiere dos. French must say il en veut deux.", "pairs": [["il en veut deux", "quiere dos"]]}}, {"h": "Where pronouns go", "p": ["Pronouns go before the conjugated verb. In the passé composé, they go before avoir or être. With an infinitive, they go right before the infinitive."], "table": {"head": ["Tense", "Example"], "rows": [["Present", "Je la vois."], ["Passé composé", "Je l'ai vue."], ["Near future", "Je vais la voir."]]}, "ex": [["Je vais les appeler ce soir.", "I'm going to call them tonight."]]}, {"h": "Two pronouns together", "p": ["When you need two, le, la or les comes first, and lui or leur second. There's no change like Spanish le becoming se."], "ex": [["Je le lui ai donné.", "I gave it to him."]], "bridge": {"p": "No se lo rule in French.", "pairs": [["je le lui ai donné", "se lo di"]]}}], "wrap": "Answer questions about your day using a pronoun every time instead of repeating the noun."}, "12": {"intro": ["The last lesson brings everything together. You'll give and justify opinions, talk about the future, make polite requests, and handle a problem when something goes wrong.", "These are the skills that carry you from Intermediate Low to Intermediate Mid: linking several sentences into a short, organized answer."], "goals": ["Give and justify an opinion", "Use the futur simple", "Use the conditional to be polite", "Use si sentences and il faut", "Solve a problem in a transaction"], "parts": [{"h": "Giving an opinion", "p": ["Open with je pense que, je trouve que or à mon avis, and always add a reason with parce que. Connectors like donc and pourtant help you build a longer answer."], "ex": [["À mon avis, ce film est trop long.", "In my opinion, this film is too long."], ["Je pense que c'est une bonne idée.", "I think it's a good idea."]]}, {"h": "The futur simple", "p": ["Add the endings to the infinitive, exactly as Spanish does with hablaré. Verbs ending in -re drop the final e first.", "A few common verbs have irregular stems: faire becomes fer-, être becomes ser-, and aller becomes ir-."], "table": {"head": ["Subject", "Ending", "voyager"], "rows": [["je", "-ai", "voyagerai"], ["tu", "-as", "voyageras"], ["il, elle", "-a", "voyagera"], ["nous", "-ons", "voyagerons"], ["vous", "-ez", "voyagerez"], ["ils, elles", "-ont", "voyageront"]]}, "ex": [["L'année prochaine, je voyagerai au Québec.", "Next year I'll travel to Quebec."], ["Nous partirons demain matin.", "We'll leave tomorrow morning."]]}, {"h": "The conditional", "p": ["The conditional uses the future stem with the imparfait endings. It's how you soften a request, like me gustaría."], "ex": [["J'aimerais une chambre avec vue.", "I'd like a room with a view."], ["Ce serait plus simple en train.", "It would be simpler by train."]], "bridge": {"p": "Built the same way as the Spanish conditional.", "pairs": [["j'aimerais", "me gustaría"], ["ce serait", "sería"]]}}, {"h": "If sentences", "p": ["After si, use the present tense, never the future, exactly as in Spanish."], "ex": [["S'il pleut, nous resterons à la maison.", "If it rains, we'll stay home."]], "bridge": {"p": "The same tense pattern.", "pairs": [["s'il pleut, nous resterons", "si llueve, nos quedaremos"]]}}, {"h": "Il faut", "p": ["Il faut + infinitive is hay que: it's necessary to."], "ex": [["Il faut réserver à l'avance.", "You have to book in advance."], ["Il faut changer de chambre.", "We need to change rooms."]]}, {"h": "Handling a problem", "p": ["Put it all together: explain the problem with il y a, say what you'd like with the conditional, and use il faut for what needs to happen."], "ex": [["Il y a un problème avec ma réservation.", "There's a problem with my reservation."], ["On a perdu votre réservation, je suis désolé.", "We've lost your reservation, I'm sorry."]]}], "wrap": "This is the end of the course. Try the hotel role-play in Speak: if you can solve the problem in French, you're working at Intermediate Mid."}, "13": {"intro": ["This lesson prepares you for a situation every traveler eventually faces: feeling unwell and explaining it. You'll name parts of the body, describe symptoms, say how long they've lasted, and understand advice.", "It's also a good example of an Intermediate skill: getting through a real transaction where you need something, not just chatting."], "goals": ["Say what hurts with avoir mal à", "Say how long something has lasted with depuis", "Describe how you feel", "Give and understand advice"], "parts": [{"h": "Avoir mal à", "p": ["To say something hurts, French uses avoir mal à + the body part, with the article. À combines with le and les as usual: au dos, aux pieds, but à la tête."], "table": {"head": ["Body part", "What you say"], "rows": [["la tête", "J'ai mal à la tête."], ["le dos", "J'ai mal au dos."], ["les pieds", "J'ai mal aux pieds."]]}, "ex": [["J'ai mal à la tête.", "My head hurts."], ["Elle a mal à la gorge.", "She has a sore throat."]], "bridge": {"p": "Spanish makes the body part the subject. French keeps you as the subject, with avoir.", "pairs": [["j'ai mal à la tête", "me duele la cabeza"]]}}, {"h": "Depuis with the present", "p": ["When something started in the past and is still going on, French uses the present tense with depuis. English switches to I have had, but French and Spanish both stay in the present."], "ex": [["J'ai de la fièvre depuis deux jours.", "I've had a fever for two days."], ["J'ai mal au dos depuis une semaine.", "My back has hurt for a week."]], "bridge": {"p": "Exactly like desde hace with the present.", "pairs": [["j'ai de la fièvre depuis deux jours", "tengo fiebre desde hace dos días"]]}}, {"h": "How you feel and how you look", "p": ["Se sentir describes how you feel inside: je me sens mieux. Avoir l'air describes how someone looks from the outside: tu as l'air fatigué."], "ex": [["Je me sens mieux aujourd'hui.", "I feel better today."], ["Tu as l'air fatigué.", "You look tired."]]}, {"h": "Giving advice", "p": ["Tu devrais and vous devriez, the conditional of devoir, are the polite way to give advice, like deberías. Il faut is stronger and impersonal."], "ex": [["Tu devrais te reposer.", "You should rest."], ["Il faut prendre ce médicament trois fois par jour.", "You need to take this medicine three times a day."]]}], "wrap": "Imagine calling a pharmacy: describe two symptoms, say how long you've had them, and ask what they'd advise."}, "14": {"intro": ["Work and studies are among the first topics people ask about. In this lesson you'll describe your job or studies, the people around you and your plans.", "The grammar is what lets you build longer, more natural sentences: relative pronouns, the little words that join two ideas into one."], "goals": ["Talk about your job and studies", "Join sentences with qui, que and où", "Use son, sa and ses", "Talk about plans for later"], "parts": [{"h": "Talking about work", "p": ["Remember that jobs take no article after être: il est ingénieur, elle est médecin. To say where you work, use pour with a company and dans with a type of place."], "ex": [["Je travaille pour une entreprise.", "I work for a company."], ["Plus tard, je veux devenir médecin.", "Later, I want to become a doctor."]]}, {"h": "Qui: the subject", "p": ["Qui joins two sentences when the second one needs a subject. It's followed directly by a verb, and it works for people and things alike."], "ex": [["Je travaille pour une entreprise qui fait des voitures.", "I work for a company that makes cars."]]}, {"h": "Que: the object", "p": ["Que joins two sentences when the second one already has a subject. It's followed by a subject and a verb, and it becomes qu' before a vowel. Never leave it out the way English does."], "ex": [["C'est le métier que j'aime.", "It's the job I love."]], "bridge": {"p": "Spanish uses que for both. French splits it: qui before a verb, que before a subject.", "pairs": [["l'entreprise qui fait des voitures", "la empresa que hace coches"], ["le métier que j'aime", "el oficio que me gusta"]]}}, {"h": "Où: where and when", "p": ["Où links to a place, and also to a moment in time, where Spanish would say en que."], "ex": [["C'est le bureau où je travaille.", "This is the office where I work."]]}, {"h": "His, her: son, sa, ses", "p": ["Like Spanish su, son, sa and ses don't tell you whether the owner is a man or a woman. They agree with the thing owned. Son is also used before a feminine noun starting with a vowel."], "table": {"head": ["Masculine", "Feminine", "Plural"], "rows": [["son diplôme", "sa collègue", "ses études"]]}, "ex": [["Elle fait ses études à l'université de Lyon.", "She studies at the University of Lyon."], ["Il a eu son diplôme l'année dernière.", "He got his degree last year."]]}], "wrap": "Describe your job or studies in five sentences, using qui, que and où at least once each."}, "15": {"intro": ["Comparing is how we explain choices: this city or that one, this job or the other, the train or the plane. This lesson gives you all the tools to compare and to say what's best and worst.", "The patterns are very close to Spanish, with two traps worth knowing: the doubled article in superlatives, and the difference between meilleur and mieux."], "goals": ["Compare with plus, moins and aussi", "Compare quantities", "Say the best and the worst", "Choose between meilleur and mieux"], "parts": [{"h": "More, less, as", "p": ["Put plus, moins or aussi before the adjective, and que before the second thing. The adjective still agrees with what it describes."], "table": {"head": ["Pattern", "Example"], "rows": [["plus … que", "plus calme que la ville"], ["moins … que", "moins cher que l'avion"], ["aussi … que", "aussi grand que ta maison"]]}, "ex": [["La campagne est plus calme que la ville.", "The countryside is quieter than the city."], ["Le train est moins cher que l'avion.", "The train is cheaper than the plane."]], "bridge": {"p": "Spanish uses como after tan. French uses que for all three.", "pairs": [["aussi grand que", "tan grande como"]]}}, {"h": "Comparing amounts", "p": ["With nouns, use plus de, moins de and autant de, followed by que."], "ex": [["Il y a plus de voitures en ville qu'à la campagne.", "There are more cars in the city than in the countryside."]]}, {"h": "The most: the superlative", "p": ["Use le, la or les plus + adjective. When the adjective comes after the noun, French repeats the article: la ville la plus propre. Spanish uses the article only once. After a superlative, in is de."], "ex": [["C'est la ville la plus propre de France.", "It's the cleanest city in France."], ["Ce restaurant est le meilleur du quartier.", "This restaurant is the best in the neighborhood."]], "bridge": {"p": "Two articles in French, one in Spanish.", "pairs": [["la ville la plus propre", "la ciudad más limpia"]]}}, {"h": "Meilleur or mieux", "p": ["Spanish has one word, mejor. French has two. Meilleur is an adjective: it describes a noun and agrees with it. Mieux is an adverb: it describes a verb and never changes. Pire is worse."], "ex": [["un meilleur salaire", "a better salary"], ["Elle parle français mieux que moi.", "She speaks French better than me."]]}, {"h": "Stressed pronouns", "p": ["After que, and after prepositions, use moi and toi rather than je and tu."], "ex": [["mieux que moi", "better than me"], ["avec toi", "with you"]]}], "wrap": "Compare two places you know in five sentences, including one superlative and one sentence with mieux or meilleur."}, "16": {"intro": ["Phones, apps and passwords are part of daily life, and so are the problems that come with them. This lesson gives you the vocabulary to talk about technology and to explain when something goes wrong.", "You'll also complete the set of negative words, and learn where pronouns go when you tell someone to do something."], "goals": ["Talk about phones, computers and apps", "Use ne… rien and ne… personne", "Give commands with pronouns", "Explain a technical problem"], "parts": [{"h": "More negatives", "p": ["You already know ne… pas, ne… plus and ne… jamais. Rien (nothing) and personne (nobody) work the same way, wrapped around the verb."], "table": {"head": ["Negative", "Meaning", "Example"], "rows": [["ne… plus", "not anymore", "Il ne marche plus."], ["ne… rien", "nothing", "Je ne comprends rien."], ["ne… personne", "nobody", "Je ne vois personne."]]}, "bridge": {"p": "Like Spanish, French uses a double negative, and it's correct.", "pairs": [["je ne comprends rien", "no entiendo nada"], ["je ne vois personne", "no veo a nadie"]]}}, {"h": "In the passé composé", "p": ["Rien sits between avoir and the participle, like pas. Personne goes after the participle."], "ex": [["Je n'ai rien vu.", "I didn't see anything."], ["Je n'ai vu personne.", "I didn't see anyone."]]}, {"h": "Nobody as a subject", "p": ["Personne and rien can start a sentence. Keep the ne, but drop pas."], "ex": [["Personne ne m'a appelé.", "Nobody called me."]]}, {"h": "Commands with pronouns", "p": ["In a positive command, the pronoun goes after the verb with a hyphen, and me becomes moi. In a negative command, it goes back before the verb."], "ex": [["Envoie-moi le mail.", "Send me the email."], ["Ne l'oublie pas !", "Don't forget it!"]], "bridge": {"p": "Spanish attaches the pronoun in the same place, and moves it before the verb in the negative too.", "pairs": [["envoie-moi", "envíame"], ["ne l'oublie pas", "no lo olvides"]]}}], "wrap": "Describe a technical problem you had: what stopped working, what you tried, and how it ended."}, "17": {"intro": ["This lesson introduces the subjunctive, the step that marks the move to Intermediate High. It sounds intimidating, but you already use it every day in Spanish: es necesario que vengas, quiero que me llames.", "French uses the subjunctive in almost the same places Spanish does, so your main job is learning the forms."], "goals": ["Understand when the subjunctive is used", "Form the present subjunctive", "Learn the key irregular forms", "Use il faut que, vouloir que and pour que"], "parts": [{"h": "What the subjunctive does", "p": ["The subjunctive appears after expressions of necessity, wishes and purpose, when the second verb has a different subject. Il faut que tu partes: it's necessary that you leave."], "ex": [["Il faut que tu partes maintenant.", "You have to leave now."], ["Je veux que tu viennes avec moi.", "I want you to come with me."]], "bridge": {"p": "Same trigger, same structure as Spanish.", "pairs": [["il faut que tu partes", "hace falta que te vayas"], ["je veux que
