<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vif French</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vif">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column; each practice mode owns one vivid color, everything else black and white. */
:root{
  --ink:#0b0b0d; --paper:#ffffff; --soft:#f3f3f6; --line:#efeff3;
  --muted:#5f5f68; --gray:#8a8a93; --faint:#b4b4bc; --dim:#6f6f78;
  --pink:#ff2bbe; --cyan:#2bc8ff; --purple:#5b4bff; --gold:#ffcb2b; --blue:#3b2bff;
  --night:#09090b; --night-soft:#17171b; --night-text:#f4f4f6; --night-muted:#9a9aa4;
  --display:"Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body:"Figtree", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html.night{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html,body{background:var(--paper);color:var(--ink)}
html.night,html.night body{background:var(--night);color:var(--night-text)}
html.splash,html.splash body{background:var(--night)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:inherit}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid currentColor;outline-offset:3px}
#app{height:100%}

.screen{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* Splash */
.splash{height:100%;display:flex;align-items:center;justify-content:center;background:var(--night);color:#fff;cursor:pointer}
.logo{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-size:148px;line-height:1;letter-spacing:.02em}
.logo .clip{display:flex;align-items:baseline;clip-path:inset(0 -12px 0 -12px)}
.logo .l{display:inline-block;transform:translateY(110%);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
.logo .l:nth-child(2){animation-delay:.1s}.logo .l:nth-child(3){animation-delay:.2s}
.logo .dot{display:block;width:26px;height:26px;border-radius:3px;background:#fff;transform:scale(0);
  animation:pop .35s cubic-bezier(.3,1.6,.5,1) .6s forwards, cycle 1.3s linear .6s forwards}
.splash.out .logo{animation:leave .45s cubic-bezier(.6,0,.8,.4) forwards}
@keyframes rise{to{transform:translateY(0)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes leave{to{transform:translateY(-12px);opacity:0}}
@keyframes cycle{
  0%{background:#ff2bbe}7%{background:#2bc8ff}14%{background:#5b4bff}21%{background:#ffcb2b}28%{background:#fff}
  35%{background:#ff2bbe}42%{background:#2bc8ff}49%{background:#5b4bff}56%{background:#ffcb2b}
  63%{background:#ff2bbe}75%{background:#3b2bff}88%,100%{background:#fff}}
@media (prefers-reduced-motion:reduce){.logo .l,.logo .dot{animation:none;transform:none}.splash.out .logo{animation:none;opacity:0}}

/* Home */
.home-top{display:flex;align-items:center;justify-content:space-between;padding:22px 8px 12px}
.wordmark{font-family:var(--display);font-size:36px;letter-spacing:.02em;line-height:1}
.wordmark i{font-style:normal;color:var(--blue)}
.pct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.next{margin-top:28px;background:var(--ink);color:#fff;border-radius:24px;padding:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;text-align:left;width:100%}
.next .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.next .t .mono{color:#a5a5ae}
.next .fr{font-size:14px;font-style:italic;color:#a5a5ae}
.next .go{width:52px;height:52px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center}
.title{display:flex;align-items:baseline;gap:10px;font-family:var(--display);line-height:1;min-width:0}
.title b{font-weight:700}.title span{font-weight:400}
.t28{font-size:28px}.t22{font-size:22px}
.group{padding:40px 8px 0;display:flex;flex-direction:column}
.group+.group{padding-top:32px}
.group .mono{color:var(--muted);padding-bottom:6px}
.ghead{display:flex;align-items:center;gap:10px;width:100%;padding:0 0 6px;text-align:left;color:var(--muted)}
.ghead .mono{padding:0;flex:1}
.ghead .gc{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead svg{transition:transform .28s cubic-bezier(.2,.7,.2,1);flex:none}
.group.shut .ghead svg{transform:rotate(-90deg)}
.gbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s cubic-bezier(.2,.7,.2,1)}
.gbody>div{overflow:hidden;display:flex;flex-direction:column}
.group.shut .gbody{grid-template-rows:0fr}
.group.shut .gbody>div{visibility:hidden;transition:visibility 0s .32s}
.group.fold{border-bottom:1px solid var(--line);padding-bottom:12px}
.group.fold+.group.fold{padding-top:22px}
.row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.row .nm{font-family:var(--display);font-size:22px;font-weight:400;line-height:1.05;min-width:0}
.row .st{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.future .n{color:var(--faint)}.row.future .nm{color:var(--dim)}.row.future .st{color:var(--gray)}
.row.now .st{color:var(--ink)}
.home-pad{height:40px}

/* Unit chrome */
.uhead{display:flex;align-items:center;gap:8px;padding:16px 0 14px}
.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-6px}
.uhead .title b,.uhead .title span{padding-top:3px}
.tabs{padding:4px;background:var(--soft);border-radius:999px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.tab{height:38px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;min-width:0;padding:0 2px}
.night .tabs{background:var(--night-soft)}.night .tab{color:var(--night-muted)}
.tab.on.words{background:var(--pink);color:#fff}
.tab.on.type{background:var(--cyan);color:#fff}
.tab.on.listen{background:var(--purple);color:#fff}
.tab.on.write{background:var(--gold);color:var(--ink)}
.tab.on.speak{background:var(--ink);color:#fff}
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{touch-action:pan-y;overflow-x:clip}
.stage{will-change:transform}
html,body{transition:background-color .3s ease}

/* Glossary */
:root{--green:#0b8a4e;--green-soft:#e8f6ee;--m0:#c4c4cc;--m1:#ff3b30;--m2:#ff8a00;--m3:#ffcb2b;--m4:#16b364}
.lv0{background:var(--m0)}.lv1{background:var(--m1)}.lv2{background:var(--m2)}.lv3{background:var(--m3)}.lv4{background:var(--m4)}
.gentry+.gentry{margin-top:0;border-top:1px solid var(--line)}
.gentry{margin-top:32px;border-top:1px solid var(--ink);display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:18px 8px;text-align:left;width:100%}
.gentry .nm{font-family:var(--display);font-size:22px;line-height:1}
.gentry .st{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gsearch{margin:8px 0 4px;height:52px;border:1.5px solid var(--ink);border-radius:999px;padding:0 22px;font-size:16px;outline:none;background:transparent;width:100%}
.glist{display:flex;flex-direction:column;padding-bottom:40px}
.gletter{font-family:var(--display);font-size:22px;font-weight:700;padding:24px 8px 4px;border-bottom:1px solid var(--ink)}
.gitem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.gitem .fr{font-size:18px;font-weight:600}
.gitem .mean{grid-column:1;font-size:14px;color:var(--gray)}
.gitem .u{grid-row:1/3;grid-column:2;font-family:var(--mono);font-size:11px;color:var(--faint)}
.gempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 24px;color:var(--gray)}
.gempty b{font-family:var(--display);font-size:44px;font-weight:400;color:var(--ink);line-height:.9}
.foot{padding:20px 0 28px;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.foot.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.foot.one{grid-template-columns:1fr}
.btn{height:52px;border-radius:999px;background:var(--soft);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;padding:0 8px}
.btn[disabled]{opacity:.35;cursor:default}
.btn.pink{background:var(--pink);color:#fff}.btn.cyan{background:var(--cyan);color:#fff}
.btn.purple{background:var(--purple);color:#fff}.btn.gold{background:var(--gold);color:var(--ink)}
.btn.black{background:var(--ink);color:#fff}
.night .btn{background:var(--night-soft);color:var(--night-text)}.night .btn.purple{background:var(--purple);color:#fff}

/* Words */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px 8px}
.word{font-family:var(--display);font-size:clamp(56px,22vw,88px);line-height:.9;letter-spacing:.01em;overflow-wrap:anywhere}
.def{display:flex;flex-direction:column;gap:2px;color:var(--gray);font-size:18px;min-height:56px}
.gender{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-top:-6px}
.gitem .fr small{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--gray);margin-left:8px;letter-spacing:.04em}
.submit svg{transition:opacity .15s}
.submit.ok{animation:okpop .45s cubic-bezier(.3,1.6,.5,1)}
.submit.ok path{stroke-dasharray:26;stroke-dashoffset:26;animation:draw .35s .05s ease-out forwards}
@keyframes okpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.zone.leave{animation:pLeave .22s ease-in forwards}.zone.enter{animation:pEnter .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pLeave{to{opacity:0;transform:translateX(-24px)}}@keyframes pEnter{from{opacity:0;transform:translateX(24px)}}

/* Type */
.phrase-zone{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:24px 0}
.phrase{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:.9;text-align:center;text-wrap:balance}
.fix{position:absolute;left:0;right:0;top:calc(50% + var(--off,84px));display:flex;flex-direction:column;gap:6px;text-align:center;padding:0 12px}
.fix .a{font-size:18px;color:#6c6c75}
.fix .a mark{background:none;color:var(--ink);font-weight:600}
.fix .b{font-size:14px;color:#9a9aa3;line-height:1.5}
.fix .ask{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;justify-self:center}
.entry{display:flex;flex-direction:column;gap:12px}
.pill{display:flex;align-items:center;gap:8px;height:60px;border:1.5px solid var(--ink);border-radius:999px;padding:6px 6px 6px 22px}
.pill input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:18px;font-weight:500}
.submit{width:46px;height:46px;flex:none;border-radius:50%;background:var(--cyan);display:grid;place-items:center}
.keys{display:flex;justify-content:center;flex-wrap:wrap;gap:4px}
.keys button{width:38px;height:40px;border-radius:10px;font-size:18px;font-weight:500;color:var(--muted)}
.keys button:active{background:var(--soft)}

/* Listen */
.lcount{display:flex;justify-content:space-between;padding:26px 8px 0;font-family:var(--mono);font-size:12px;color:var(--night-muted)}
.wave{display:flex;align-items:center;gap:4px;height:56px}
.wave i{width:4px;border-radius:2px;background:#33333b}
.wave i.on{background:var(--purple)}
.play{width:132px;height:132px;border-radius:50%;background:var(--purple);display:grid;place-items:center;box-shadow:0 0 0 14px #16142e;transition:transform .15s}
.play:active{transform:scale(.96)}
.chips{display:flex;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;background:var(--night-soft);color:var(--night-text);font-weight:600;font-size:13px}
.lres{min-height:52px;display:flex;flex-direction:column;gap:4px;text-align:center;padding:0 12px}
.lres .a{font-size:18px;color:#a9a9b2}.lres .a mark{background:none;color:#fff;font-weight:600}
.lres .b{font-size:14px;color:#77777f}
.lfield{display:flex;flex-direction:column;gap:8px}
.night .pill{border-color:var(--night-text)}.night .pill input{color:var(--night-text)}
.submit.purple{background:var(--purple)}
.lfield span{font-size:13px;color:var(--night-muted);padding-left:4px}
.lfield input{height:56px;border:1.5px solid var(--night-text);border-radius:999px;padding:0 22px;font-size:18px;font-weight:500;color:var(--night-text);background:var(--night);outline:none}

/* Write */
.wtask{padding:28px 8px 0;display:flex;flex-direction:column;gap:6px}
.wtask p{margin:0;font-size:18px;font-weight:500;line-height:1.45}
.wtask .mono{color:var(--gray)}
.draft{flex:1;display:flex;flex-direction:column;gap:10px;padding:18px 0 0}
.draft textarea{flex:1;min-height:200px;resize:none;border:1.5px solid var(--ink);border-radius:24px;padding:18px 20px;font-size:17px;line-height:1.55;outline:none;background:transparent}
.draft .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);padding:0 6px}
.corrected{margin:0;font-size:21px;font-weight:500;line-height:1.6;white-space:pre-wrap}
.corrected u{text-decoration:none;border-bottom:2px solid var(--gold)}
.notes{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;color:var(--gray)}
.fbwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:24px 12px}
.thinking{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--gray);text-align:center}

/* Learn */
.tab.on.learn{background:var(--green);color:#fff}
.btn.green{background:var(--green);color:#fff}
.lesson{padding:0 8px 8px;display:flex;flex-direction:column;gap:40px}
.lhero{padding-top:30px;display:flex;flex-direction:column;gap:10px}
.lhero .kicker{color:var(--green)}
.ltitle{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(56px,17vw,80px);line-height:.86;letter-spacing:.01em;text-wrap:balance}
.lfr{font-size:18px;font-style:italic;color:var(--gray)}
.lesson p{margin:0;font-size:16.5px;line-height:1.68;color:#2a2a30;max-width:62ch}
.lesson p.lead{margin-top:14px;font-size:19px;line-height:1.55;font-weight:500;color:var(--ink)}
.goals{background:var(--soft);border-radius:24px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.goals .mono{color:var(--muted)}
.goals ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.goals li{display:grid;grid-template-columns:22px 1fr;gap:12px;font-size:16px;font-weight:500;line-height:1.4}
.goals li i{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.part{display:flex;flex-direction:column;gap:16px;border-top:1.5px solid var(--ink);padding-top:18px}
.phead{display:flex;align-items:baseline;gap:14px}
.pnum{font-family:var(--display);font-size:44px;line-height:.75;color:var(--green);flex:none}
.phead h2{margin:0;font-size:23px;font-weight:700;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.ltable{overflow-x:auto;border:1.5px solid var(--ink);border-radius:18px}
.ltable table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.35}
.ltable th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:12px 14px 9px;background:var(--soft);white-space:nowrap}
.ltable td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.ltable td:first-child{color:var(--muted);font-weight:500}
.ltable td+td{font-weight:600}
.exs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ex{display:grid;grid-template-columns:1fr 20px;gap:2px 12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ex .f{font-size:17px;font-weight:600;line-height:1.35}.ex .e{grid-column:1;font-size:14px;color:var(--gray)}
.ex svg{grid-row:1/3;grid-column:2;color:var(--green)}
.bridge{background:var(--green-soft);border-radius:22px;padding:18px 18px 6px;display:flex;flex-direction:column;gap:8px}
.bridge .mono{color:var(--green)}
.lesson .bridge p{font-size:15.5px;line-height:1.55;color:#1d3a2a}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:11px 0;border-top:1px solid rgba(11,138,78,.2);text-align:left;width:100%}
.pair:first-of-type{margin-top:4px}
.pair .pf{font-weight:600;font-size:15.5px}.pair .ps{color:#3b6a51;font-style:italic;font-size:15.5px}
.reading{border:1.5px solid var(--ink);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px}
.reading .mono{color:var(--green)}
.rtitle{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:.95;letter-spacing:.01em}
.lesson p.rfr{font-size:17.5px;line-height:1.75;color:var(--ink);white-space:pre-line}
.lesson p.ren{font-size:15.5px;line-height:1.6;color:var(--gray);white-space:pre-line;border-top:1px solid var(--line);padding-top:12px}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px}
.wrapup{background:var(--ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px}
.wrapup .mono{color:#a5a5ae}.lesson .wrapup p{color:#fff;font-size:17px;line-height:1.55}
.vhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px}
.vhead b{font-family:var(--display);font-size:28px;font-weight:400;line-height:1}

/* Picker + flashcards + quiz */
.ptop{display:flex;justify-content:space-between;align-items:center;padding:20px 8px 6px}
.ptop .mono{color:var(--muted)}
.link{font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:6px 4px}
.pick{display:grid;grid-template-columns:28px 40px 1fr auto;align-items:center;gap:10px;padding:14px 8px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.pick .box{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center}
.pick.on .box{background:var(--ink);border-color:var(--ink)}
.pick .n{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.pick .nm{font-family:var(--display);font-size:22px;line-height:1.05;min-width:0}
.pick:not(.on) .n,.pick:not(.on) .nm{color:var(--dim)}
.pick .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--m0);width:64px}
.mbar i{display:block;height:100%;transition:flex-grow .45s cubic-bezier(.2,.8,.2,1)}
.mbar.big{width:100%;height:10px;border-radius:5px}
.crow{display:grid;grid-template-columns:12px 1fr;gap:4px 12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.crow .dot{width:10px;height:10px;border-radius:50%;grid-row:1/3}
.crow .fr{font-size:17px;font-weight:600}.crow .fr small{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--gray);margin-left:8px}
.crow .mean{font-size:14px;color:var(--gray)}
.sticky{position:sticky;bottom:0;background:var(--paper);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.lenpick{display:flex;gap:8px;padding:8px 8px 0}
.lenpick button{height:40px;padding:0 18px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px}
.lenpick button.on{background:var(--ink);color:#fff}
.fmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);padding:8px 2px 0;font-variant-numeric:tabular-nums}
.fstage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0;perspective:1200px}
.fcard{width:100%;max-width:420px;aspect-ratio:3/4;max-height:52vh;position:relative}
.fcard .inner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fcard.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:1.5px solid var(--ink);border-radius:28px;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .word{font-size:clamp(44px,15vw,68px)}
.face .es{font-size:24px;font-weight:600}.face .en{font-size:18px;color:var(--gray)}
.face .hint{position:absolute;bottom:18px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint)}
.fcard.in{animation:cardIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.levels{display:flex;flex-direction:column;gap:12px;padding:4px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.levels .mono{color:var(--muted);text-align:center}
.lvrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;letter-spacing:-.01em}
.lvb i{width:52px;height:52px;border-radius:50%;display:block;transition:transform .15s,box-shadow .2s}
.lvb.cur i{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.lvb:active i{transform:scale(.92)}
.qbar{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:8px}
.qbar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qzone{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:24px 0}
.qzone .mono{color:var(--muted);text-align:center}
.qbig{text-align:center;font-family:var(--display);font-size:clamp(44px,14vw,64px);line-height:.95}
.qbig.en{font-family:var(--body);font-size:28px;font-weight:600;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;border:1.5px solid var(--ink);border-radius:999px;padding:8px 22px;font-size:17px;font-weight:600;text-align:center;transition:background .2s,color .2s,border-color .2s}
.opt.right{background:var(--m4);border-color:var(--m4);color:#fff}
.opt.wrong{background:var(--m1);border-color:var(--m1);color:#fff}
.opt.dim{opacity:.4}
.qscore{font-family:var(--display);font-size:120px;line-height:.85;text-align:center}
.vrow{display:grid;grid-template-columns:1fr auto 24px;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.vrow .vn{font-size:16px;font-weight:600}.vrow .vr{font-size:13px;color:var(--gray)}
.vrow .q{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted)}
.vrow .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.vrow.on .ck{background:var(--ink)}
.vnote{font-size:13px;color:var(--gray);padding:12px 8px 0;line-height:1.5}

/* Speak */
.say{font-family:var(--display);font-size:72px;line-height:.9;letter-spacing:.01em}
.task{font-size:16px;line-height:1.5;color:var(--gray);max-width:280px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (max-height:700px){.say{font-size:56px}.play{width:108px;height:108px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const STANDALONE=!(window.claude&&window.claude.use);
async function exportProgress(){
  const name="vif-progress-"+new Date().toISOString().slice(0,10)+".json";
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  try{const f=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Vif progress"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
function importProgress(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!d||typeof d!=="object"||!d.u)throw 0;
      S=mergeState(S,d);save();renderHome();toast("Progress loaded");}catch(e){toast("That file isn't a Vif progress file");}};
  inp.click();}

ras", "el brazo", "arm", "m"], ["la main", "la mano", "hand", "f"], ["le pied", "el pie", "foot", "m"], ["avoir mal à", "doler", "to hurt, to have a pain in", ""], ["malade", "enfermo", "sick", ""], ["la fièvre", "la fiebre", "fever", "f"], ["tousser", "toser", "to cough", ""], ["fatigué, fatiguée", "cansado", "tired", ""], ["se sentir", "sentirse", "to feel", ""], ["bien", "bien", "well", ""], ["mieux", "mejor", "better (adverb)", ""], ["depuis", "desde hace, desde", "for, since", ""], ["la pharmacie", "la farmacia", "pharmacy", "f"], ["le médicament", "el medicamento", "medicine", "m"], ["l'ordonnance", "la receta médica", "prescription", "f"], ["le rendez-vous", "la cita", "appointment", "m"], ["se reposer", "descansar", "to rest", ""], ["tu devrais", "deberías", "you should", ""], ["la fois", "la vez", "time (occurrence)", "f"], ["par", "por", "per, by", ""], ["avoir l'air", "parecer", "to look, to seem", ""], ["fermé, fermée", "cerrado", "closed", ""], ["dimanche", "domingo", "Sunday", "m"], ["la semaine", "la semana", "week", "f"]], "type": [["My head hurts.", ["J'ai mal à la tête."]], ["I've had a fever for two days.", ["J'ai de la fièvre depuis deux jours."]], ["She has a sore throat and she coughs a lot.", ["Elle a mal à la gorge et elle tousse beaucoup."]], ["You should rest.", ["Tu devrais te reposer.", "Vous devriez vous reposer."]], ["I would like an appointment with the doctor.", ["Je voudrais un rendez-vous avec le médecin.", "J'aimerais un rendez-vous avec le médecin."]], ["I feel better today.", ["Je me sens mieux aujourd'hui.", "Aujourd'hui, je me sens mieux."]]], "listen": ["J'ai mal au dos depuis une semaine.", "Il faut prendre ce médicament trois fois par jour.", "Tu as l'air fatigué.", "La pharmacie est fermée le dimanche.", "Vous avez une ordonnance ?"], "write": "Write an email of about 100 words to a friend explaining that you're sick: what hurts, since when, what the doctor said, and when you think you'll feel better.", "speak": {"line": "Unit 13, at the doctor", "task": "You're at the doctor and I'm the doctor. Describe your symptoms, say how long you've had them, and ask what you should do.", "phrases": [["J'ai mal à…", "My … hurts"], ["Depuis quand ?", "Since when?"], ["Qu'est-ce que je devrais faire ?", "What should I do?"]]}}, {"id": 14, "phase": 4, "title": "Work and studies", "fr": "Le travail et les études", "level": "Intermediate Mid", "focus": "relative pronouns qui, que and où; son, sa, ses; talking about jobs and studies", "words": [["le métier", "el oficio, la profesión", "job, trade", "m"], ["l'entreprise", "la empresa", "company", "f"], ["le patron, la patronne", "el jefe, la jefa", "boss", "m/f"], ["le, la collègue", "el, la colega", "colleague", "m/f"], ["le bureau", "la oficina", "office", "m"], ["le salaire", "el sueldo", "salary", "m"], ["l'université", "la universidad", "university", "f"], ["les études", "los estudios", "studies", "f pl"], ["étudier", "estudiar", "to study", ""], ["le diplôme", "el título", "degree, diploma", "m"], ["chercher", "buscar", "to look for", ""], ["trouver", "encontrar", "to find", ""], ["le stage", "las prácticas", "internship", "m"], ["intéressant, intéressante", "interesante", "interesting", ""], ["difficile", "difícil", "difficult", ""], ["facile", "fácil", "easy", ""], ["gagner", "ganar", "to earn, to win", ""], ["devenir", "llegar a ser", "to become", ""], ["plus tard", "más tarde", "later", ""], ["son, sa, ses", "su, sus", "his, her, its", ""], ["mais", "pero", "but", ""]], "type": [["I work for a company that makes cars.", ["Je travaille pour une entreprise qui fait des voitures."]], ["My colleague is looking for an internship.", ["Ma collègue cherche un stage.", "Mon collègue cherche un stage."]], ["It's the job that I love.", ["C'est le métier que j'aime.", "C'est le métier que j'adore."]], ["This is the office where I work.", ["C'est le bureau où je travaille.", "Voici le bureau où je travaille."]], ["She studies at the university of Lyon.", ["Elle fait ses études à l'université de Lyon.", "Elle étudie à l'université de Lyon."]], ["Later, I want to become a doctor.", ["Plus tard, je veux devenir médecin."]]], "listen": ["Le travail est intéressant mais difficile.", "Mon patron est très gentil.", "Elle gagne un bon salaire.", "J'ai trouvé un stage dans une entreprise à Paris.", "Il a eu son diplôme l'année dernière."], "write": "Write about 120 words about your job or studies: what you do, where, the people you work with, what you like and don't like, and what you want to do later. Use qui, que and où at least once each.", "speak": {"line": "Unit 14, job interview", "task": "Job interview: I'm the interviewer. Present your studies and experience, explain why you want the job, and ask me two questions about the company.", "phrases": [["J'ai travaillé chez…", "I worked at…"], ["Je cherche un poste où…", "I'm looking for a position where…"], ["Quels sont les horaires ?", "What are the hours?"]]}}, {"id": 15, "phase": 4, "title": "Comparing", "fr": "Comparer", "level": "Intermediate Mid", "focus": "comparatives and superlatives, meilleur and mieux, stressed pronouns", "words": [["plus… que", "más… que", "more… than", ""], ["moins… que", "menos… que", "less… than", ""], ["aussi… que", "tan… como", "as… as", ""], ["autant de", "tanto, tanta", "as much, as many", ""], ["meilleur, meilleure", "mejor", "better (adjective)", ""], ["le meilleur, la meilleure", "el mejor, la mejor", "the best", ""], ["pire", "peor", "worse", ""], ["bon marché", "barato", "cheap", ""], ["la ville", "la ciudad", "city, town", "f"], ["le pays", "el país", "country", "m"], ["la campagne", "el campo", "countryside", "f"], ["calme", "tranquilo", "quiet, calm", ""], ["bruyant, bruyante", "ruidoso", "noisy", ""], ["vivre", "vivir", "to live", ""], ["propre", "limpio", "clean", ""], ["rapide", "rápido", "fast", ""], ["lent, lente", "lento", "slow", ""], ["moi, toi", "yo, mí, tú, ti", "me, you (stressed)", ""], ["la qualité de vie", "la calidad de vida", "quality of life", "f"]], "type": [["Paris is bigger than Lyon.", ["Paris est plus grand que Lyon.", "Paris est plus grande que Lyon."]], ["The countryside is quieter than the city.", ["La campagne est plus calme que la ville."]], ["This restaurant is the best in the neighborhood.", ["Ce restaurant est le meilleur du quartier."]], ["The train is less expensive than the plane.", ["Le train est moins cher que l'avion."]], ["She speaks French better than me.", ["Elle parle français mieux que moi.", "Elle parle mieux français que moi."]], ["It's the worst film of the year.", ["C'est le pire film de l'année.", "C'est le plus mauvais film de l'année."]]], "listen": ["Il y a plus de voitures en ville qu'à la campagne.", "Mon appartement est aussi grand que ta maison.", "Je vis dans un pays très calme.", "Le métro est plus rapide que le bus.", "C'est la ville la plus propre de France."], "write": "Compare the city where you live with another city you know, in about 120 words: size, prices, transport, noise and people. Finish with which one you prefer and why.", "speak": {"line": "Unit 15, comparing cities", "task": "Compare where you live with a place you'd like to live. Explain which is better for work, prices and quality of life, and defend your choice when I disagree.", "phrases": [["C'est plus … que…", "It's more … than…"], ["Le meilleur, c'est…", "The best thing is…"], ["Par contre,…", "On the other hand,…"]]}}, {"id": 16, "phase": 4, "title": "Screens and technology", "fr": "Les écrans", "level": "Intermediate Mid", "focus": "ne… rien, ne… personne, pronouns with commands, technology vocabulary", "words": [["le portable", "el móvil", "cell phone", "m"], ["l'ordinateur", "el ordenador", "computer", "m"], ["l'écran", "la pantalla", "screen", "m"], ["le mot de passe", "la contraseña", "password", "m"], ["l'application", "la aplicación", "app", "f"], ["télécharger", "descargar", "to download", ""], ["le mail", "el correo", "email", "m"], ["charger", "cargar", "to charge", ""], ["la batterie", "la batería", "battery", "f"], ["marcher", "funcionar", "to work (a machine)", ""], ["ne… rien", "no… nada", "nothing", ""], ["ne… personne", "no… nadie", "nobody", ""], ["quelque chose", "algo", "something", ""], ["quelqu'un", "alguien", "someone", ""], ["en ligne", "en línea", "online", ""], ["le réseau", "la red", "network, signal", "m"], ["oublier", "olvidar", "to forget", ""], ["s'il te plaît", "por favor", "please (informal)", ""], ["sur", "sobre, en", "on", ""], ["comprendre", "entender", "to understand", ""], ["sans", "sin", "without", ""]], "type": [["I forgot my password.", ["J'ai oublié mon mot de passe."]], ["My phone doesn't work anymore.", ["Mon portable ne marche plus."]], ["Send me the email, please.", ["Envoie-moi le mail, s'il te plaît.", "Envoyez-moi le mail, s'il vous plaît."]], ["I didn't see anything.", ["Je n'ai rien vu."]], ["Nobody called me.", ["Personne ne m'a appelé.", "Personne ne m'a appelée."]], ["Download the app on your phone.", ["Télécharge l'application sur ton portable.", "Téléchargez l'application sur votre portable."]]], "listen": ["Il faut charger ton portable.", "Je n'ai rien compris.", "Tu as vu quelqu'un ?", "Ne l'oublie pas !", "L'ordinateur ne marche pas sans réseau."], "write": "Write about 120 words about how you use technology in a typical day: your phone, your computer, the apps you use, and one problem you had recently and how you solved it.", "speak": {"line": "Unit 16, tech support", "task": "Call tech support: your phone or computer has a problem and I'm the technician. Explain what happened, answer my questions and follow my instructions.", "phrases": [["Il ne marche plus.", "It doesn't work anymore."], ["J'ai déjà essayé de…", "I've already tried to…"], ["Qu'est-ce que je dois faire ?", "What do I have to do?"]]}}, {"id": 17, "phase": 4, "title": "Advice and necessity", "fr": "Conseils et obligations", "level": "Intermediate High", "focus": "the present subjunctive after il faut que, vouloir que and il est important que; pour que and avant que", "words": [["il faut que", "hace falta que", "it's necessary that", ""], ["vouloir que", "querer que", "to want (someone) to", ""], ["il est important que", "es importante que", "it's important that", ""], ["conseiller", "aconsejar", "to advise", ""], ["le conseil", "el consejo", "piece of advice", "m"], ["il vaut mieux", "más vale", "it's better to", ""], ["pour que", "para que", "so that", ""], ["avant que", "antes de que", "before", ""], ["savoir", "saber", "to know (a fact)", ""], ["attendre", "esperar", "to wait", ""], ["à l'heure", "a tiempo", "on time", ""], ["en retard", "tarde, con retraso", "late", ""], ["maintenant", "ahora", "now", ""], ["lentement", "despacio", "slowly", ""], ["un peu", "un poco", "a little", ""], ["la vérité", "la verdad", "truth", "f"], ["le sport", "el deporte", "sport, exercise", "m"], ["le sommeil", "el sueño", "sleep", "m"], ["sérieux, sérieuse", "serio", "serious", ""]], "type": [["You have to leave now.", ["Il faut que tu partes maintenant.", "Il faut que vous partiez maintenant."]], ["I want you to come with me.", ["Je veux que tu viennes avec moi.", "Je veux que vous veniez avec moi."]], ["It's important that you sleep well.", ["Il est important que tu dormes bien.", "Il est important que vous dormiez bien."]], ["It's better to arrive on time.", ["Il vaut mieux arriver à l'heure."]], ["Speak slowly so that I understand.", ["Parle lentement pour que je comprenne.", "Parlez lentement pour que je comprenne."]], ["We have to do some exercise.", ["Il faut que nous fassions du sport.", "Il faut qu'on fasse du sport."]]], "listen": ["Il faut que je sois à la gare à huit heures.", "Ma mère veut que je fasse des études.", "Il vaut mieux attendre un peu.", "Je te conseille de te reposer.", "Il faut que tu saches la vérité."], "write": "A friend is moving to France and asks for your advice. Write about 120 words of advice using il faut que, il est important que and je te conseille de.", "speak": {"line": "Unit 17, giving advice", "task": "I have a problem: I'm stressed, I sleep badly and I work too much. Give me at least five pieces of advice, using il faut que and il vaut mieux.", "phrases": [["Il faut que tu…", "You need to…"], ["À ta place, je…", "If I were you, I'd…"], ["Il vaut mieux…", "It's better to…"]]}}, {"id": 18, "phase": 4, "title": "Feelings and doubt", "fr": "Sentiments et doutes", "level": "Intermediate High", "focus": "the subjunctive after emotions and doubt, the indicative after certainty, bien que and même si", "words": [["heureux, heureuse", "feliz", "happy", ""], ["triste", "triste", "sad", ""], ["avoir peur que", "tener miedo de que", "to be afraid that", ""], ["regretter", "lamentar", "to be sorry, to regret", ""], ["douter", "dudar", "to doubt", ""], ["sûr, sûre", "seguro", "sure", ""], ["croire", "creer", "to believe", ""], ["surpris, surprise", "sorprendido", "surprised", ""], ["fier, fière", "orgulloso", "proud", ""], ["inquiet, inquiète", "preocupado", "worried", ""], ["en colère", "enfadado", "angry", ""], ["c'est dommage", "es una pena", "it's a pity", ""], ["bien que", "aunque", "although", ""], ["même si", "aunque, incluso si", "even if", ""], ["il est possible que", "es posible que", "it's possible that", ""], ["peut-être", "quizás", "maybe", ""], ["réussir", "lograr, aprobar", "to succeed, to pass", ""], ["l'examen", "el examen", "exam", "m"], ["ensemble", "juntos", "together", ""], ["vrai, vraie", "verdadero", "true", ""]], "type": [["I'm happy that you're here.", ["Je suis content que tu sois là.", "Je suis contente que tu sois là.", "Je suis heureux que tu sois là.", "Je suis heureuse que tu sois là."]], ["It's a pity that she can't come.", ["C'est dommage qu'elle ne puisse pas venir."]], ["I doubt that he'll pass the exam.", ["Je doute qu'il réussisse l'examen."]], ["I think that he'll pass the exam.", ["Je pense qu'il va réussir l'examen.", "Je pense qu'il réussira l'examen."]], ["Although it's cold, we're going to the beach.", ["Bien qu'il fasse froid, nous allons à la plage.", "Bien qu'il fasse froid, on va à la plage."]], ["My father is proud of me.", ["Mon père est fier de moi."]]], "listen": ["J'ai peur qu'il soit en retard.", "Elle est triste que tu partes.", "Je ne crois pas que ce soit vrai.", "Je suis sûr qu'il viendra.", "Peut-être qu'on peut le faire ensemble."], "write": "A friend has just shared big news: a new job, a move or a baby. Write about 120 words reacting with your feelings, expressing one worry and wishing them well, using the subjunctive at least three times.", "speak": {"line": "Unit 18, reacting to news", "task": "I'll tell you five pieces of news, good and bad. React to each one with an emotion, a doubt or a certainty, choosing the right mood.", "phrases": [["Je suis content que…", "I'm glad that…"], ["C'est dommage que…", "It's a pity that…"], ["Je ne crois pas que…", "I don't think that…"]]}}, {"id": 19, "phase": 4, "title": "What had happened", "fr": "Ce qui s'était passé", "level": "Intermediate High", "focus": "the plus-que-parfait; après avoir + participle; avant de + infinitive; se rendre compte", "words": [["déjà", "ya", "already", ""], ["pas encore", "todavía no", "not yet", ""], ["encore", "todavía, otra vez", "still, again", ""], ["après", "después", "after", ""], ["avant de", "antes de", "before (+ verb)", ""], ["après avoir", "después de haber", "after having", ""], ["lorsque", "cuando", "when (formal)", ""], ["pendant", "durante", "during", ""], ["le lendemain", "el día siguiente", "the next day", "m"], ["la veille", "la víspera", "the day before", "f"], ["se rendre compte", "darse cuenta", "to realize", ""], ["retrouver", "encontrar (de nuevo)", "to find again", ""], ["fermer", "cerrar", "to close", ""], ["ouvrir", "abrir", "to open", ""], ["la porte", "la puerta", "door", "f"], ["la valise", "la maleta", "suitcase", "f"], ["voler", "robar", "to steal", ""], ["la nuit", "la noche", "night", "f"], ["tout, toute", "todo, toda", "all, the whole", ""]], "type": [["When I arrived, the train had already left.", ["Quand je suis arrivé, le train était déjà parti.", "Quand je suis arrivée, le train était déjà parti."]], ["She had forgotten her keys.", ["Elle avait oublié ses clés."]], ["After eating, we went to the cinema.", ["Après avoir mangé, nous sommes allés au cinéma.", "Après avoir mangé, on est allés au cinéma.", "Après avoir mangé, nous sommes allées au cinéma."]], ["Before leaving, close the door.", ["Avant de partir, ferme la porte.", "Avant de partir, fermez la porte."]], ["I realized that I had lost my suitcase.", ["Je me suis rendu compte que j'avais perdu ma valise."]], ["The next day, we found it.", ["Le lendemain, nous l'avons retrouvée.", "Le lendemain, on l'a retrouvée."]]], "listen": ["Je n'avais pas encore fini quand il est arrivé.", "La veille, il avait plu toute la nuit.", "Après avoir ouvert la porte, elle a vu le chien.", "Quelqu'un avait volé mon portable.", "Pendant le voyage, j'ai perdu ma valise."], "write": "Tell, in about 150 words, the story of a trip where something went wrong. Use the imparfait, the passé composé and at least two verbs in the plus-que-parfait.", "speak": {"line": "Unit 19, a story", "task": "Tell me about a day when things went wrong, with a beginning, a middle and an end. Use the plus-que-parfait to explain what had happened before.", "phrases": [["Ce jour-là,…", "That day,…"], ["Je me suis rendu compte que…", "I realized that…"], ["Heureusement,…", "Luckily,…"]]}}, {"id": 20, "phase": 4, "title": "Travel complications", "fr": "Imprévus de voyage", "level": "Intermediate High", "focus": "handling a complication; celui, celle; le mien, la mienne; the passive with être", "words": [["le vol", "el vuelo", "flight", "m"], ["annulé, annulée", "cancelado", "cancelled", ""], ["la correspondance", "la conexión", "connection (transport)", "f"], ["les bagages", "el equipaje", "luggage", "m pl"], ["le guichet", "la taquilla", "ticket counter", "m"], ["échanger", "cambiar", "to exchange", ""], ["se plaindre", "quejarse", "to complain", ""], ["la place", "el asiento, la plaza", "seat", "f"], ["le retard", "el retraso", "delay", "m"], ["celui, celle", "el, la (de, que)", "the one", ""], ["ceux, celles", "los, las (de, que)", "the ones", ""], ["le mien, la mienne", "el mío, la mía", "mine", ""], ["le tien, la tienne", "el tuyo, la tuya", "yours", ""], ["le sien, la sienne", "el suyo, la suya", "his, hers", ""], ["proposer", "proponer, ofrecer", "to suggest, to offer", ""], ["malheureusement", "desafortunadamente", "unfortunately", ""], ["heureusement", "afortunadamente", "fortunately", ""], ["l'hôtel", "el hotel", "hotel", "m"]], "type": [["My flight was cancelled.", ["Mon vol a été annulé."]], ["Which suitcase is yours? The black one.", ["Quelle valise est la tienne ? La noire.", "Quelle valise est à toi ? La noire."]], ["This seat is mine.", ["Cette place est la mienne."]], ["I'll take the one that leaves at ten.", ["Je prends celui qui part à dix heures.", "Je vais prendre celui qui part à dix heures."]], ["Unfortunately, the train is late.", ["Malheureusement, le train est en retard.", "Malheureusement, le train a du retard."]], ["What can you offer me?", ["Qu'est-ce que vous pouvez me proposer ?", "Que pouvez-vous me proposer ?"]]], "listen": ["Votre vol a trois heures de retard.", "Nous vous proposons une nuit à l'hôtel.", "Ce ne sont pas mes bagages, ce sont ceux de mon ami.", "Heureusement, il reste une place dans le train de midi.", "Je voudrais me plaindre, mon vol a été annulé."], "write": "Write a formal complaint of about 150 words to an airline: your flight was cancelled. Explain what happened, how it affected you, and what you expect them to do.", "speak": {"line": "Unit 20, cancelled flight", "task": "Your flight home has been cancelled and I'm the airline agent. Explain your situation, turn down my first offer, and negotiate a solution that works for you.", "phrases": [["Ce n'est pas possible pour moi parce que…", "That doesn't work for me because…"], ["Est-ce qu'il y a une autre solution ?", "Is there another solution?"], ["Je voudrais être remboursé.", "I'd like a refund."]]}}, {"id": 21, "phase": 5, "title": "Telling a full story", "fr": "Raconter une histoire", "level": "Advanced Low", "focus": "paragraph-length narration; linking words; pendant que, tandis que, alors que, au moment où; reading the passé simple", "words": [["alors que", "mientras que", "while, whereas", ""], ["tandis que", "mientras que", "while", ""], ["au moment où", "en el momento en que", "just as", ""], ["tout à coup", "de repente", "suddenly", ""], ["finalement", "finalmente", "in the end", ""], ["enfin", "por fin", "at last, finally", ""], ["puis", "luego", "then", ""], ["au début", "al principio", "at first", ""], ["à la fin", "al final", "at the end", ""], ["se passer", "pasar, ocurrir", "to happen", ""], ["il était une fois", "érase una vez", "once upon a time", ""], ["le roi", "el rey", "king", "m"], ["la reine", "la reina", "queen", "f"], ["le château", "el castillo", "castle", "m"], ["décider", "decidir", "to decide", ""], ["revenir", "volver", "to come back", ""], ["se marier", "casarse", "to get married", ""], ["mourir", "morir", "to die", ""], ["naître", "nacer", "to be born", ""], ["la vie", "la vida", "life", "f"], ["la météo", "el pronóstico del tiempo", "weather forecast", "f"], ["annoncer", "anunciar", "to announce", ""], ["le soleil", "el sol", "sun", "m"], ["le grand-père, la grand-mère", "el abuelo, la abuela", "grandfather, grandmother", "m/f"]], "type": [["I was reading while my sister was watching TV.", ["Je lisais pendant que ma sœur regardait la télé.", "Je lisais tandis que ma sœur regardait la télé."]], ["Just as I was leaving, the phone rang.", ["Au moment où je partais, le téléphone a sonné."]], ["At first, everything was going well.", ["Au début, tout allait bien."]], ["Suddenly, he decided to come back.", ["Tout à coup, il a décidé de revenir.", "Soudain, il a décidé de revenir."]], ["What happened at the end of the film?", ["Qu'est-ce qui s'est passé à la fin du film ?"]], ["My grandfather was born in 1950 and died in 2020.", ["Mon grand-père est né en 1950 et il est mort en 2020.", "Mon grand-père est né en 1950 et est mort en 2020."]]], "listen": ["Il était une fois un roi qui vivait dans un grand château.", "Elle s'est mariée à vingt-cinq ans.", "Finalement, tout s'est bien passé.", "Il pleuvait, alors que la météo avait annoncé du soleil.", "Puis ils sont revenus à la maison."], "write": "Write a story of about 180 words, real or invented, with a clear beginning, middle and end. Use at least four linking words from this lesson and all three past tenses.", "speak": {"line": "Unit 21, a story from your life", "task": "Tell me, for about three minutes, the story of an important moment in your life. Set the scene, tell what happened in order, and explain how it ended and what it changed.", "phrases": [["Tout a commencé quand…", "It all started when…"], ["Au moment où…", "Just as…"], ["Finalement,…", "In the end,…"]]}}, {"id": 22, "phase": 5, "title": "Plans and the future", "fr": "Projets d'avenir", "level": "Advanced Low", "focus": "the futur antérieur; the future after quand and dès que; talking about plans", "words": [["dès que", "en cuanto", "as soon as", ""], ["aussitôt que", "tan pronto como", "as soon as", ""], ["le projet", "el proyecto, el plan", "plan, project", "m"], ["prévoir", "prever", "to plan, to foresee", ""], ["avoir l'intention de", "tener la intención de", "to intend to", ""], ["déménager", "mudarse", "to move (home)", ""], ["la retraite", "la jubilación", "retirement", "f"], ["prendre sa retraite", "jubilarse", "to retire", ""], ["un jour", "algún día", "someday", ""], ["l'avenir", "el futuro", "future", "m"], ["bientôt", "pronto", "soon", ""], ["économiser", "ahorrar", "to save (money)", ""], ["l'argent", "el dinero", "money", "m"], ["acheter", "comprar", "to buy", ""], ["vendre", "vender", "to sell", ""], ["terminer", "terminar", "to finish", ""], ["obtenir", "obtener", "to obtain, to get", ""], ["le permis de conduire", "el carné de conducir", "driver's license", "m"], ["conduire", "conducir", "to drive", ""], ["possible", "posible", "possible", ""]], "type": [["When I arrive, I'll call you.", ["Quand j'arriverai, je t'appellerai.", "Quand j'arriverai, je vous appellerai."]], ["As soon as I've finished, I'll come.", ["Dès que j'aurai fini, je viendrai.", "Dès que j'aurai terminé, je viendrai."]], ["In five years, I will have bought a house.", ["Dans cinq ans, j'aurai acheté une maison."]], ["We intend to move soon.", ["Nous avons l'intention de déménager bientôt.", "On a l'intention de déménager bientôt."]], ["She will retire next year.", ["Elle prendra sa retraite l'année prochaine."]], ["I'm saving money to buy a car.", ["J'économise de l'argent pour acheter une voiture."]]], "listen": ["Quand tu auras ton permis, tu pourras conduire ma voiture.", "Je vendrai mon appartement dès que possible.", "Qu'est-ce que tu prévois pour l'avenir ?", "Lorsqu'il aura terminé ses études, il cherchera du travail.", "On verra bien !"], "write": "Write about 180 words about where you see yourself in five years: work, home, your French and one personal goal. Use the futur simple and the futur antérieur, with at least two sentences using quand or dès que.", "speak": {"line": "Unit 22, my plans", "task": "Tell me about your plans for the next five years in detail, then answer my follow-up questions about how you'll make them happen.", "phrases": [["J'ai l'intention de…", "I intend to…"], ["Dès que j'aurai…", "As soon as I have…"], ["D'ici cinq ans,…", "Within five years,…"]]}}, {"id": 23, "phase": 5, "title": "Hypotheses", "fr": "Si j'étais…", "level": "Advanced Low", "focus": "si + imparfait with the conditional; à ta place; au cas où", "words": [["le loto", "la lotería", "lottery", "m"], ["riche", "rico", "rich", ""], ["le monde", "el mundo", "world", "m"], ["faire le tour du monde", "dar la vuelta al mundo", "to travel around the world", ""], ["à ta place", "en tu lugar", "if I were you", ""], ["imaginer", "imaginar", "to imagine", ""], ["au cas où", "por si", "in case", ""], ["choisir", "elegir", "to choose", ""], ["quitter", "dejar", "to leave (a place, a job, someone)", ""], ["aider", "ayudar", "to help", ""], ["les gens", "la gente", "people", "m pl"], ["le rêve", "el sueño", "dream", "m"], ["rêver", "soñar", "to dream", ""], ["parfait, parfaite", "perfecto", "perfect", ""], ["si seulement", "ojalá", "if only", ""], ["vraiment", "realmente", "really", ""], ["le temps", "el tiempo", "time", "m"], ["autre", "otro", "other", ""], ["dépendre de", "depender de", "to depend on", ""]], "type": [["If I won the lottery, I would travel around the world.", ["Si je gagnais au loto, je ferais le tour du monde.", "Si je gagnais le loto, je ferais le tour du monde."]], ["If I were you, I would choose the second one.", ["À ta place, je choisirais la deuxième.", "À ta place, je choisirais le deuxième.", "À votre place, je choisirais la deuxième."]], ["If we had more time, we would help you.", ["Si nous avions plus de temps, nous t'aiderions.", "Si on avait plus de temps, on t'aiderait."]], ["What would you do if you were rich?", ["Qu'est-ce que tu ferais si tu étais riche ?", "Que ferais-tu si tu étais riche ?"]], ["I would leave my job if I could.", ["Je quitterais mon travail si je pouvais.", "Je quitterais mon travail si je le pouvais."]], ["Call me in case there's a problem.", ["Appelle-moi au cas où il y aurait un problème.", "Appelez-moi au cas où il y aurait un problème."]]], "listen": ["Si j'étais toi, je ne dirais rien.", "Imagine que tu vis dans une autre ville.", "S'il faisait beau, on irait à la plage.", "Si seulement j'avais plus de temps !", "Les gens seraient plus heureux s'ils travaillaient moins."], "write": "Answer in about 180 words: if you could live anywhere in the world for a year, where would you go, what would you do, and what would change in your life? Use si + imparfait at least four times.", "speak": {"line": "Unit 23, what if", "task": "I'll ask you five 'what would you do if…' questions. Answer each one in at least three sentences, then ask me one of your own.", "phrases": [["Si j'étais…, je…", "If I were…, I would…"], ["À ta place,…", "If I were you,…"], ["Ça dépend de…", "It depends on…"]]}}, {"id": 24, "phase": 5, "title": "Regrets", "fr": "Les regrets", "level": "Advanced Low", "focus": "the conditionnel passé; si + plus-que-parfait; j'aurais dû, j'aurais pu", "words": [["j'aurais dû", "debería haber", "I should have", ""], ["j'aurais pu", "podría haber", "I could have", ""], ["le regret", "el arrepentimiento", "regret", "m"], ["la chance", "la suerte", "luck", "f"], ["avoir de la chance", "tener suerte", "to be lucky", ""], ["rater", "perder (un tren), suspender", "to miss, to fail", ""], ["prévenir", "avisar", "to warn, to let know", ""], ["suivre", "seguir", "to follow", ""], ["l'erreur", "el error", "mistake", "f"], ["se tromper", "equivocarse", "to be wrong", ""], ["au moins", "al menos", "at least", ""], ["tant pis", "qué le vamos a hacer", "too bad", ""], ["sinon", "si no", "otherwise", ""], ["accepter", "aceptar", "to accept", ""], ["l'occasion", "la oportunidad", "opportunity", "f"], ["refuser", "rechazar", "to refuse", ""], ["essayer", "intentar", "to try", ""], ["plus tôt", "más temprano", "earlier", ""]], "type": [["If I had known, I would have come.", ["Si j'avais su, je serais venu.", "Si j'avais su, je serais venue."]], ["You should have told me.", ["Tu aurais dû me le dire.", "Vous auriez dû me le dire."]], ["We could have taken the train.", ["Nous aurions pu prendre le train.", "On aurait pu prendre le train."]], ["If she had left earlier, she wouldn't have missed the plane.", ["Si elle était partie plus tôt, elle n'aurait pas raté l'avion."]], ["I made a mistake.", ["Je me suis trompé.", "Je me suis trompée.", "J'ai fait une erreur."]], ["Too bad, at least we tried.", ["Tant pis, au moins on a essayé.", "Tant pis, au moins nous avons essayé."]]], "listen": ["J'aurais dû accepter cette occasion.", "Si tu m'avais prévenu, je t'aurais aidé.", "Elle a eu de la chance.", "Sinon, nous aurions raté le début du film.", "Je regrette de ne pas avoir suivi ses conseils."], "write": "Write about 180 words about a decision you regret or a chance you missed. Explain what happened, what you should have done, and what would be different today.", "speak": {"line": "Unit 24, regrets", "task": "Tell me about a decision you'd make differently today. Explain what you did, what you should have done, and how your life would be different now.", "phrases": [["Si j'avais su,…", "If I had known,…"], ["J'aurais dû…", "I should have…"], ["Avec le recul,…", "Looking back,…"]]}}, {"id": 25, "phase": 5, "title": "Reported speech", "fr": "Le discours rapporté", "level": "Advanced Low", "focus": "indirect speech; tense changes; si, ce que and ce qui in reported questions; shifting time words", "words": [["demander", "preguntar, pedir", "to ask", ""], ["répondre", "responder", "to answer", ""], ["expliquer", "explicar", "to explain", ""], ["promettre", "prometer", "to promise", ""], ["ajouter", "añadir", "to add", ""], ["affirmer", "afirmar", "to state, to claim", ""], ["ce que", "lo que", "what (object)", ""], ["ce qui", "lo que", "what (subject)", ""], ["la nouvelle", "la noticia", "piece of news", "f"], ["la réunion", "la reunión", "meeting", "f"], ["ce jour-là", "ese día", "that day", ""], ["d'après", "según", "according to", ""], ["selon", "según", "according to", ""], ["apparemment", "aparentemente", "apparently", ""], ["vouloir dire", "querer decir", "to mean", ""]], "type": [["He said that he was tired.", ["Il a dit qu'il était fatigué."]], ["She asked me if I wanted to come.", ["Elle m'a demandé si je voulais venir."]], ["I asked him what he was doing.", ["Je lui ai demandé ce qu'il faisait."]], ["They promised that they would call.", ["Ils ont promis qu'ils appelleraient.", "Elles ont promis qu'elles appelleraient."]], ["According to the forecast, it will rain tomorrow.", ["D'après la météo, il pleuvra demain.", "Selon la météo, il pleuvra demain."]], ["She explained what had happened.", ["Elle a expliqué ce qui s'était passé."]]], "listen": ["Il m'a répondu qu'il ne savait pas.", "Elle a annoncé qu'elle partirait le lendemain.", "Apparemment, la réunion a été annulée.", "Il a ajouté qu'il avait déjà réservé une chambre.", "Je ne comprends pas ce qu'il veut dire."], "write": "Report a conversation you had recently, in about 180 words, entirely in indirect speech: what the other person said, asked and promised, and what you answered.", "speak": {"line": "Unit 25, passing on a message", "task": "I'll leave you a long voicemail in French. Then report it to me in indirect speech, as if you were telling a third person what I said.", "phrases": [["Il a dit que…", "He said that…"], ["Elle m'a demandé si…", "She asked me whether…"], ["D'après lui,…", "According to him,…"]]}}, {"id": 26, "phase": 5, "title": "Housing and services", "fr": "Le logement", "level": "Advanced Low", "focus": "dont, lequel and ce dont; renting; solving a problem with a service", "words": [["le logement", "la vivienda", "housing", "m"], ["le loyer", "el alquiler", "rent", "m"], ["louer", "alquilar", "to rent", ""], ["le, la propriétaire", "el, la propietario", "landlord, owner", "m/f"], ["le, la locataire", "el, la inquilino", "tenant", "m/f"], ["le chauffage", "la calefacción", "heating", "m"], ["la fuite", "la fuga", "leak", "f"], ["réparer", "reparar", "to repair", ""], ["le plombier", "el fontanero", "plumber", "m"], ["dont", "del que, cuyo", "of which, whose", ""], ["lequel, laquelle", "el cual, la cual", "which", ""], ["ce dont", "lo que (de)", "what … of", ""], ["avoir besoin de", "necesitar", "to need", ""], ["le contrat", "el contrato", "lease, contract", "m"], ["signer", "firmar", "to sign", ""], ["la caution", "la fianza", "deposit", "f"], ["compris, comprise", "incluido", "included", ""], ["meublé, meublée", "amueblado", "furnished", ""], ["le voisin, la voisine", "el vecino, la vecina", "neighbor", "m/f"], ["l'immeuble", "el edificio", "apartment building", "m"], ["rapidement", "rápidamente", "quickly", ""], ["payer", "pagar", "to pay", ""], ["le fils, la fille", "el hijo, la hija", "son, daughter", "m/f"], ["la raison", "la razón", "reason", "f"], ["voilà", "ahí está", "there is, that's", ""], ["augmenter", "aumentar", "to increase", ""]], "type": [["The apartment I told you about is furnished.", ["L'appartement dont je t'ai parlé est meublé."]], ["The heating doesn't work and there's a leak.", ["Le chauffage ne marche pas et il y a une fuite."]], ["That's what I need.", ["C'est ce dont j'ai besoin."]], ["Is heating included in the rent?", ["Le chauffage est compris dans le loyer ?", "Est-ce que le chauffage est compris dans le loyer ?"]], ["The landlord must repair it quickly.", ["Le propriétaire doit le réparer rapidement.", "Le propriétaire doit la réparer rapidement."]], ["The building in which I live is very noisy.", ["L'immeuble dans lequel j'habite est très bruyant."]]], "listen": ["Il faut signer le contrat et payer la caution.", "Ma voisine, dont le fils est médecin, est très gentille.", "Le plombier viendra demain matin.", "Voilà la raison pour laquelle je déménage.", "Le loyer a encore augmenté."], "write": "Write a formal email of about 180 words to your landlord about a problem in your apartment: describe it, say since when, explain what it's causing, and ask for a repair by a specific date.", "speak": {"line": "Unit 26, calling the landlord", "task": "Call me, your landlord, about a serious problem in the apartment. I'll be unhelpful at first. Stay polite, insist, and get a firm date for the repair.", "phrases": [["Je vous appelle au sujet de…", "I'm calling about…"], ["C'est urgent parce que…", "It's urgent because…"], ["Pouvez-vous me confirmer…", "Can you confirm…"]]}}, {"id": 27, "phase": 5, "title": "Professional French", "fr": "Le français professionnel", "level": "Advanced Low", "focus": "formal register; professional emails and calls; veuillez and the polite conditional", "words": [["l'ordre du jour", "el orden del día", "agenda", "m"], ["le dossier", "el expediente, la carpeta", "file, case", "m"], ["le délai", "el plazo", "deadline, time frame", "m"], ["le rapport", "el informe", "report", "m"], ["joindre", "adjuntar", "to attach", ""], ["la pièce jointe", "el archivo adjunto", "attachment", "f"], ["ci-joint", "adjunto", "attached", ""], ["veuillez", "le ruego", "please (formal)", ""], ["cordialement", "saludos cordiales", "best regards", ""], ["Madame, Monsieur", "Estimado señor, estimada señora", "Dear Sir or Madam", ""], ["je vous remercie", "le agradezco", "thank you (formal)", ""], ["disponible", "disponible", "available", ""], ["le client, la cliente", "el cliente, la clienta", "client", "m/f"], ["la proposition", "la propuesta", "proposal", "f"], ["confirmer", "confirmar", "to confirm", ""], ["fixer un rendez-vous", "concertar una cita", "to set up a meeting", ""], ["reporter", "aplazar", "to postpone", ""], ["la réponse", "la respuesta", "answer, reply", "f"], ["vendredi", "viernes", "Friday", "m"], ["écrire", "escribir", "to write", ""], ["au sujet de", "acerca de", "about, regarding", ""], ["dans l'attente de votre réponse", "a la espera de su respuesta", "I look forward to your reply", ""], ["notre, nos", "nuestro, nuestros", "our", ""]], "type": [["Please find the report attached.", ["Veuillez trouver ci-joint le rapport.", "Vous trouverez le rapport en pièce jointe."]], ["Are you available on Monday for a meeting?", ["Êtes-vous disponible lundi pour une réunion ?", "Est-ce que vous êtes disponible lundi pour une réunion ?", "Vous êtes disponible lundi pour une réunion ?"]], ["We have to postpone the meeting.", ["Nous devons reporter la réunion.", "Il faut reporter la réunion."]], ["Thank you for your reply.", ["Je vous remercie de votre réponse.", "Je vous remercie pour votre réponse.", "Merci pour votre réponse."]], ["The deadline is Friday.", ["Le délai est vendredi.", "La date limite est vendredi."]], ["Could you confirm the time of the meeting?", ["Pourriez-vous confirmer l'heure de la réunion ?", "Pouvez-vous confirmer l'heure de la réunion ?"]]], "listen": ["Madame, Monsieur, je vous écris au sujet de votre proposition.", "Le client attend notre réponse.", "Je vous envoie le dossier en pièce jointe.", "Pouvons-nous fixer un rendez-vous la semaine prochaine ?", "Dans l'attente de votre réponse, cordialement."], "write": "Write a formal email of about 180 words to a client: confirm a meeting, propose an agenda of three points, attach a document, and close politely.", "speak": {"line": "Unit 27, a business call", "task": "Business phone call: I'm a client. Introduce yourself and your company, present a proposal, handle my objection about the price, and set up a meeting.", "phrases": [["Je me permets de vous appeler…", "I'm taking the liberty of calling you…"], ["Je comprends tout à fait, mais…", "I completely understand, but…"], ["Seriez-vous disponible…", "Would you be available…"]]}}, {"id": 28, "phase": 6, "title": "The environment", "fr": "L'environnement", "level": "Advanced Mid", "focus": "the passive voice; on and se as alternatives; cause with à cause de and grâce à; de plus en plus", "words": [["l'environnement", "el medio ambiente", "environment", "m"], ["la pollution", "la contaminación", "pollution", "f"], ["le climat", "el clima", "climate", "m"], ["le réchauffement climatique", "el calentamiento global", "global warming", "m"], ["protéger", "proteger", "to protect", ""], ["recycler", "reciclar", "to recycle", ""], ["les déchets", "los residuos", "waste", "m pl"], ["l'énergie", "la energía", "energy", "f"], ["renouvelable", "renovable", "renewable", ""], ["la planète", "el planeta", "planet", "f"], ["polluer", "contaminar", "to pollute", ""], ["réduire", "reducir", "to reduce", ""], ["consommer", "consumir", "to consume", ""], ["le gouvernement", "el gobierno", "government", "m"], ["la loi", "la ley", "law", "f"], ["interdire", "prohibir", "to ban", ""], ["la mesure", "la medida", "measure", "f"], ["à cause de", "a causa de", "because of", ""], ["grâce à", "gracias a", "thanks to", ""], ["de plus en plus", "cada vez más", "more and more", ""], ["voter", "votar", "to vote", ""], ["le sac", "la bolsa", "bag", "m"], ["le plastique", "el plástico", "plastic", "m"], ["nouveau, nouvelle", "nuevo", "new", ""], ["la rivière", "el río", "river", "f"], ["électrique", "eléctrico", "electric", ""], ["agir", "actuar", "to act", ""], ["chaud, chaude", "caliente, caluroso", "hot, warm", ""]], "type": [["Waste is recycled in this city.", ["Les déchets sont recyclés dans cette ville."]], ["This law was voted last year.", ["Cette loi a été votée l'année dernière."]], ["We must reduce pollution.", ["Nous devons réduire la pollution.", "Il faut réduire la pollution."]], ["Because of global warming, summers are hotter and hotter.", ["À cause du réchauffement climatique, les étés sont de plus en plus chauds."]], ["Thanks to renewable energy, we pollute less.", ["Grâce aux énergies renouvelables, nous polluons moins.", "Grâce à l'énergie renouvelable, on pollue moins."]], ["Plastic bags have been banned.", ["Les sacs en plastique ont été interdits."]]], "listen": ["Le gouvernement a pris de nouvelles mesures pour protéger la planète.", "On consomme de plus en plus d'énergie.", "Cette rivière est très polluée.", "Les voitures électriques se vendent bien.", "Il est temps d'agir."], "write": "Write about 200 words: what are the two most serious environmental problems where you live, what causes them, and what should be done? Use the passive at least twice.", "speak": {"line": "Unit 28, the environment", "task": "Debate: should cars be banned from city centers? Take a position, give three arguments with concrete examples, and answer my counterarguments.", "phrases": [["D'un côté…, de l'autre…", "On one hand…, on the other…"], ["Il faudrait que…", "It would be necessary to…"], ["Prenons l'exemple de…", "Take the example of…"]]}}, {"id": 29, "phase": 6, "title": "News and current events", "fr": "L'actualité", "level": "Advanced Mid", "focus": "news vocabulary; the conditional for unconfirmed news; nominalization in headlines", "words": [["l'actualité", "la actualidad", "current events", "f"], ["le journal", "el periódico, el telediario", "newspaper, news", "m"], ["l'article", "el artículo", "article", "m"], ["le, la journaliste", "el, la periodista", "journalist", "m/f"], ["l'événement", "el acontecimiento", "event", "m"], ["l'élection", "la elección", "election", "f"], ["le président, la présidente", "el presidente, la presidenta", "president", "m/f"], ["la grève", "la huelga", "strike", "f"], ["la manifestation", "la manifestación", "protest", "f"], ["le titre", "el titular", "headline", "m"], ["le témoin", "el testigo", "witness", "m"], ["l'accident", "el accidente", "accident", "m"], ["blessé, blessée", "herido", "injured", ""], ["la hausse", "la subida", "rise", "f"], ["la baisse", "la bajada", "fall, drop", "f"], ["le prix", "el precio", "price", "m"], ["l'enquête", "la investigación", "investigation, survey", "f"], ["il paraît que", "parece que", "apparently", ""], ["démissionner", "dimitir", "to resign", ""], ["les transports", "el transporte", "public transport", "m pl"], ["des milliers", "miles", "thousands", ""], ["participer", "participar", "to take part", ""], ["la personne", "la persona", "person", "f"], ["avoir lieu", "tener lugar", "to take place", ""]], "type": [["According to witnesses, the accident happened at noon.", ["Selon les témoins, l'accident s'est passé à midi.", "D'après les témoins, l'accident a eu lieu à midi."]], ["The president has reportedly resigned.", ["Le président aurait démissionné."]], ["There's a strike in public transport tomorrow.", ["Il y a une grève demain dans les transports.", "Demain, il y a une grève dans les transports."]], ["Prices are rising again.", ["Les prix augmentent encore."]], ["Thousands of people took part in the protest.", ["Des milliers de personnes ont participé à la manifestation."]], ["Apparently, two people were injured.", ["Il paraît que deux personnes ont été blessées."]]], "listen": ["Hausse des prix : les Français inquiets.", "Une enquête a été ouverte après l'accident.", "Le journal de vingt heures a parlé de l'élection.", "La présidente aurait annoncé de nouvelles mesures.", "Grève des trains : il y aura peu de trains demain."], "write": "Summarize a news story you followed recently in about 200 words, as a journalist would: what happened, who was involved, what the reactions were, and what may happen next.", "speak": {"line": "Unit 29, the news", "task": "Present a current news story to me in two minutes, as if on the radio. Then answer my questions about its causes, its consequences and your opinion.", "phrases": [["Selon les dernières informations,…", "According to the latest reports,…"], ["Il semblerait que…", "It would seem that…"], ["Reste à savoir si…", "It remains to be seen whether…"]]}}, {"id": 30, "phase": 6, "title": "Education and society", "fr": "L'éducation", "level": "Advanced Mid", "focus": "the gerund (en + -ant); tout en; the present participle in writing; en train de", "words": [["l'éducation", "la educación", "education", "f"], ["le lycée", "el instituto", "high school", "m"], ["l'élève", "el alumno, la alumna", "pupil, student", "m/f"], ["l'enseignant, l'enseignante", "el, la docente", "teacher", "m/f"], ["enseigner", "enseñar", "to teach", ""], ["la note", "la nota", "grade", "f"], ["l'échec", "el fracaso", "failure", "m"], ["gratuit, gratuite", "gratuito", "free (no cost)", ""], ["l'égalité", "la igualdad", "equality", "f"], ["le système", "el sistema", "system", "m"], ["la société", "la sociedad", "society", "f"], ["obligatoire", "obligatorio", "compulsory", ""], ["le niveau", "el nivel", "level", "m"], ["progresser", "progresar", "to progress", ""], ["la lecture", "la lectura", "reading", "f"], ["tout en", "sin dejar de", "while (also)", ""], ["la radio", "la radio", "radio", "f"], ["entre", "entre", "between, among", ""], ["pratiquer", "practicar", "to practice", ""], ["s'améliorer", "mejorar", "to improve", ""], ["différent, différente", "diferente", "different", ""], ["important, importante", "importante", "important", ""], ["en train de", "estar + gerundio", "in the middle of", ""]], "type": [["I learned French by listening to the radio.", ["J'ai appris le français en écoutant la radio."]], ["She works while studying.", ["Elle travaille tout en faisant ses études.", "Elle travaille en étudiant."]], ["School is free and compulsory.", ["L'école est gratuite et obligatoire."]], ["Teachers want more equality between pupils.", ["Les enseignants veulent plus d'égalité entre les élèves."]], ["You progress by practicing every day.", ["On progresse en pratiquant tous les jours.", "Tu progresses en pratiquant tous les jours."]], ["The pupils' level has improved.", ["Le niveau des élèves s'est amélioré."]]], "listen": ["En arrivant à l'école, j'ai vu mes amis.", "Elle a eu de bonnes notes cette année.", "Le système français est très différent du système américain.", "Il a réussi son examen en travaillant beaucoup.", "La lecture est importante pour progresser."], "write": "Write about 200 words comparing education in your country with what you know about France: cost, structure, and one thing you'd change. Use the gerund at least three times.", "speak": {"line": "Unit 30, education", "task": "Should university be free for everyone? Give your opinion with arguments and examples, compare two countries, and respond to my objections.", "phrases": [["En ce qui concerne…", "As far as … is concerned,"], ["Ce qui me frappe, c'est que…", "What strikes me is that…"], ["À mon sens,…", "In my view,…"]]}}, {"id": 31, "phase": 6, "title": "Health and society", "fr": "Santé et société", "level": "Advanced Mid", "focus": "cause, consequence and purpose: puisque, comme, si bien que, par conséquent, afin de, afin que; faire + infinitive", "words": [["le système de santé", "el sistema de salud", "health care system", "m"], ["l'hôpital", "el hospital", "hospital", "m"], ["le patient, la patiente", "el, la paciente", "patient", "m/f"], ["le soin", "el cuidado", "care, treatment", "m"], ["la maladie", "la enfermedad", "illness", "f"], ["la prévention", "la prevención", "prevention", "f"], ["le vaccin", "la vacuna", "vaccine", "m"], ["vacciner", "vacunar", "to vaccinate", ""], ["le stress", "el estrés", "stress", "m"], ["l'alimentation", "la alimentación", "diet, food", "f"], ["puisque", "ya que", "since (known reason)", ""], ["comme", "como", "as, since", ""], ["si bien que", "de modo que", "so that (result)", ""], ["c'est pourquoi", "por eso", "that's why", ""], ["afin de", "a fin de", "in order to", ""], ["afin que", "a fin de que", "so that", ""], ["par conséquent", "por consiguiente", "consequently", ""], ["provoquer", "provocar", "to cause", ""], ["éviter", "evitar", "to avoid", ""], ["vieillir", "envejecer", "to age", ""], ["la population", "la población", "population", "f"], ["la route", "la carretera", "road", "f"], ["dangereux, dangereuse", "peligroso", "dangerous", ""], ["rentrer", "volver (a casa)", "to go back home", ""], ["permettre", "permitir", "to allow", ""]], "type": [["Since you're sick, stay home.", ["Puisque tu es malade, reste à la maison.", "Comme tu es malade, reste à la maison."]], ["Stress can cause many illnesses.", ["Le stress peut provoquer beaucoup de maladies."]], ["Eat better in order to avoid problems.", ["Mange mieux afin d'éviter des problèmes.", "Mangez mieux afin d'éviter des problèmes."]], ["The population is aging, that's why we need more hospitals.", ["La population vieillit, c'est pourquoi nous avons besoin de plus d'hôpitaux."]], ["It rained a lot, so the roads were dangerous.", ["Il a beaucoup plu, si bien que les routes étaient dangereuses."]], ["The doctor explained everything so that I'd understand.", ["Le médecin a tout expliqué afin que je comprenne.", "Le médecin a tout expliqué pour que je comprenne."]]], "listen": ["Comme il était fatigué, il est rentré tôt.", "La prévention coûte moins cher que les soins.", "Par conséquent, il faut se faire vacciner.", "Une bonne alimentation permet d'éviter beaucoup de maladies.", "Les patients attendent des heures à l'hôpital."], "write": "Write about 200 words: what are the main health problems in modern society, what causes them, and what can individuals and governments do? Use at least five expressions of cause, consequence or purpose.", "speak": {"line": "Unit 31, health and society", "task": "Explain to me how the health system works in your country, its main strengths and weaknesses, and one reform you'd propose and why.", "phrases": [["Cela s'explique par…", "This is explained by…"], ["C'est pourquoi…", "That's why…"], ["Afin de…", "In order to…"]]}}, {"id": 32, "phase": 6, "title": "Culture and the arts", "fr": "La culture", "level": "Advanced High", "focus": "evaluating works; adverbs in -ment and where they go; nuanced adjectives", "words": [["l'œuvre", "la obra", "work (of art)", "f"], ["le tableau", "el cuadro", "painting", "m"], ["le, la peintre", "el, la pintor", "painter", "m/f"], ["le roman", "la novela", "novel", "m"], ["l'auteur, l'autrice", "el autor, la autora", "author", "m/f"], ["le personnage", "el personaje", "character", "m"], ["la pièce de théâtre", "la obra de teatro", "play", "f"], ["l'exposition", "la exposición", "exhibition", "f"], ["le musée", "el museo", "museum", "m"], ["émouvant, émouvante", "conmovedor", "moving", ""], ["ennuyeux, ennuyeuse", "aburrido", "boring", ""], ["passionnant, passionnante", "apasionante", "fascinating", ""], ["décevant, décevante", "decepcionante", "disappointing", ""], ["la critique", "la crítica", "review, criticism",
